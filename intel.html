    <script>

        /* ================================================== */
        /* SUPABASE */
        /* ================================================== */

        const SUPABASE_URL =
            'https://mtlozyseibrefhxnocvb.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ================================================== */
        /* GLOBALS */
        /* ================================================== */

        let currentUser = null;
        let currentOfficer = null;
        let currentRole = null;
        let scaAgents = [];
        let nonScuReports = [];


        /* ================================================== */
        /* FULL INTEL ACCESS */
        /* ================================================== */

        const fullAccessRoles = [
            'master',
            'investigator',
            'case_lead'
        ];


        function hasFullIntelAccess() {

            return fullAccessRoles.includes(
                currentRole
            );

        }


        /* ================================================== */
        /* ESCAPE HELPERS */
        /* ================================================== */

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

        }


        /* ================================================== */
        /* CLEAN INTEL TEXT */
        /* ================================================== */

        function cleanIntelText(value) {

            return String(value ?? '').trim();

        }


        /* ================================================== */
        /* LOAD CURRENT USER */
        /* ================================================== */

        async function loadCurrentUser() {

            const {
                data: {
                    session
                },
                error
            } = await supabaseClient.auth.getSession();


            if (error || !session) {

                window.location.href = 'index.html';

                return false;

            }


            currentUser =
                session.user;


            if (!currentUser || !currentUser.id) {

                console.error(
                    'No authenticated user ID was found.'
                );

                alert(
                    'Unable to identify the logged-in officer.'
                );

                return false;

            }


            const {
                data: officer,
                error: officerError
            } = await supabaseClient

                .from('officers')

                .select(`
                    id,
                    full_name,
                    rank,
                    role,
                    active,
                    callsign,
                    portal_title
                `)

                .eq(
                    'id',
                    currentUser.id
                )

                .single();


            if (officerError || !officer) {

                console.error(
                    'Officer loading error:',
                    officerError
                );

                document.getElementById(
                    'intel-list'
                ).innerHTML = `
                    <div class="empty">
                        Unable to load your officer profile.
                    </div>
                `;

                return false;

            }


            currentOfficer =
                officer;

            currentRole =
                officer.role;


            console.log(
                'CURRENT USER ID:',
                currentUser.id
            );

            console.log(
                'CURRENT OFFICER ID:',
                currentOfficer.id
            );

            console.log(
                'CURRENT ROLE:',
                currentRole
            );


            return true;

        }


        /* ================================================== */
        /* LOAD ACTIVE SCU AGENTS */
        /* ================================================== */

        async function loadScuAgents() {

            const {
                data,
                error
            } = await supabaseClient

                .from('officers')

                .select(
                    'id, full_name, rank, callsign'
                )

                .eq(
                    'is_scu_agent',
                    true
                )

                .eq(
                    'active',
                    true
                );


            if (error) {

                console.error(
                    'SCU agent loading error:',
                    error
                );

                scaAgents = [];

                return;

            }


            const rankOrder = {

    'Head of SCU': 1,
    'Assistant Head of SCU': 2,
    'Head of Weapons': 3,
    'Head of Drugs': 4,
    'Head of Gangs': 5,
    'Detective': 6

};


            const filteredAgents =
                (data || []).filter(
                    agent => {

                        const rank =
                            (agent.rank || '').trim();

                        return Object.prototype.hasOwnProperty.call(
                            rankOrder,
                            rank
                        );

                    }
                );


            filteredAgents.sort(
                (a, b) => {

                    const rankA =
                        (a.rank || '').trim();

                    const rankB =
                        (b.rank || '').trim();


                    const rankDifference =
                        rankOrder[rankA] -
                        rankOrder[rankB];


                    if (
                        rankDifference !== 0
                    ) {

                        return rankDifference;

                    }


                    const nameA =
                        (a.full_name || '')
                            .trim()
                            .toLowerCase();

                    const nameB =
                        (b.full_name || '')
                            .trim()
                            .toLowerCase();


                    return nameA.localeCompare(
                        nameB
                    );

                }
            );


            scaAgents =
                filteredAgents;

        }


        /* ================================================== */
        /* LOAD NON-SCU REPORTS */
        /* ================================================== */

        async function loadNonScuReports() {

            nonScuReports = [];


            if (
                !hasFullIntelAccess()
            ) {

                return;

            }


            const {
                data,
                error
            } = await supabaseClient

                .from('non_scu_intel_submissions')

                .select(`
                    id,
                    reporter_name,
                    reporter_callsign,
                    intel_type,
                    finding,
                    location,
                    source,
                    evidence,
                    created_at,
                    status
                `)

                .eq(
                    'status',
                    'unassigned'
                )

                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    'NON-SCU intelligence loading error:',
                    error
                );

                return;

            }


            nonScuReports =
                data || [];

        }


        /* ================================================== */
        /* BUILD AGENT LIST */
        /* ================================================== */

        function buildAgentList(
            reportId,
            selectedRecipientIds = []
        ) {

            const agentsPerColumn = 8;

            const selectedIds =
                Array.isArray(selectedRecipientIds)
                    ? selectedRecipientIds
                    : (
                        selectedRecipientIds
                            ? [selectedRecipientIds]
                            : []
                    );


            const numberOfColumns =
                Math.max(
                    1,
                    Math.ceil(
                        scaAgents.length /
                        agentsPerColumn
                    )
                );


            const columns = [];


            for (
                let i = 0;
                i < numberOfColumns;
                i++
            ) {

                columns.push([]);

            }


            scaAgents.forEach(
                (agent, index) => {

                    const columnIndex =
                        Math.floor(
                            index /
                            agentsPerColumn
                        );


                    columns[
                        columnIndex
                    ].push(
                        agent
                    );

                }
            );


            return columns

                .map(
                    column => `

                        <div class="agent-column">

                            ${
                                column
                                    .map(
                                        agent => `

                                            <label class="agent-option">

                                                <input
                                                    type="checkbox"
                                                    class="reassign-checkbox"
                                                    value="${escapeAttribute(agent.id)}"
                                                    data-intel-id="${escapeAttribute(reportId)}"
                                                    ${
                                                        selectedIds.includes(agent.id)
                                                            ? 'checked'
                                                            : ''
                                                    }
                                                >

                                                <span class="agent-name">
                                                    ${escapeHtml(
                                                        `${agent.rank || ''} ${agent.full_name || 'SCU Agent'}${agent.callsign ? ' — ' + agent.callsign : ''}`.trim()
                                                    )}
                                                </span>

                                            </label>

                                        `
                                    )
                                    .join('')
                            }

                        </div>

                    `
                )

                .join('');

        }

        /* LOAD INTELLIGENCE */

                if (!officersError) {

                    (officers || [])
                        .forEach(
                            officer => {

                                officersMap[
                                    officer.id
                                ] = officer;

                            }
                        );

            }

        /* ================================================== */
        /* ASSIGN EXISTING SCU INTEL */
        /* ================================================== */

        async function assignIntel(
            intelId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const selectedCheckboxes =
                Array.from(
                    document.querySelectorAll(
                        `.reassign-checkbox[data-intel-id="${intelId}"]:checked`
                    )
                );


            if (
                selectedCheckboxes.length === 0
            ) {

                alert(
                    'Please select at least one SCU officer.'
                );

                return;

            }


            const recipientIds =
                selectedCheckboxes.map(
                    checkbox => checkbox.value
                );


            const selectedAgents =
                scaAgents.filter(
                    agent =>
                        recipientIds.includes(agent.id)
                );


            const recipientNames =
                selectedAgents
                    .map(
                        agent =>
                            `${agent.rank || ''} ${agent.full_name || 'SCU Agent'}`.trim()
                    )
                    .join(', ');


            if (
                !confirm(
                    `Send this intelligence to ${recipientNames || 'the selected officers'}?`
                )
            ) {

                return;

            }


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (button) {

                button.disabled = true;
                button.textContent = 'SENDING...';

            }


            let sourceRow = null;


            const {
                data: directRow,
                error: directError
            } = await supabaseClient

                .from('intel_submissions')

                .select('*')

                .eq(
                    'id',
                    intelId
                )

                .maybeSingle();


            if (!directError && directRow) {

                sourceRow = directRow;

            }

            else {

                const {
                    data: groupRows,
                    error: groupError
                } = await supabaseClient

                    .from('intel_submissions')

                    .select('*')

                    .eq(
                        'intel_group_id',
                        intelId
                    )

                    .limit(1);


                if (!groupError && groupRows && groupRows.length > 0) {

                    sourceRow = groupRows[0];

                }

            }


            if (!sourceRow) {

                alert(
                    'Unable to find the intelligence to assign.'
                );

                if (button) {

                    button.disabled = false;
                    button.textContent = 'REASSIGN INTEL';

                }

                return;

            }


            const groupId =
                sourceRow.intel_group_id ||
                sourceRow.id;


            const {
                data: existingRows,
                error: existingError
            } = await supabaseClient

                .from('intel_submissions')

                .select('*')

                .eq(
                    'intel_group_id',
                    groupId
                );


            if (existingError) {

                console.error(
                    'Intel group loading error:',
                    existingError
                );

                alert(
                    `Unable to load the existing recipients.\n\n${existingError.message || existingError}`
                );

                if (button) {

                    button.disabled = false;
                    button.textContent = 'REASSIGN INTEL';

                }

                return;

            }


            let rows =
                existingRows || [];


            if (
                rows.length === 0
            ) {

                rows = [sourceRow];

            }


            const existingRecipientIds =
                rows
                    .map(
                        row => row.recipient_id
                    )
                    .filter(Boolean);


            const sourceCopy = {
                ...sourceRow
            };


            delete sourceCopy.id;


            const sourceRecipientId =
                sourceRow.recipient_id;


            if (
                !sourceRecipientId &&
                recipientIds.length > 0
            ) {

                const firstRecipientId =
                    recipientIds[0];


                const {
                    error: sourceUpdateError
                } = await supabaseClient

                    .from('intel_submissions')

                    .update({
                        recipient_id:
                            firstRecipientId,
                        intel_group_id:
                            groupId
                    })

                    .eq(
                        'id',
                        sourceRow.id
                    );


                if (sourceUpdateError) {

                    console.error(
                        'Intel source assignment error:',
                        sourceUpdateError
                    );

                    alert(
                        `Unable to assign intelligence.\n\n${sourceUpdateError.message || sourceUpdateError}`
                    );

                    if (button) {

                        button.disabled = false;
                        button.textContent = 'SEND INTEL';

                    }

                    return;

                }

            }


            const rowsAfterSourceUpdate =
                rows.map(
                    row =>
                        row.id === sourceRow.id
                            ? {
                                ...row,
                                recipient_id:
                                    row.recipient_id || recipientIds[0],
                                intel_group_id:
                                    groupId
                            }
                            : row
                );


            const rowsToDelete =
                rowsAfterSourceUpdate.filter(
                    row =>
                        row.recipient_id &&
                        !recipientIds.includes(row.recipient_id)
                );


            for (const row of rowsToDelete) {

                const {
                    error: deleteError
                } = await supabaseClient

                    .from('intel_submissions')

                    .delete()

                    .eq(
                        'id',
                        row.id
                    );


                if (deleteError) {

                    console.error(
                        'Intel recipient removal error:',
                        deleteError
                    );

                    alert(
                        `Unable to remove an old recipient.\n\n${deleteError.message || deleteError}`
                    );

                    if (button) {

                        button.disabled = false;
                        button.textContent = 'REASSIGN INTEL';

                    }

                    return;

                }

            }


            const remainingRecipientIds =
                rowsAfterSourceUpdate
                    .filter(
                        row =>
                            row.recipient_id &&
                            !rowsToDelete.some(
                                deleted =>
                                    deleted.id === row.id
                            )
                    )
                    .map(
                        row => row.recipient_id
                    );


            const missingRecipientIds =
                recipientIds.filter(
                    recipientId =>
                        !remainingRecipientIds.includes(recipientId)
                );


            if (
                missingRecipientIds.length > 0
            ) {

                const newRows =
                    missingRecipientIds.map(
                        recipientId => {

                            const newRow = {
                                ...sourceCopy,
                                recipient_id:
                                    recipientId,
                                intel_group_id:
                                    groupId
                            };

                            delete newRow.id;

                            return newRow;

                        }
                    );


                const {
                    error: insertError
                } = await supabaseClient

                    .from('intel_submissions')

                    .insert(
                        newRows
                    );


                if (insertError) {

                    console.error(
                        'Intel recipient insert error:',
                        insertError
                    );

                    alert(
                        `Unable to add the selected recipients.\n\n${insertError.message || insertError}`
                    );

                    if (button) {

                        button.disabled = false;
                        button.textContent = 'REASSIGN INTEL';

                    }

                    return;

                }

            }


            await loadIntel();

        }

                            'NON-SCU MEMBER INTELLIGENCE',

                        intel_type:
                            report.intel_type ||
                            'NON-SCU MEMBER REPORT',

                        finding:
                            report.finding ||
                            '',

                        location:
                            report.location ||
                            null,

                        source:
                            reporterSource

                    })
                );


            const {
                data: insertedIntel,
                error: insertError
            } = await supabaseClient

                .from('intel_submissions')

                .insert(
                    rowsToInsert
                )

                .select();


            if (
                insertError
            ) {

                console.error(
                    'NON-SCU conversion error:',
                    insertError
                );

                alert(
                    `Unable to send NON-SCU intelligence.\n\n${insertError.message || insertError}`
                );

                if (button) {

                    button.disabled = false;
                    button.textContent = 'SEND INTEL';

                }

                return;

            }


            console.log(
                'NON-SCU INTEL CREATED:',
                insertedIntel
            );


            const {
                error: statusError
            } = await supabaseClient

                .from('non_scu_intel_submissions')

                .update({
                    status:
                        'assigned'
                })

                .eq(
                    'id',
                    reportId
                );


            if (
                statusError
            ) {

                console.error(
                    'NON-SCU status update error:',
                    statusError
                );

                alert(
                    'The intelligence was sent successfully, but the original NON-SCU report could not be marked as assigned. Please refresh the page and check the queue.'
                );

                await loadIntel();

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE EXISTING SCU INTEL */
        /* ================================================== */

        async function deleteIntel(
            intelId
        ) {

            const {
                data: intelRecord,
                error: intelCheckError
            } = await supabaseClient

                .from('intel_submissions')

                .select(
                    'recipient_id'
                )

                .eq(
                    'id',
                    intelId
                )

                .single();


            if (
                intelCheckError ||
                !intelRecord
            ) {

                console.error(
                    'Intel permission check error:',
                    intelCheckError
                );

                alert(
                    'Unable to verify this intelligence.'
                );

                return;

            }


            const canDelete =
                hasFullIntelAccess()
                ||
                (
                    intelRecord.recipient_id &&
                    intelRecord.recipient_id === currentUser.id
                );


            if (!canDelete) {

                alert(
                    'You do not have permission to delete this intelligence.'
                );

                return;

            }


            if (
                !confirm(
                    'Are you sure you want to permanently delete this intelligence?'
                )
            ) {

                return;

            }


            const {
                error
            } = await supabaseClient

                .from('intel_submissions')

                .delete()

                .eq(
                    'id',
                    intelId
                );


            if (error) {

                console.error(
                    'Intel deletion error:',
                    error
                );

                alert(
                    `Unable to delete intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE NON-SCU INTEL */
        /* ================================================== */

        async function deleteNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to delete NON-SCU intelligence.'
                );

                return;

            }


            const report =
                nonScuReports.find(
                    item =>
                        item.id === reportId
                );


            if (!report) {

                alert(
                    'Unable to find this NON-SCU intelligence report.'
                );

                return;

            }


            if (
                !confirm(
                    'DELETE BOGUS REPORT?\n\nThis will permanently delete this NON-SCU intelligence report and it cannot be recovered.'
                )
            ) {

                return;

            }


            const {
                error
            } = await supabaseClient

                .from('non_scu_intel_submissions')

                .delete()

                .eq(
                    'id',
                    reportId
                );


            if (error) {

                console.error(
                    'NON-SCU intelligence deletion error:',
                    error
                );

                alert(
                    `Unable to delete NON-SCU intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* INITIALISE */
        /* ================================================== */

        async function initialise() {

            const userLoaded =
                await loadCurrentUser();


            if (!userLoaded) {

                return;

            }


            await loadScuAgents();


            if (
                hasFullIntelAccess()
            ) {

                document.getElementById(
                    'page-description'
                ).textContent =
                    'All intelligence submissions across the SCU system. NON-SCU member reports appear here for triage and assignment.';

            }


            await loadIntel();

        }


        initialise();

    </script>

</body>

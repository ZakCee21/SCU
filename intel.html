// ======================================================

async function checkLogin() {


    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    currentUser =
        session.user;


    // --------------------------------------------------
    // Get logged-in officer role
    // --------------------------------------------------

        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, active'
        )

        .eq(
            'id',
            currentUser.id
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );


        document
            .getElementById('intelList')
            .innerHTML = `

                <div class="error">

                    Unable to verify officer access.

                </div>

            `;

        return;

    }


    currentUserRole =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    console.log(
        'Current user role:',
        currentUserRole
    );


    // --------------------------------------------------
    // Change page heading for full-access users
    // --------------------------------------------------

    if (
        hasFullIntelAccess()
    ) {

        document
            .getElementById('pageTitle')
            .textContent =
                'All SCU Intelligence';


        document
            .getElementById('pageDescription')
            .textContent =
                'All intelligence submissions across the SCU system. Unassigned intelligence requires triage.';

    }


    await loadIntel();

}


// ======================================================

    ];

}


// ======================================================
// LOAD INTELLIGENCE
// ======================================================

async function loadIntel() {


    const intelList =
        document.getElementById(
            'intelList'
        );


    let query =
        supabaseClient

            .from(
                'intel_submissions'
            )

            .select('*');


    // --------------------------------------------------
    // Full access
    // --------------------------------------------------

    if (
        hasFullIntelAccess()
    ) {

        console.log(
            'FULL INTELLIGENCE ACCESS: Loading ALL intelligence'
        );

    } else {

        console.log(
            'STANDARD ACCESS: Loading received intelligence only'
        );


        query =
            query.eq(
                'recipient_id',
                currentUser.id
            );

    }


    const {
        data,
        error
    } = await query

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            'Load intel error:',
            error
        );


        intelList.innerHTML = `

            <div class="error">

                Unable to load intelligence.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    // --------------------------------------------------
    // Nothing found
    // --------------------------------------------------

    if (
        !data ||
        data.length === 0
    ) {

        intelList.innerHTML = `

            <div class="empty">

                <strong>No intelligence available.</strong>

                <br><br>

                There are currently no intelligence submissions available to you.

            </div>

        `;

        return;

    }


    // --------------------------------------------------
    // Get sender information
    // --------------------------------------------------

    const senderIds =
        [
            ...new Set(
                data
                    .map(
                        intel =>
                            intel.sender_id
                    )
                    .filter(
                        id =>
                            id
                    )
            )
        ];


    let senders = [];


    if (
        senderIds.length > 0
    ) {

        const {
            data: senderData,
            error: senderError
        } = await supabaseClient

            .from('officers')

            .select(
                'id, full_name, rank, callsign'
            )

            .in(
                'id',
                senderIds
            );


        if (senderError) {

            console.error(
                'Load sender information error:',
                senderError
            );

        } else {

            senders =
                senderData || [];

        }

    }


    // --------------------------------------------------
    // Get recipient information
    // --------------------------------------------------

    const recipientIds =
        [
            ...new Set(
                data
                    .map(
                        intel =>
                            intel.recipient_id
                    )
                    .filter(
                        id =>
                            id
                    )
            )
        ];


    let recipients = [];


    if (
        recipientIds.length > 0
    ) {

        const {
            data: recipientData,
            error: recipientError
        } = await supabaseClient

            .from('officers')

            .select(
                'id, full_name, rank, callsign'
            )

            .in(
                'id',
                recipientIds
            );


        if (recipientError) {

            console.error(
                'Load recipient information error:',
                recipientError
            );

        } else {

            recipients =
                recipientData || [];

        }

    }


    // --------------------------------------------------
    // Get all active SCU agents
    // --------------------------------------------------

    let scaAgents = [];


    if (
        hasFullIntelAccess()
    ) {

        const {
            data: agentData,
            error: agentError
        } = await supabaseClient

            .from('officers')

            .select(
                'id, full_name, rank, callsign'
            )

            .eq(
                'is_scu_agent',
                true
            )

            .eq(
                'active',
                true
            );


        if (agentError) {

            console.error(
                'Load SCU agents error:',
                agentError
            );

        } else {

            scaAgents =
                agentData || [];

        }

    }


    // --------------------------------------------------
    // Get this user's viewed records
    // --------------------------------------------------

    const intelIds =
        data.map(
            intel =>
                intel.id
        );


    let viewedIds = [];


    if (
        intelIds.length > 0
    ) {

        const {
            data: viewData,
            error: viewError
        } = await supabaseClient

            .from('intel_views')

            .select(
                'intel_id'
            )

            .eq(
                'user_id',
                currentUser.id
            )

            .in(
                'intel_id',
                intelIds
            );


        if (viewError) {

            console.error(
                'Load intel views error:',
                viewError
            );

        } else {

            viewedIds =
                (viewData || [])
                    .map(
                        view =>
                            view.intel_id
                    );

        }

    }


    // --------------------------------------------------
    // Clear loading
    // --------------------------------------------------

    intelList.innerHTML = '';


    // --------------------------------------------------
    // Display intelligence
    // --------------------------------------------------

    data.forEach(
        intel => {


            const sender =
                senders.find(
                    officer =>
                        officer.id ===
                        intel.sender_id
                );


            const recipient =
                recipients.find(
                    officer =>
                        officer.id ===
                        intel.recipient_id
                );


            const senderName =
                sender
                    ? `${sender.rank || ''} ${sender.full_name || ''}${sender.callsign ? ' — ' + sender.callsign : ''}`.trim()
                    : 'Unknown Officer';


            const recipientName =
                recipient
                    ? `${recipient.rank || ''} ${recipient.full_name || ''}${recipient.callsign ? ' — ' + recipient.callsign : ''}`.trim()
                    : 'UNASSIGNED — REQUIRES TRIAGE';


            const hasBeenViewed =
                viewedIds.includes(
                    intel.id
                );


            const isUnassigned =
                !intel.recipient_id;


            const card =
                document.createElement(
                    'article'
                );


            if (
                isUnassigned
            ) {

                card.className =
                    'intel-card unassigned';

            } else {

                card.className =
                    hasBeenViewed
                        ? 'intel-card read'
                        : 'intel-card unread';

            }


            const createdDate =
                new Date(
                    intel.created_at
                );


            const formattedDate =
                createdDate.toLocaleString(
                    'en-GB',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );


            let triageHtml = '';


            // --------------------------------------------------
            // Triage controls
            // Only full-access senior roles can assign.
            // --------------------------------------------------

            if (
                isUnassigned &&
                hasFullIntelAccess()
            ) {

                triageHtml = `

                    <div class="triage-panel">

                        <div class="triage-title">

                            ⚠ UNASSIGNED — REQUIRES TRIAGE

                        </div>

                        <div class="triage-description">

                            This intelligence was submitted without a recipient.
                            Select the appropriate SCU officer below and send the intelligence to them.

                        </div>

                        <div class="triage-controls">

                            <select
                                class="triage-select"
                                id="recipient-${intel.id}"
                            >

                                <option value="">

                                    Select officer...

                                </option>

                                ${
                                    scaAgents
                                        .map(
                                            agent => `

                                                <option value="${escapeAttribute(agent.id)}">

                                                    ${escapeHtml(
                                                        `${agent.rank || ''} ${agent.full_name || 'SCU Agent'}${agent.callsign ? ' — ' + agent.callsign : ''}`.trim()
                                                    )}

                                                </option>

                                            `
                                        )
                                        .join('')
                                }

                            </select>


                            <button
                                class="send-button"
                                id="send-${intel.id}"
                                onclick="assignIntel('${intel.id}')"
                            >

                                SEND INTEL

                            </button>

                        </div>

                    </div>

                `;

            }


            // --------------------------------------------------
            // Assigned information
            // --------------------------------------------------

            let assignedHtml = '';


            if (
                !isUnassigned &&
                hasFullIntelAccess()
            ) {

                assignedHtml = `

                    <div class="assigned-panel">

                        <div class="assigned-label">

                            Assigned To

                        </div>

                        <div class="assigned-value">

                            ${escapeHtml(
                                recipientName
                            )}

                        </div>

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="intel-header">

                    <div>

                        <div class="intel-subject">

                            ${escapeHtml(
                                intel.subject
                            )}

                        </div>


                        <div class="intel-meta">

                            From:
                            ${escapeHtml(
                                senderName
                            )}

                        </div>


                        ${
                            isUnassigned
                            ? `

                                <div class="status-badge status-unassigned">

                                    UNASSIGNED

                                </div>

                            `
                            : `

                                <div class="status-badge ${
                                    hasBeenViewed
                                        ? 'status-open'
                                        : 'status-new'
                                }">

                                    ${
                                        hasBeenViewed
                                            ? 'OPEN'
                                            : 'NEW'
                                    }

                                </div>

                            `
                        }

                    </div>


                    <div class="intel-type">

                        ${escapeHtml(
                            intel.intel_type
                        )}

                    </div>

                </div>


                <div class="section">

                    <div class="section-title">

                        Finding / Intelligence

                    </div>


                    <div class="section-content">

                        ${escapeHtml(
                            intel.finding
                        )}

                    </div>

                </div>


                ${
                    intel.location
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Location

                            </div>


                            <div class="section-content">

                                ${escapeHtml(
                                    intel.location
                                )}

                            </div>

                        </div>

                    `
                    : ''
                }


                ${
                    intel.source
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Source / Context

                            </div>


                            <div class="section-content">

                                ${escapeHtml(
                                    intel.source
                                )}

                            </div>

                        </div>

                    `
                    : ''
                }


                ${
                    intel.evidence_link
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Evidence / Document

                            </div>


                            <div class="section-content">

                                <a
                                    class="evidence-link"
                                    href="${escapeAttribute(
                                        intel.evidence_link
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    Open supporting evidence

                                </a>

                            </div>

                        </div>

                    `
                    : ''
                }


                ${assignedHtml}


                ${triageHtml}


                <div class="intel-footer">

                    <div class="date">

                        Received:
                        ${formattedDate}

                    </div>


                    <button
                        class="delete-button"
                        onclick="deleteIntel('${intel.id}')"
                    >

                        DELETE INTEL

                    </button>

                </div>

            `;


            intelList.appendChild(
                card
            );


            // --------------------------------------------------
            // Automatically mark as viewed
            // --------------------------------------------------

            if (
                !hasBeenViewed
            ) {

                markIntelAsViewed(
                    intel.id
                );

            }

        }
    );

}


// ======================================================
// ASSIGN / SEND INTEL
// ======================================================

async function assignIntel(
    intelId
) {


    if (
        !hasFullIntelAccess()
    ) {

        alert(
            'You do not have permission to assign intelligence.'
        );

        return;

    }


    const select =
        document.getElementById(
            `recipient-${intelId}`
        );


    const sendButton =
        document.getElementById(
            `send-${intelId}`
        );


    if (
        !select
    ) {

        return;

    }


    const recipientId =
        select.value;


    if (
        !recipientId
    ) {

        alert(
            'Please select an officer to receive this intelligence.'
        );

        return;

    }


    const confirmed =
        confirm(
            'Send this intelligence to the selected officer?'
        );


    if (!confirmed) {

        return;

    }


    sendButton.disabled =
        true;


    sendButton.textContent =
        'SENDING...';


    const {
        error
    } = await supabaseClient

        .from(
            'intel_submissions'
        )

        .update({

            recipient_id:
                recipientId

        })

        .eq(
            'id',
            intelId
        );


    if (error) {

        console.error(
            'Assign intel error:',
            error
        );


        alert(
            'Unable to send intelligence.\n\n' +
            error.message
        );


        sendButton.disabled =
            false;


        sendButton.textContent =
            'SEND INTEL';


        return;

    }


    alert(
        'Intelligence sent successfully.'
    );


    // Reload the page data.

    loadIntel();

}


// ======================================================
// MARK INTEL AS VIEWED
// ======================================================

async function markIntelAsViewed(
    intelId
) {


    if (
        !currentUser
    ) {

        return;

    }


    const {
        error
    } = await supabaseClient

        .from('intel_views')

        .upsert(
            {

                intel_id:
                    intelId,

                user_id:
                    currentUser.id

            },
            {

                onConflict:
                    'intel_id,user_id'

            }
        );


    if (error) {

        console.error(
            'Mark intel as viewed error:',
            error
        );

    }

}


// ======================================================
// DELETE INTELLIGENCE
// ======================================================

async function deleteIntel(
    intelId
) {


    const confirmed =
        confirm(
            'Are you sure you want to delete this intelligence submission?\n\nOnly delete it once the information has been copied into a case or is no longer required.'
        );


    if (!confirmed) {

        return;

    }


    const {

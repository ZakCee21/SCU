<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Intelligence</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

        }

        .header {

        }

        }

        .header-title {
            font-size: 20px;

        .intro {
            margin-bottom: 25px;
        }

        .intro h1 {
            margin: 0 0 7px;
            font-size: 25px;
            color: #ffffff;
            text-align: left;
        }

        .intro p {
            margin: 0;
            color: #7f8b98;

            text-align: left;
        }

        .intel-card {

        .intel-card.unread {

        }

        .intel-header {
            padding: 15px 18px;
            border-bottom: 1px solid #293542;
            background: #0d131a;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .intel-subject {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: left;
        }

        .intel-meta {
            color: #6f7c88;
            font-size: 11px;
            text-align: left;
        }

        .status-badge {

        .info-grid {

        }

        .info-box.recipients-box {

        }

        .info-box {
            background: #0b1117;
            border: 1px solid #293542;

            text-align: left;

        .info-label {
            color: #667381;
            font-size: 9px;
            font-weight: bold;

        .info-value {

        .section {

        }

        .section-title {
            font-size: 10px;
            color: #667381;
            text-transform: uppercase;
            font-weight: bold;

            text-align: left;
        }

        .section-content {
            background: #0b1117;

            padding: 12px;
            color: #d5dbe1;
            font-size: 13px;
            line-height: 1.55;

        }

        .non-scu-reporter {
            background: #160d20;
            border: 1px solid #6b21a8;
            border-radius: 5px;
            padding: 13px;
            margin-bottom: 15px;

        .non-scu-reporter-title {

            font-weight: bold;

        .non-scu-reporter-name {

        .non-scu-reporter-callsign {

        .assigned-panel {
            background: #0d1720;
            border: 1px solid #1d4ed8;
            border-radius: 5px;
            padding: 13px;
            margin-top: 15px;
            text-align: left;
        }

        .assigned-title {
            color: #60a5fa;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;

        .assigned-description {

            font-weight: bold;

        .triage-description {

        .agent-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 20px;
            background: #080c11;
            border: 1px solid #354554;
            border-radius: 5px;
            overflow: hidden;
            text-align: left;
        }

        .agent-column {
            min-width: 0;
        }

        .agent-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            margin: 0;

        .agent-option input[type="checkbox"] {

            accent-color: #1d4ed8;

        .agent-name {
            flex: 1;

        .agent-loading {
            grid-column: 1 / -1;
            padding: 12px;
            color: #6f7c88;

        }

        .reassign-button-container {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;

            background: #1d4ed8;

        .send-button:hover {

        }

        .send-button:disabled {

        }

        .non-scu-send-button {

        }

        .non-scu-send-button:hover {
            background: #9333ea;
        }

        .intel-footer {
            border-top: 1px solid #293542;

        .delete-button,

        }

        .delete-button:hover,
        .delete-non-scu-button:hover {
            background: #7f1d1d;

        .recipient-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .recipient-item {
            background: #0b1117;
            border: 1px solid #293542;
            border-radius: 4px;
            padding: 7px 9px;
            color: #dbe1e7;
            font-size: 12px;
        }

        .recipient-item.current-recipient {
            border-color: #1d4ed8;
        }

        .loading,

            text-align: center;
            padding: 50px 20px;

            font-size: 13px;
        }

        @media (max-width: 800px) {

            .info-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            }

            }

            }

            .header-title {

            .container {

            .reassign-button-container {

            .background-logo {

                opacity: 0.25;

            .background-logo-left {

        /* ================================================== */
        /* EVIDENCE / PHOTO DISPLAY */

        .evidence-media {

            gap: 12px;

        }

        .evidence-media > div {

            flex-direction: column;
            gap: 5px;
            max-width: 100%;
        }

        .evidence-image {
            display: block;
            max-width: 100%;
            width: auto;
            max-height: 420px;
            object-fit: contain;
            border: 1px solid #354554;
            border-radius: 5px;

            cursor: pointer;
        }

        .evidence-image:hover {

        }

        .evidence-link {

            font-size: 11px;
            word-break: break-all;
            text-decoration: none;
        }

        .evidence-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

    </style>

</head>

    <header class="header">

        <button
            class="back-button"

        >

        </button>

    </header>


    <main class="container">

        <div class="intro">

            <h1>
                Intelligence Received
            </h1>

            <p id="page-description">
                Intelligence submissions sent directly to you by authorised officers.
            </p>

        </div>


        <div id="intel-list">

            <div class="loading">
                Loading intelligence...
            </div>

        </div>

    </main>


    <script>

        /* ================================================== */
        /* SUPABASE */
        /* ================================================== */

        const SUPABASE_URL =
            'https://mtlozyseibrefhxnocvb.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ================================================== */
        /* GLOBALS */
        /* ================================================== */

        let currentUser = null;
        let currentOfficer = null;
        let currentRole = null;
        let scaAgents = [];
        let nonScuReports = [];


        /* ================================================== */
        /* FULL INTEL ACCESS */
        /* ================================================== */

        const fullAccessRoles = [
            'master',
            'investigator',
            'case_lead'
        ];


        function hasFullIntelAccess() {

            return fullAccessRoles.includes(
                currentRole
            );

        }


        /* ================================================== */
        /* ESCAPE HELPERS */
        /* ================================================== */

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

        }


        /* ================================================== */
        /* LOAD CURRENT USER */
        /* ================================================== */

        async function loadCurrentUser() {

            const {
                data: {
                    session
                },
                error
            } = await supabaseClient.auth.getSession();


            if (error || !session) {

                window.location.href = 'index.html';

                return false;

            }


            currentUser =
                session.user;


            if (!currentUser || !currentUser.id) {

                console.error(
                    'No authenticated user ID was found.'
                );

                alert(
                    'Unable to identify the logged-in officer.'
                );

                return false;

            }


            const {
                data: officer,
                error: officerError
            } = await supabaseClient

                .from('officers')

                .select(`
                    id,
                    full_name,
                    rank,
                    role,
                    active,
                    callsign,
                    portal_title
                `)

                .eq(
                    'id',
                    currentUser.id
                )

                .single();


            if (officerError || !officer) {

                console.error(
                    'Officer loading error:',
                    officerError
                );

                document.getElementById(
                    'intel-list'
                ).innerHTML = `
                    <div class="empty">
                        Unable to load your officer profile.
                    </div>
                `;

                return false;

            }


            currentOfficer =
                officer;

            currentRole =
                officer.role;


            console.log(
                'CURRENT USER ID:',
                currentUser.id
            );

            console.log(
                'CURRENT OFFICER ID:',
                currentOfficer.id
            );

            console.log(
                'CURRENT ROLE:',
                currentRole
            );


            return true;

        }


        /* ================================================== */
        /* LOAD ACTIVE SCU AGENTS */
        /* ================================================== */

        async function loadScuAgents() {

            const {
                data,
                error
            } = await supabaseClient

                .from('officers')

                .select(
                    'id, full_name, rank, callsign'
                )

                .eq(
                    'is_scu_agent',
                    true
                )

                .eq(
                    'active',
                    true
                );


            if (error) {

                console.error(
                    'SCU agent loading error:',
                    error
                );

                scaAgents = [];

                return;

            }


            const rankOrder = {

                'Head of SCU': 1,
                'Assistant Head of SCU': 2,
                'Head of Weapons': 3,
                'Head of Drugs': 4,
                'Detective': 5

            };


            const filteredAgents =
                (data || []).filter(
                    agent => {

                        const rank =
                            (agent.rank || '').trim();

                        return Object.prototype.hasOwnProperty.call(
                            rankOrder,
                            rank
                        );

                    }
                );


            filteredAgents.sort(
                (a, b) => {

                    const rankA =
                        (a.rank || '').trim();

                    const rankB =
                        (b.rank || '').trim();


                    const rankDifference =
                        rankOrder[rankA] -
                        rankOrder[rankB];


                    if (
                        rankDifference !== 0
                    ) {

                        return rankDifference;

                    }


                    const nameA =
                        (a.full_name || '')
                            .trim()
                            .toLowerCase();

                    const nameB =
                        (b.full_name || '')
                            .trim()
                            .toLowerCase();


                    return nameA.localeCompare(
                        nameB
                    );

                }
            );


            scaAgents =
                filteredAgents;

        }


        /* ================================================== */
        /* LOAD NON-SCU REPORTS */
        /* ================================================== */

        async function loadNonScuReports() {

            nonScuReports = [];


            if (
                !hasFullIntelAccess()
            ) {

                return;

            }


            const {
                data,
                error
            } = await supabaseClient

                .from('non_scu_intel_submissions')

                .select(`
                    id,
                    reporter_name,
                    reporter_callsign,
                    intel_type,
                    finding,
                    location,
                    source,
                    evidence,
                    created_at,
                    status
                `)

                .eq(
                    'status',
                    'unassigned'
                )

                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    'NON-SCU intelligence loading error:',
                    error
                );

                return;

            }


            nonScuReports =
                data || [];

        }


        /* ================================================== */
        /* BUILD AGENT LIST */
        /* ================================================== */

        function buildAgentList(
            reportId,
            selectedRecipientIds = []
        ) {

            const selectedIds =
                Array.isArray(selectedRecipientIds)
                    ? selectedRecipientIds.map(String)
                    : (
                        selectedRecipientIds
                            ? [String(selectedRecipientIds)]
                            : []
                    );


            const agentsPerColumn = 8;


            const numberOfColumns =
                Math.max(
                    1,
                    Math.ceil(
                        scaAgents.length /
                        agentsPerColumn
                    )
                );


            const columns = [];


            for (
                let i = 0;
                i < numberOfColumns;
                i++
            ) {

                columns.push([]);

            }


            scaAgents.forEach(
                (agent, index) => {

                    const columnIndex =
                        Math.floor(
                            index /
                            agentsPerColumn
                        );


                    columns[
                        columnIndex
                    ].push(
                        agent
                    );

                }
            );


            return columns
                .map(
                    column => `

                        <div class="agent-column">

                            ${
                                column
                                    .map(
                                        agent => `

                                            <label class="agent-option">

                                                <input
                                                    type="checkbox"
                                                    class="reassign-checkbox"
                                                    value="${escapeAttribute(agent.id)}"
                                                    data-intel-id="${escapeAttribute(reportId)}"
                                                    ${
                                                        selectedIds.includes(String(agent.id))
                                                            ? 'checked'
                                                            : ''
                                                    }
                                                    onchange="handleReassignSelection('${escapeAttribute(reportId)}', this)"
                                                >

                                                <span class="agent-name">
                                                    ${escapeHtml(
                                                        `${agent.rank || ''} ${agent.full_name || 'SCU Agent'}${agent.callsign ? ' — ' + agent.callsign : ''}`.trim()
                                                    )}
                                                </span>

                                            </label>

                                        `
                                    )
                                    .join('')
                            }

                        </div>

                    `
                )
                .join('');

        }


        /* ================================================== */
        /* RENDER EVIDENCE / PHOTOS */
        /* ================================================== */

        function renderEvidenceContent(evidence) {

            if (!evidence) {

                return '';

            }


            const text =
                String(evidence).trim();


            if (!text) {

                return '';

            }


            /*
             * Evidence can contain one or more URLs,
             * normally separated by new lines.
             *
             * Direct image URLs are displayed as photos.
             * Other URLs remain clickable.
             */

            const parts =
                text
                    .split(
                        /\s*(?:\r?\n|,|;)+\s*/
                    )
                    .map(
                        part =>
                            part.trim()
                    )
                    .filter(Boolean);


            const imageExtensions =
                /\.(?:jpg|jpeg|png|gif|webp|bmp|svg)(?:[?#].*)?$/i;


            const rendered = [];


            parts.forEach(
                part => {

                    let url =
                        part;


                    /*
                     * Remove common labels.
                     */

                    url =
                        url
                            .replace(
                                /^(?:photo|image|picture|evidence)\s*:\s*/i,
                                ''
                            )
                            .trim();


                    if (
                        !/^https?:\/\//i.test(
                            url
                        )
                    ) {

                        return;

                    }


                    const safeUrl =
                        escapeAttribute(
                            url
                        );


                    if (
                        imageExtensions.test(
                            url
                        )
                    ) {

                        rendered.push(`

                            <div>

                                <a
                                    href="${safeUrl}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    <img
                                        src="${safeUrl}"
                                        class="evidence-image"
                                        alt="Intel evidence photo"
                                        loading="lazy"
                                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"
                                    >

                                </a>

                                <a
                                    href="${safeUrl}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="evidence-link"
                                    style="display:none;"
                                >
                                    Open evidence photo
                                </a>

                            </div>

                        `);

                    } else {

                        rendered.push(`

                            <div>

                                <a
                                    href="${safeUrl}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="evidence-link"
                                >
                                    ${escapeHtml(url)}
                                </a>

                            </div>

                        `);

                    }

                }
            );


            /*
             * If there are no URLs, keep the original
             * evidence text.
             */

            if (
                !rendered.length
            ) {

                return `
                    <div>
                        ${escapeHtml(text)}
                    </div>
                `;

            }


            const nonUrlText =
                text
                    .split(
                        /\s*(?:\r?\n|,|;)+\s*/
                    )
                    .map(
                        part =>
                            part.trim()
                    )
                    .filter(
                        part =>
                            part &&
                            !/^https?:\/\//i.test(
                                part
                                    .replace(
                                        /^(?:photo|image|picture|evidence)\s*:\s*/i,
                                        ''
                                    )
                                    .trim()
                            )
                    )
                    .join('\n');


            return `

                ${
                    nonUrlText
                        ? `<div>${escapeHtml(nonUrlText)}</div>`
                        : ''
                }

                <div class="evidence-media">

                    ${rendered.join('')}

                </div>

            `;

        }

        async function loadIntel() {

            const intelList =
                document.getElementById(
                    'intel-list'
                );


            intelList.innerHTML = `

                <div class="loading">
                    Loading intelligence...
                </div>

            `;


            let query =
                supabaseClient

                    .from('intel_submissions')

                    .select('*')

                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );


            if (
                !hasFullIntelAccess()
            ) {

                query =
                    query.eq(
                        'recipient_id',
                        currentUser.id
                    );

            }


            const {
                data,
                error
            } =
                await query;


            if (error) {

                console.error(
                    'Intel loading error:',
                    error
                );

                intelList.innerHTML = `

                    <div class="empty">
                        Unable to load intelligence.
                    </div>

                `;

                return;

            }


            await loadNonScuReports();


            let scuIntel =
                data || [];


            /*
             * For grouped Intel, try to load every copy
             * in the same group.
             *
             * Full-access users already receive every row.
             *
             * Normal recipients will receive the additional
             * rows only if the database RLS policy allows
             * them to read the other copies in their group.
             */

            const groupIds = [

                ...new Set(

                    scuIntel

                        .map(
                            intel =>
                                intel.intel_group_id
                        )

                        .filter(Boolean)

                )

            ];


            if (
                !hasFullIntelAccess() &&
                groupIds.length > 0
            ) {

                const {
                    data: groupedRows,
                    error: groupedRowsError
                } =
                    await supabaseClient

                        .from(
                            'intel_submissions'
                        )

                        .select('*')

                        .in(
                            'intel_group_id',
                            groupIds
                        );


                if (
                    !groupedRowsError &&
                    groupedRows &&
                    groupedRows.length > 0
                ) {

                    const merged =
                        new Map();


                    [
                        ...scuIntel,
                        ...groupedRows
                    ].forEach(
                        row => {

                            merged.set(
                                row.id,
                                row
                            );

                        }
                    );


                    scuIntel =
                        Array.from(
                            merged.values()
                        );

                }

            }


            if (
                scuIntel.length === 0 &&
                nonScuReports.length === 0
            ) {

                intelList.innerHTML = `

                    <div class="empty">
                        No intelligence available.
                    </div>

                `;

                return;

            }


            const officerIds = [

                ...new Set(

                    scuIntel

                        .flatMap(
                            intel => [
                                intel.sender_id,
                                intel.recipient_id
                            ]
                        )

                        .filter(Boolean)

                )

            ];


            let officersMap = {};


            if (
                officerIds.length > 0
            ) {

                const {
                    data: officers,
                    error: officersError
                } =
                    await supabaseClient

                        .from('officers')

                        .select(
                            'id, full_name, rank, callsign, portal_title'
                        )

                        .in(
                            'id',
                            officerIds
                        );


                if (officersError) {

                    console.error(
                        'Officer information loading error:',
                        officersError
                    );

                } else {

                    (
                        officers || []
                    ).forEach(
                        officer => {

                            officersMap[
                                officer.id
                            ] =
                                officer;

                        }
                    );

                }

            }


            const enrichedIntel =
                scuIntel.map(
                    intel => ({

                        ...intel,

                        senderOfficer:
                            officersMap[
                                intel.sender_id
                            ] || null,

                        recipientOfficer:
                            officersMap[
                                intel.recipient_id
                            ] || null

                    })
                );


            const intelIds =
                enrichedIntel.map(
                    intel =>
                        intel.id
                );


            let viewedIds =
                new Set();


            if (
                intelIds.length > 0
            ) {

                const {
                    data: views,
                    error: viewsError
                } =
                    await supabaseClient

                        .from('intel_views')

                        .select(
                            'intel_id'
                        )

                        .eq(
                            'user_id',
                            currentUser.id
                        )

                        .in(
                            'intel_id',
                            intelIds
                        );


                if (!viewsError) {

                    viewedIds =
                        new Set(
                            (
                                views || []
                            ).map(
                                view =>
                                    view.intel_id
                            )
                        );

                }

            }


            enrichedIntel.forEach(
                intel => {

                    if (
                        !viewedIds.has(
                            intel.id
                        )
                    ) {

                        supabaseClient

                            .from('intel_views')

                            .upsert(
                                {
                                    intel_id:
                                        intel.id,

                                    user_id:
                                        currentUser.id
                                },
                                {
                                    onConflict:
                                        'intel_id,user_id'
                                }
                            )

                            .then(
                                result => {

                                    if (
                                        result.error
                                    ) {

                                        console.error(
                                            'View tracking error:',
                                            result.error
                                        );

                                    }

                                }
                            );

                    }

                }
            );


            intelList.innerHTML = '';


            if (
                hasFullIntelAccess()
            ) {

                nonScuReports.forEach(
                    report => {

                        renderNonScuReport(
                            report,
                            intelList
                        );

                    }
                );

            }


            /*
             * Group every recipient copy into one
             * visual Intel card.
             */

            const groups =
                new Map();


            enrichedIntel.forEach(
                intel => {

                    const groupId =
                        intel.intel_group_id ||
                        intel.id;


                    if (
                        !groups.has(
                            groupId
                        )
                    ) {

                        groups.set(
                            groupId,
                            []
                        );

                    }


                    groups
                        .get(groupId)
                        .push(intel);

                }
            );


            groups.forEach(
                group => {

                    group.sort(
                        (a, b) =>
                            new Date(
                                a.created_at || 0
                            ) -
                            new Date(
                                b.created_at || 0
                            )
                    );


                    const intel =
                        group[0];


                    const sender =
                        intel.senderOfficer;


                    const recipients = [];


                    const seenRecipients =
                        new Set();


                    group.forEach(
                        row => {

                            if (
                                row.recipient_id &&
                                !seenRecipients.has(
                                    row.recipient_id
                                )
                            ) {

                                seenRecipients.add(
                                    row.recipient_id
                                );

                                recipients.push(
                                    row
                                );

                            }

                        }
                    );


                    const isCurrentRecipient =
                        group.some(
                            row =>
                                String(
                                    row.recipient_id
                                ) ===
                                String(
                                    currentUser.id
                                )
                        );


                    const isUnassigned =
                        recipients.length === 0;


                    const isViewed =
                        group.every(
                            row =>
                                viewedIds.has(
                                    row.id
                                )
                        );


                    let cardClass =
                        'read';


                    let statusBadge = `

                        <span class="status-badge status-read">
                            OPEN
                        </span>

                    `;


                    if (
                        isUnassigned
                    ) {

                        cardClass =
                            'unassigned';


                        statusBadge = `

                            <span class="status-badge status-unassigned">
                                UNASSIGNED
                            </span>

                        `;

                    } else if (
                        !isViewed
                    ) {

                        cardClass =
                            'unread';


                        statusBadge = `

                            <span class="status-badge status-new">
                                NEW
                            </span>

                        `;

                    }


                    const createdDate =
                        intel.created_at

                            ? new Date(
                                intel.created_at
                            ).toLocaleString(
                                'en-GB',
                                {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                }
                            )

                            : 'Unknown';


                    const senderName =
                        sender

                            ? `${sender.rank || ''} ${sender.full_name || ''}`.trim()

                            : 'Unknown';


                    const senderDisplay =
                        sender

                            ? `${senderName}${sender.callsign ? ' — ' + sender.callsign : ''}`

                            : 'Unknown';


                    const recipientDisplay =
                        recipients.length

                            ? recipients
                                .map(
                                    row => {

                                        const officer =
                                            row.recipientOfficer;


                                        const name =
                                            officer

                                                ? `${officer.rank || ''} ${officer.full_name || ''}`.trim()

                                                : 'Unknown Officer';


                                        const display =
                                            `${name}${officer && officer.callsign ? ' — ' + officer.callsign : ''}`;


                                        const currentClass =
                                            String(
                                                row.recipient_id
                                            ) ===
                                            String(
                                                currentUser.id
                                            )

                                                ? ' current-recipient'

                                                : '';


                                        return `

                                            <div class="recipient-item${currentClass}">

                                                ${escapeHtml(display)}

                                            </div>

                                        `;

                                    }
                                )
                                .join('')

                            : `

                                <div class="recipient-item">
                                    No recipient assigned
                                </div>

                            `;


                    let triageHtml =
                        '';


                    if (
                        hasFullIntelAccess()
                    ) {

                        const selectedRecipientIds =
                            recipients.map(
                                row =>
                                    row.recipient_id
                            );


                        const agentColumnsHtml =
                            buildAgentList(
                                intel.id,
                                selectedRecipientIds
                            );


                        triageHtml = `

                            <div class="triage-panel">

                                <div class="triage-title">

                                    ${
                                        isUnassigned
                                            ? '⚠ UNASSIGNED INTELLIGENCE'
                                            : '↻ REASSIGN INTELLIGENCE'
                                    }

                                </div>


                                <div class="triage-description">

                                    ${
                                        isUnassigned

                                            ? 'This intelligence was submitted without a recipient. Select one or more SCU officers below and send the intelligence to them. You can select as many officers as required.'

                                            : 'This intelligence is currently assigned to the officers shown above. Select one or more SCU officers to receive this intelligence. You can select as many officers as required.'

                                    }

                                </div>


                                <div
                                    class="agent-list"
                                    id="agent-list-${escapeAttribute(intel.id)}"
                                >

                                    ${agentColumnsHtml}

                                </div>


                                <div class="reassign-button-container">

                                    <button
                                        class="send-button"
                                        id="send-${escapeAttribute(intel.id)}"
                                        onclick="assignIntel('${escapeAttribute(intel.id)}')"
                                    >

                                        ${
                                            isUnassigned
                                                ? 'SEND INTEL'
                                                : 'REASSIGN INTEL'
                                        }

                                    </button>

                                </div>

                            </div>

                        `;

                    }


                    let assignedHtml =
                        '';


                    if (
                        !isUnassigned &&
                        hasFullIntelAccess()
                    ) {

                        assignedHtml = `

                            <div class="assigned-panel">

                                <div class="assigned-title">
                                    CURRENT RECIPIENTS
                                </div>

                                <div class="assigned-description">

                                    This intelligence has been sent to
                                    ${recipients.length}
                                    officer${recipients.length === 1 ? '' : 's'}.

                                </div>

                            </div>

                        `;

                    }


                    let deleteHtml =
                        '';


                    if (
                        hasFullIntelAccess()
                    ) {

                        deleteHtml = `

                            <div class="intel-footer">

                                <button
                                    class="delete-button"
                                    onclick="deleteIntel('${escapeAttribute(intel.id)}')"
                                >
                                    DELETE INTEL
                                </button>

                            </div>

                        `;

                    } else if (
                        isCurrentRecipient
                    ) {

                        const ownCopy =
                            group.find(
                                row =>
                                    String(
                                        row.recipient_id
                                    ) ===
                                    String(
                                        currentUser.id
                                    )
                            );


                        if (ownCopy) {

                            deleteHtml = `

                                <div class="intel-footer">

                                    <button
                                        class="delete-button"
                                        onclick="deleteIntel('${escapeAttribute(ownCopy.id)}')"
                                    >
                                        DELETE INTEL
                                    </button>

                                </div>

                            `;

                        }

                    }


                    let locationHtml =
                        '';


                    if (
                        intel.location
                    ) {

                        locationHtml = `

                            <div class="section">

                                <div class="section-title">
                                    Location
                                </div>

                                <div class="section-content">
                                    ${escapeHtml(
                                        intel.location
                                    )}
                                </div>

                            </div>

                        `;

                    }


                    let sourceHtml =
                        '';


                    if (
                        intel.source ||
                        intel.context
                    ) {

                        sourceHtml = `

                            <div class="section">

                                <div class="section-title">
                                    Source / Context
                                </div>

                                <div class="section-content">
                                    ${escapeHtml(
                                        intel.source ||
                                        intel.context ||
                                        ''
                                    )}
                                </div>

                        `;

                    }


                    let evidenceHtml =
                        '';


                    if (

                        intel.file_url
                    ) {

                        evidenceHtml = `

                            <div class="section">

                                <div class="section-title">
                                    Evidence / Photos
                                </div>

                                <div class="section-content">

                                    ${renderEvidenceContent(

                                    )}

                    }


                    const card =

                        );


                    card.className =

                    card.innerHTML = `

                        <div class="intel-header">

                            <div>

                                <div class="intel-subject">

                                    ${escapeHtml(

                                    )}

                                    ${escapeHtml(

                                    )}

                                        Recipients
                                    </div>

                                    <div class="info-value">

                                        <div class="recipient-list">

                                            ${recipientDisplay}

                                        </div>

                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        Received
                                    </div>

                                    <div class="info-value">

                                        ${escapeHtml(
                                            createdDate
                                        )}

                                    </div>

                                </div>

                            </div>


                            <div class="section">

                                <div class="section-title">
                                    Finding
                                </div>

                                <div class="section-content">

                                    ${escapeHtml(
                                        intel.finding ||
                                        intel.description ||
                                        'No finding provided.'
                                    )}

                                </div>

                            </div>


                            ${locationHtml}

                            ${sourceHtml}

                            ${evidenceHtml}

                            ${assignedHtml}

                            ${triageHtml}

                        </div>


                        ${deleteHtml}

                    `;


                    intelList.appendChild(
                        card
                    );

                }
            );

        }

        /* ================================================== */
        /* REASSIGNMENT CHECKBOX HANDLER */
        /* ================================================== */

        function handleReassignSelection(
            intelId,
            checkbox
        ) {

            const container =
                document.getElementById(
                    `agent-list-${intelId}`
                );


            if (!container) {

                return;

            }


            const checked =
                container.querySelectorAll(
                    'input.reassign-checkbox:checked'
                );


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (!button) {

                return;

            }


            if (
                checked.length === 0
            ) {

                button.disabled =
                    true;

            } else {

                button.disabled =
                    false;

            }

        }


        /* ================================================== */
        /* ASSIGN / REASSIGN STANDARD INTEL */
        /* ================================================== */

        async function assignIntel(
            intelId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const container =
                document.getElementById(
                    `agent-list-${intelId}`
                );


            if (!container) {

                alert(
                    'Unable to find the recipient list.'
                );

                return;

            }


            const checked =
                Array.from(
                    container.querySelectorAll(
                        'input.reassign-checkbox:checked'
                    )
                );


            const recipientIds =
                checked.map(
                    checkbox =>
                        checkbox.value
                );


            if (
                recipientIds.length === 0
            ) {

                alert(
                    'Select at least one SCU officer.'
                );

                return;

            }


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            try {

                /*
                 * Find the current visual group.
                 */

                const {
                    data: sourceRow,
                    error: sourceError
                } =
                    await supabaseClient

                        .from(
                            'intel_submissions'
                        )

                        .select('*')

                        .eq(
                            'id',
                            intelId
                        )

                        .single();


                if (
                    sourceError ||
                    !sourceRow
                ) {

                    throw new Error(
                        sourceError?.message ||
                        'Unable to load the intelligence.'
                    );

                }


                let groupId =
                    sourceRow.intel_group_id;


                /*
                 * Older intelligence may not have a group ID.
                 * Use its own ID as the group identifier.
                 */

                if (!groupId) {

                    groupId =
                        sourceRow.id;

                }


                /*
                 * Load every existing copy in the group.
                 */

                const {
                    data: existingRows,
                    error: existingError
                } =
                    await supabaseClient

                        .from(
                            'intel_submissions'
                        )

                        .select('*')

                        .eq(
                            'intel_group_id',
                            groupId
                        );


                if (
                    existingError
                ) {

                    /*
                     * If the group query fails because this is
                     * older data without a group, fall back to
                     * the source row.
                     */

                    console.warn(
                        'Existing group lookup warning:',
                        existingError
                    );

                }


                const rows =
                    existingRows &&
                    existingRows.length
                        ? existingRows
                        : [sourceRow];


                /*
                 * Keep one row for every selected recipient.
                 *
                 * Existing copies belonging to recipients that
                 * were removed are deleted.
                 *
                 * Existing selected copies are retained.
                 *
                 * New selected recipients receive a new copy.
                 */

                const existingByRecipient =
                    new Map();


                rows.forEach(
                    row => {

                        if (
                            row.recipient_id
                        ) {

                            existingByRecipient.set(
                                String(
                                    row.recipient_id
                                ),
                                row
                            );

                        }

                    }
                );


                const selectedSet =
                    new Set(
                        recipientIds.map(
                            String
                        )
                    );


                /*
                 * Delete copies which are no longer selected.
                 */

                for (
                    const row of rows
                ) {

                    if (
                        !row.recipient_id
                    ) {

                        continue;

                    }


                    if (
                        !selectedSet.has(
                            String(
                                row.recipient_id
                            )
                        )
                    ) {

                        const {
                            error: deleteError
                        } =
                            await supabaseClient

                                .from(
                                    'intel_submissions'
                                )

                                .delete()

                                .eq(
                                    'id',
                                    row.id
                                );


                        if (
                            deleteError
                        ) {

                            throw new Error(
                                deleteError.message
                            );

                        }

                    }

                }


                /*
                 * Create copies for any newly selected recipients.
                 */

                for (
                    const recipientId
                    of recipientIds
                ) {

                    if (
                        existingByRecipient.has(
                            String(
                                recipientId
                            )
                        )
                    ) {

                        continue;

                    }


                    const newRow = {
                        sender_id:
                            sourceRow.sender_id,

                        recipient_id:
                            recipientId,

                        intel_type:
                            sourceRow.intel_type,

                        subject:
                            sourceRow.subject,

                        finding:
                            sourceRow.finding,

                        location:
                            sourceRow.location,

                        source:
                            sourceRow.source,

                        evidence:
                            sourceRow.evidence,

                        file_url:
                            sourceRow.file_url,

                        intel_group_id:
                            groupId
                    };


                    const {
                        error: insertError
                    } =
                        await supabaseClient

                            .from(
                                'intel_submissions'
                            )

                            .insert(
                                newRow
                            );


                    if (
                        insertError
                    ) {

                        throw new Error(
                            insertError.message
                        );

                    }

                }


                /*
                 * If the original row did not have a group ID,
                 * update it now.
                 */

                if (
                    !sourceRow.intel_group_id
                ) {

                    const {
                        error: groupUpdateError
                    } =
                        await supabaseClient

                            .from(
                                'intel_submissions'
                            )

                            .update({
                                intel_group_id:
                                    groupId
                            })

                            .eq(
                                'id',
                                sourceRow.id
                            );


                    if (
                        groupUpdateError
                    ) {

                        throw new Error(
                            groupUpdateError.message
                        );

                    }

                }


                /*
                 * An unassigned source row may have no recipient.
                 * Once recipients have been selected, remove the
                 * original unassigned row if it is not one of the
                 * selected copies.
                 */

                if (
                    !sourceRow.recipient_id
                ) {

                    const {
                        error: sourceDeleteError
                    } =
                        await supabaseClient

                            .from(
                                'intel_submissions'
                            )

                            .delete()

                            .eq(
                                'id',
                                sourceRow.id
                            );


                    if (
                        sourceDeleteError
                    ) {

                        throw new Error(
                            sourceDeleteError.message
                        );

                    }

                }


                alert(
                    'Intelligence recipients updated successfully.'
                );


                await loadIntel();

            } catch (
                error
            ) {

                console.error(
                    'Intel assignment error:',
                    error
                );


                alert(
                    `Unable to assign intelligence.\n\n${error.message || error}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'SEND INTEL';

                }

            }

        }


        /* ================================================== */
        /* ASSIGN NON-SCU INTEL */
        /* ================================================== */

        async function assignNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const container =
                document.getElementById(
                    `non-scu-agent-list-${reportId}`
                );


            if (!container) {

                alert(
                    'Unable to find the recipient list.'
                );

                return;

            }


            const checked =
                Array.from(
                    container.querySelectorAll(
                        'input.reassign-checkbox:checked'
                    )
                );


            const recipientIds =
                checked.map(
                    checkbox =>
                        checkbox.value
                );


            if (
                recipientIds.length === 0
            ) {

                alert(
                    'Select at least one SCU officer.'
                );

                return;

            }


            const button =
                document.getElementById(
                    `non-scu-send-${reportId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            try {

                const report =
                    nonScuReports.find(
                        item =>
                            String(
                                item.id
                            ) ===
                            String(
                                reportId
                            )
                    );


                if (!report) {

                    throw new Error(
                        'Unable to find the NON-SCU report.'
                    );

                }


                /*
                 * Find the current SCU officer who is assigning
                 * the report. This becomes the sender in the
                 * normal intel system.
                 */

                const senderId =
                    currentOfficer.id;


                /*
                 * The original reporter's details are retained
                 * inside the source field so that the normal SCU
                 * intelligence card still records where the
                 * information originated.
                 */

                const reporterDetails = [

                    `NON-SCU REPORTER: ${report.reporter_name || 'Unknown'}`,

                    `CALLSIGN: ${report.reporter_callsign || 'Not provided'}`,

                    `ORIGINAL REPORT DATE: ${
                        report.created_at
                            ? new Date(
                                report.created_at
                            ).toLocaleString(
                                'en-GB'
                            )
                            : 'Unknown'
                    }`

                ].join('\n');


                const originalSource =
                    report.source
                        ? `${reporterDetails}\n\n${report.source}`
                        : reporterDetails;


                /*
                 * One group ID is used for all recipients so
                 * multiple copies appear as one visual card.
                 */

                const groupId =
                    crypto.randomUUID();


                const rows =
                    recipientIds.map(
                        recipientId => ({

                            sender_id:
                                senderId,

                            recipient_id:
                                recipientId,

                            intel_type:
                                report.intel_type,

                            subject:
                                'NON-SCU MEMBER REPORT',

                            finding:
                                report.finding,

                            location:
                                report.location,

                            source:
                                originalSource,

                            evidence:
                                report.evidence,

                            intel_group_id:
                                groupId

                        })
                    );


                const {
                    error: insertError
                } =
                    await supabaseClient

                        .from(
                            'intel_submissions'
                        )

                        .insert(
                            rows
                        );


                if (
                    insertError
                ) {

                    throw new Error(
                        insertError.message
                    );

                }


                /*
                 * Mark the original NON-SCU report as assigned.
                 */

                const {
                    error: updateError
                } =
                    await supabaseClient

                        .from(
                            'non_scu_intel_submissions'
                        )

                        .update({
                            status:
                                'assigned'
                        })

                        .eq(
                            'id',
                            report.id
                        );


                if (
                    updateError
                ) {

                    throw new Error(
                        updateError.message
                    );

                }


                alert(
                    'NON-SCU intelligence sent successfully.'
                );


                await loadIntel();

            } catch (
                error
            ) {

                console.error(
                    'NON-SCU assignment error:',
                    error
                );


                alert(
                    `Unable to send NON-SCU intelligence.\n\n${error.message || error}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'SEND INTEL';

                }

            }

        }


        /* ================================================== */
        /* DELETE STANDARD INTEL */
        /* ================================================== */

        async function deleteIntel(
            intelId
        ) {

            if (
                !currentUser
            ) {

                return;

            }


            const confirmed =
                confirm(
                    'Are you sure you want to delete this intelligence?'
                );


            if (
                !confirmed
            ) {

                return;

            }


            try {

                /*
                 * Full-access users can delete any Intel.
                 *
                 * Normal recipients can only delete their own
                 * recipient copy.
                 */

                let deleteQuery =
                    supabaseClient

                        .from(
                            'intel_submissions'
                        )

                        .delete()
                        
                        .eq(
                            'id',
                            intelId
                        );


                if (
                    !hasFullIntelAccess()
                ) {

                    deleteQuery =
                        deleteQuery.eq(
                            'recipient_id',
                            currentUser.id
                        );

                }


                const {
                    error
                } =
                    await deleteQuery;


                if (
                    error
                ) {

                    throw new Error(
                        error.message
                    );

                }


                await loadIntel();

            } catch (
                error
            ) {

                console.error(
                    'Intel deletion error:',
                    error
                );


                alert(
                    `Unable to delete intelligence.\n\n${error.message || error}`
                );

            }

        }


        /* ================================================== */
        /* DELETE NON-SCU REPORT */
        /* ================================================== */

        async function deleteNonScuReport(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to delete NON-SCU reports.'
                );

                return;

            }


            const confirmed =
                confirm(
                    'Are you sure you want to delete this NON-SCU report?'
                );


            if (
                !confirmed
            ) {

                return;

            }


            try {

                const {
                    error
                } =
                    await supabaseClient

                        .from(
                            'non_scu_intel_submissions'
                        )

                        .delete()

                        .eq(
                            'id',
                            reportId
                        );


                if (
                    error
                ) {

                    throw new Error(
                        error.message
                    );

                }


                await loadIntel();

            } catch (
                error
            ) {

                console.error(
                    'NON-SCU report deletion error:',
                    error
                );


                alert(
                    `Unable to delete NON-SCU report.\n\n${error.message || error}`
                );

            }

        }
                /* ================================================== */
        /* INITIALISE PAGE */
        /* ================================================== */

        async function initialisePage() {

            const userLoaded =
                await loadCurrentUser();


            if (
                !userLoaded
            ) {

                return;

            }


            await loadScuAgents();


            await loadIntel();

        }


        /* ================================================== */
        /* START */
        /* ================================================== */

        initialisePage();


    </script>

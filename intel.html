<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Intelligence</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e5e7eb;
        }

        /* -------------------------------------------------- */
        /* HEADER */
        /* -------------------------------------------------- */

        .header {
            background: #0d131a;
            border-bottom: 1px solid #293542;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .back-button {
            background: #202c38;
            color: white;
            border: 1px solid #354554;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .back-button:hover {
            background: #2b3a48;
        }

        /* -------------------------------------------------- */
        /* BACKGROUND LOGOS */
        /* -------------------------------------------------- */

        .background-logo {
            position: fixed;
            top: 50%;
            width: 275px;
            height: 275px;
            object-fit: contain;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .background-logo-left {
            left: 80px;
            transform: translateY(-50%);
        }

        .background-logo-right {
            right: 80px;
            transform: translateY(-50%);
        }

        /* -------------------------------------------------- */
        /* PAGE */
        /* -------------------------------------------------- */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 50px;
            position: relative;
            z-index: 1;
        }

        .intro {
            margin-bottom: 25px;
        }

        .intro h1 {
            margin: 0 0 7px;
            font-size: 25px;
            color: #ffffff;
            text-align: left;
        }

        .intro p {
            margin: 0;
            color: #7f8b98;
            font-size: 13px;
            text-align: left;
        }

        /* -------------------------------------------------- */
        /* INTEL CARD */
        /* -------------------------------------------------- */

        .intel-card {
            background: #111821;
            border: 1px solid #293542;
            border-radius: 6px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .intel-card.unread {
            border-left: 4px solid #22c55e;
        }

        .intel-card.read {
            border-left: 4px solid #1d4ed8;
        }

        .intel-card.unassigned {
            border-left: 4px solid #f59e0b;
        }

        .intel-header {
            padding: 15px 18px;
            border-bottom: 1px solid #293542;
            background: #0d131a;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .intel-subject {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: left;
        }

        .intel-meta {
            color: #6f7c88;
            font-size: 11px;
            text-align: left;
        }

        .status-badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .status-new {
            background: #14532d;
            color: #86efac;
        }

        .status-read {
            background: #172554;
            color: #93c5fd;
        }

        .status-unassigned {
            background: #451a03;
            color: #fbbf24;
        }

        .intel-body {
            padding: 18px;
            text-align: left;
        }

        /* -------------------------------------------------- */
        /* INFORMATION GRID */
        /* -------------------------------------------------- */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 17px;
        }

        .info-box {
            background: #0b1117;
            border: 1px solid #293542;
            border-radius: 4px;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        .info-label {
            color: #667381;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: .5px;
            text-align: left;
        }

        .info-value {
            color: #dbe1e7;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            vertical-align: top;
        }

        /* -------------------------------------------------- */
        /* SECTIONS */
        /* -------------------------------------------------- */

        .section {
            margin-bottom: 15px;
            text-align: left;
        }

        .section-title {
            font-size: 10px;
            color: #667381;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: .7px;
            margin-bottom: 6px;
            text-align: left;
        }

        .section-content {
            background: #0b1117;
            border: 1px solid #293542;
            border-radius: 4px;
            padding: 12px;
            color: #d5dbe1;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            text-align: left;
            vertical-align: top;
            min-height: 42px;
        }

        /* -------------------------------------------------- */
        /* ASSIGNED INFO */
        /* -------------------------------------------------- */

        .assigned-panel {
            background: #0d1720;
            border: 1px solid #1d4ed8;
            border-radius: 5px;
            padding: 13px;
            margin-top: 15px;
            text-align: left;
        }

        .assigned-title {
            color: #60a5fa;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: left;
        }

        .assigned-description {
            color: #8b98a5;
            font-size: 12px;
            text-align: left;
        }

        /* -------------------------------------------------- */
        /* TRIAGE / REASSIGN */
        /* -------------------------------------------------- */

        .triage-panel {
            background: #17130b;
            border: 1px solid #92400e;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
        }

        .triage-title {
            color: #fbbf24;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: left;
        }

        .triage-description {
            color: #a8a29e;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
            text-align: left;
        }

        /* -------------------------------------------------- */
        /* REASSIGN AGENT LIST */
        /* Same styling as Submit SCU Intelligence */
        /* -------------------------------------------------- */

        .agent-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 20px;
            background: #080c11;
            border: 1px solid #354554;
            border-radius: 5px;
            overflow: hidden;
            text-align: left;
        }

        .agent-column {
            min-width: 0;
            text-align: left;
        }

        .agent-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            margin: 0;
            border-bottom: 1px solid #202b36;
            cursor: pointer;
            color: #e8edf2;
            font-size: 13px;
            font-weight: normal;
            text-align: left;
        }

        .agent-option:hover {
            background: #111a23;
        }

        .agent-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
            accent-color: #1d4ed8;
            cursor: pointer;
        }

        .agent-name {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .agent-loading {
            grid-column: 1 / -1;
            padding: 12px;
            color: #6f7c88;
            font-size: 12px;
            text-align: left;
        }

        .reassign-button-container {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
        }

        .send-button {
            background: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .send-button:hover {
            background: #2563eb;
        }

        .send-button:disabled {
            background: #263746;
            cursor: not-allowed;
        }

        /* -------------------------------------------------- */
        /* DELETE */
        /* -------------------------------------------------- */

        .intel-footer {
            border-top: 1px solid #293542;
            padding: 11px 18px;
            display: flex;
            justify-content: flex-end;
            background: #0d131a;
        }

        .delete-button {
            background: #3f1111;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
            padding: 7px 11px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #571515;
        }

        /* -------------------------------------------------- */
        /* EMPTY / LOADING */
        /* -------------------------------------------------- */

        .loading,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #6f7c88;
            font-size: 13px;
        }

        /* -------------------------------------------------- */
        /* RESPONSIVE */
        /* -------------------------------------------------- */

        @media (max-width: 800px) {

            .info-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .header-logo {
                width: 42px;
                height: 42px;
            }

            .header-brand {
                gap: 10px;
            }

            .header-title {
                font-size: 17px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .intel-header {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .agent-list {
                grid-template-columns: 1fr;
            }

            .agent-loading {
                grid-column: 1;
            }

            .reassign-button-container {
                justify-content: stretch;
            }

            .send-button {
                width: 100%;
            }

            .background-logo {
                width: 130px;
                height: 130px;
                opacity: 0.25;
            }

            .background-logo-left {
                left: -45px;
            }

            .background-logo-right {
                right: -45px;
            }

        }

    </style>

</head>

<body>

    <!-- ================================================== -->
    <!-- BACKGROUND LOGOS -->
    <!-- ================================================== -->

    <img
        class="background-logo background-logo-left"
        src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
        alt=""
    >

    <img
        class="background-logo background-logo-right"
        src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"

    >


    <!-- ================================================== -->
    <!-- HEADER -->
    <!-- ================================================== -->

    <header class="header">

        <div class="header-brand">

            <img
                class="header-logo"
                src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"

            >

            <div>

                <div class="header-title">

                </div>

            </div>

        </div>


        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'"
        >
            BACK TO DASHBOARD
        </button>

    </header>


    <!-- ================================================== -->
    <!-- PAGE -->
    <!-- ================================================== -->

    <main class="container">

        <div class="intro">

            <h1>
                Intelligence Received
            </h1>

            <p id="page-description">
                Intelligence submissions sent directly to you by authorised officers.
            </p>

        </div>


        <div id="intel-list">

            <div class="loading">
                Loading intelligence...
            </div>

        </div>

    </main>


    <script>

        /* ================================================== */
        /* SUPABASE */
        /* ================================================== */

        const SUPABASE_URL =
            'https://mtlozyseibrefhxnocvb.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ================================================== */
        /* GLOBALS */
        /* ================================================== */

        let currentUser = null;
        let currentOfficer = null;
        let currentRole = null;
        let scaAgents = [];


        /* ================================================== */
        /* FULL INTEL ACCESS */
        /* ================================================== */

        const fullAccessRoles = [
            'master',
            'investigator',
            'case_lead'
        ];


        function hasFullIntelAccess() {

            return fullAccessRoles.includes(
                currentRole
            );

        }


        /* ================================================== */
        /* ESCAPE HELPERS */
        /* ================================================== */

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

        }


        /* ================================================== */
        /* LOAD CURRENT USER */
        /* ================================================== */

        async function loadCurrentUser() {

            const {
                data: {
                    session
                },
                error
            } = await supabaseClient.auth.getSession();


            if (error || !session) {

                window.location.href = 'index.html';

                return false;

            }


            currentUser = session.user;


            const {
                data: officer,
                error: officerError
            } = await supabaseClient

                .from('officers')

                .select(`
                    id,
                    full_name,
                    rank,
                    role,
                    active,
                    callsign,
                    portal_title
                `)

                .eq(
                    'id',
                    currentUser.id
                )

                .single();


            if (officerError || !officer) {

                console.error(
                    officerError
                );

                document.getElementById(
                    'intel-list'
                ).innerHTML = `

                    <div class="empty">

                        Unable to load your officer profile.

                    </div>

                `;

                return false;

            }


            currentOfficer = officer;

            currentRole = officer.role;


            return true;

        }


        /* ================================================== */
        /* LOAD ACTIVE SCU AGENTS */
        /* ================================================== */

        async function loadScuAgents() {

            const {
                data,
                error
            } = await supabaseClient

                .from('officers')

                .select(
                    'id, full_name, rank, callsign'
                )

                .eq(
                    'is_scu_agent',
                    true
                )

                .eq(
                    'active',
                    true
                );


            if (error) {

                console.error(
                    'SCU agent loading error:',
                    error
                );

                scaAgents = [];

                return;

            }


            /* ================================================== */
            /* SAME RANK ORDER AS SUBMIT SCU INTELLIGENCE */
            /* ================================================== */

            const rankOrder = {

                'Head of SCU': 1,

                'Assistant Head of SCU': 2,

                'Head of Weapons': 3,

                'Head of Drugs': 4,

                'Detective': 5

            };


            /*
             * Remove High Command, GOV and any other
             * ranks which should not appear in the
             * recipient/reassignment list.
             */

            const filteredAgents =
                (data || []).filter(
                    agent => {

                        const rank =
                            (agent.rank || '').trim();

                        return Object.prototype.hasOwnProperty.call(
                            rankOrder,
                            rank
                        );

                    }
                );


            /* ================================================== */
            /* SORT BY RANK THEN NAME */
            /* ================================================== */

            filteredAgents.sort(
                (a, b) => {

                    const rankA =
                        (a.rank || '').trim();

                    const rankB =
                        (b.rank || '').trim();


                    const rankDifference =
                        rankOrder[rankA] -
                        rankOrder[rankB];


                    if (
                        rankDifference !== 0
                    ) {

                        return rankDifference;

                    }


                    const nameA =
                        (a.full_name || '')
                            .trim()
                            .toLowerCase();


                    const nameB =
                        (b.full_name || '')
                            .trim()
                            .toLowerCase();


                    return nameA.localeCompare(
                        nameB
                    );

                }
            );


            scaAgents =
                filteredAgents;

        }


        /* ================================================== */
        /* LOAD INTELLIGENCE */
        /* ================================================== */

        async function loadIntel() {

            const intelList =
                document.getElementById(
                    'intel-list'
                );


            intelList.innerHTML = `

                <div class="loading">

                    Loading intelligence...

                </div>

            `;


            let query =
                supabaseClient

                    .from('intel_submissions')

                    .select('*')

                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );


            /*
             * FULL ACCESS
             *
             * Head of SCU
             * Assistant Head of SCU
             * Head of Drugs
             * Head of Weapons
             * High Command
             * GOV
             *
             * All use the backend roles:
             *
             * master
             * investigator
             * case_lead
             */

            if (
                !hasFullIntelAccess()
            ) {

                query = query.eq(
                    'recipient_id',
                    currentUser.id
                );

            }


            const {
                data,
                error
            } = await query;


            if (error) {

                console.error(
                    'Intel loading error:',
                    error
                );

                intelList.innerHTML = `

                    <div class="empty">

                        Unable to load intelligence.

                    </div>

                `;

                return;

            }


            if (!data || data.length === 0) {

                intelList.innerHTML = `

                    <div class="empty">

                        No intelligence available.

                    </div>

                `;

                return;

            }


            /* ================================================== */
            /* LOAD OFFICER INFORMATION */
            /* ================================================== */

            const senderIds = [
                ...new Set(
                    data
                        .map(
                            intel =>
                                intel.sender_id
                        )
                        .filter(Boolean)
                )
            ];


            const recipientIds = [
                ...new Set(
                    data
                        .map(
                            intel =>
                                intel.recipient_id
                        )
                        .filter(Boolean)
                )
            ];


            const allOfficerIds = [
                ...new Set([
                    ...senderIds,
                    ...recipientIds
                ])
            ];


            let officersMap = {};


            if (
                allOfficerIds.length > 0
            ) {

                const {
                    data: officers,
                    error: officersError
                } = await supabaseClient

                    .from('officers')

                    .select(
                        'id, full_name, rank, callsign, portal_title'
                    )

                    .in(
                        'id',
                        allOfficerIds
                    );


                if (!officersError) {

                    (officers || [])
                        .forEach(
                            officer => {

                                officersMap[
                                    officer.id
                                ] = officer;

                            }
                        );

                }

            }


            /* ================================================== */
            /* VIEWED STATE */
            /* ================================================== */

            const intelIds =
                data.map(
                    intel =>
                        intel.id
                );


            let viewedIds =
                new Set();


            if (
                intelIds.length > 0
            ) {

                const {
                    data: views,
                    error: viewsError
                } = await supabaseClient

                    .from('intel_views')

                    .select(
                        'intel_id'
                    )

                    .eq(
                        'user_id',
                        currentUser.id
                    )

                    .in(
                        'intel_id',
                        intelIds
                    );


                if (!viewsError) {

                    viewedIds =
                        new Set(
                            (views || [])
                                .map(
                                    view =>
                                        view.intel_id
                                )
                        );

                }

            }


            intelList.innerHTML = '';


            /* ================================================== */
            /* RENDER INTEL */
            /* ================================================== */

            data.forEach(
                intel => {

                    const sender =
                        officersMap[
                            intel.sender_id
                        ] || null;


                    const recipient =
                        officersMap[
                            intel.recipient_id
                        ] || null;


                    const isUnassigned =
                        !intel.recipient_id;


                    const isViewed =
                        viewedIds.has(
                            intel.id
                        );


                    /*
                     * Mark as viewed.
                     */

                    if (!isViewed) {

                        supabaseClient

                            .from('intel_views')

                            .upsert(
                                {
                                    intel_id:
                                        intel.id,

                                    user_id:
                                        currentUser.id
                                },
                                {
                                    onConflict:
                                        'intel_id,user_id'
                                }
                            )

                            .then(
                                result => {

                                    if (
                                        result.error
                                    ) {

                                        console.error(
                                            'View tracking error:',
                                            result.error
                                        );

                                    }

                                }
                            );

                    }


                    /* ================================================== */
                    /* CARD STATUS */
                    /* ================================================== */

                    let cardClass =
                        'read';


                    let statusBadge =
                        `

                            <span class="status-badge status-read">

                                OPEN

                            </span>

                        `;


                    if (
                        isUnassigned
                    ) {

                        cardClass =
                            'unassigned';


                        statusBadge =
                            `

                                <span class="status-badge status-unassigned">

                                    UNASSIGNED

                                </span>

                            `;

                    }
                    else if (
                        !isViewed
                    ) {

                        cardClass =
                            'unread';


                        statusBadge =
                            `

                                <span class="status-badge status-new">

                                    NEW

                                </span>

                            `;

                    }


                    /* ================================================== */
                    /* DATE */
                    /* ================================================== */

                    const createdDate =
                        intel.created_at
                            ? new Date(
                                intel.created_at
                            ).toLocaleString(
                                'en-GB',
                                {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                }
                            )
                            : 'Unknown';


                    /* ================================================== */
                    /* SENDER */
                    /* ================================================== */

                    const senderName =
                        sender
                            ? `${sender.rank || ''} ${sender.full_name || ''}`.trim()
                            : 'Unknown';


                    const senderDisplay =
                        sender
                            ? `${senderName}${sender.callsign ? ' — ' + sender.callsign : ''}`
                            : 'Unknown';


                    /* ================================================== */
                    /* RECIPIENT */
                    /* ================================================== */

                    const recipientName =
                        recipient
                            ? `${recipient.rank || ''} ${recipient.full_name || ''}`.trim()
                            : 'UNASSIGNED';


                    const recipientDisplay =
                        recipient
                            ? `${recipientName}${recipient.callsign ? ' — ' + recipient.callsign : ''}`
                            : 'No recipient assigned';


                    /* ================================================== */
                    /* TRIAGE / REASSIGN */
                    /* ================================================== */

                    let triageHtml = '';


                    /*
                     * Only full-access senior roles can
                     * assign or reassign intelligence.
                     */

                    if (
                        hasFullIntelAccess()
                    ) {

                        /*
                         * Build the same two-column,
                         * 8-per-column checkbox layout
                         * used by Submit SCU Intelligence.
                         */

                        const agentsPerColumn = 8;


                        const numberOfColumns =
                            Math.ceil(
                                scaAgents.length /
                                agentsPerColumn
                            );


                        const columns = [];


                        for (
                            let i = 0;
                            i < numberOfColumns;
                            i++
                        ) {

                            columns.push([]);

                        }


                        scaAgents.forEach(
                            (agent, index) => {

                                const columnIndex =
                                    Math.floor(
                                        index /
                                        agentsPerColumn
                                    );


                                columns[
                                    columnIndex
                                ].push(
                                    agent
                                );

                            }
                        );


                        const agentColumnsHtml =
                            columns
                                .map(
                                    column => `

                                        <div class="agent-column">

                                            ${
                                                column
                                                    .map(
                                                        agent => `

                                                            <label class="agent-option">

                                                                <input
                                                                    type="checkbox"
                                                                    class="reassign-checkbox"
                                                                    value="${escapeAttribute(agent.id)}"
                                                                    data-intel-id="${escapeAttribute(intel.id)}"
                                                                    ${
                                                                        intel.recipient_id === agent.id
                                                                            ? 'checked'
                                                                            : ''
                                                                    }
                                                                    onchange="handleReassignSelection('${escapeAttribute(intel.id)}', this)"
                                                                >

                                                                <span class="agent-name">

                                                                    ${escapeHtml(
                                                                        `${agent.rank || ''} ${agent.full_name || 'SCU Agent'}${agent.callsign ? ' — ' + agent.callsign : ''}`.trim()
                                                                    )}

                                                                </span>

                                                            </label>

                                                        `
                                                    )
                                                    .join('')
                                            }

                                        </div>

                                    `
                                )
                                .join('');


                        triageHtml = `

                            <div class="triage-panel">

                                <div class="triage-title">

                                    ${
                                        isUnassigned
                                            ? '⚠ UNASSIGNED INTELLIGENCE'
                                            : '↻ REASSIGN INTELLIGENCE'
                                    }

                                </div>


                                <div class="triage-description">

                                    ${
                                        isUnassigned
                                            ? 'This intelligence was submitted without a recipient. Select the appropriate SCU officer below and send the intelligence to them.'
                                            : 'This intelligence is currently assigned to the officer shown below. Select another SCU officer if this intelligence needs to be reassigned.'
                                    }

                                </div>


                                <div
                                    class="agent-list"
                                    id="agent-list-${escapeAttribute(intel.id)}"
                                >

                                    ${
                                        agentColumnsHtml
                                    }

                                </div>


                                <div class="reassign-button-container">

                                    <button
                                        class="send-button"
                                        id="send-${escapeAttribute(intel.id)}"
                                        onclick="assignIntel('${escapeAttribute(intel.id)}')"
                                    >

                                        ${
                                            isUnassigned
                                                ? 'SEND INTEL'
                                                : 'REASSIGN INTEL'
                                        }

                                    </button>

                                </div>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* ASSIGNED INFORMATION */
                    /* ================================================== */

                    let assignedHtml = '';


                    if (
                        !isUnassigned &&
                        hasFullIntelAccess()
                    ) {

                        assignedHtml = `

                            <div class="assigned-panel">

                                <div class="assigned-title">

                                    CURRENT RECIPIENT

                                </div>

                                <div class="assigned-description">

                                    ${escapeHtml(
                                        recipientDisplay
                                    )}

                                </div>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* DELETE PERMISSION */
                    /* ================================================== */

                    const canDeleteThisIntel =
                        hasFullIntelAccess()
                        ||
                        (
                            intel.recipient_id
                            &&
                            intel.recipient_id === currentUser.id
                        );


                    /* ================================================== */
                    /* DELETE BUTTON */
                    /* ================================================== */

                    let deleteHtml = '';


                    if (
                        canDeleteThisIntel
                    ) {

                        deleteHtml = `

                            <div class="intel-footer">

                                <button
                                    class="delete-button"
                                    onclick="deleteIntel('${escapeAttribute(intel.id)}')"
                                >

                                    DELETE INTEL

                                </button>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* LOCATION */
                    /* ================================================== */

                    let locationHtml = '';


                    if (
                        intel.location
                    ) {

                        locationHtml = `

                            <div class="section">

                                <div class="section-title">

                                    Location

                                </div>

                                <div class="section-content">

                                    ${escapeHtml(
                                        intel.location
                                    )}

                                </div>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* SOURCE / CONTEXT */
                    /* ================================================== */

                    let sourceHtml = '';


                    if (
                        intel.source
                        ||
                        intel.context
                    ) {

                        sourceHtml = `

                            <div class="section">

                                <div class="section-title">

                                    Source / Context

                                </div>

                                <div class="section-content">

                                    ${escapeHtml(
                                        intel.source
                                        ||
                                        intel.context
                                        ||
                                        ''
                                    )}

                                </div>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* EVIDENCE */
                    /* ================================================== */

                    let evidenceHtml = '';


                    if (
                        intel.evidence
                    ) {

                        evidenceHtml = `

                            <div class="section">

                                <div class="section-title">

                                    Evidence

                                </div>

                                <div class="section-content">

                                    ${escapeHtml(
                                        intel.evidence
                                    )}

                                </div>

                            </div>

                        `;

                    }


                    /* ================================================== */
                    /* CREATE CARD */
                    /* ================================================== */

                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        `intel-card ${cardClass}`;


                    card.innerHTML = `

                        <div class="intel-header">

                            <div>

                                <div class="intel-subject">

                                    ${escapeHtml(
                                        intel.subject
                                        ||
                                        'Untitled Intelligence'
                                    )}

                                </div>

                                <div class="intel-meta">

                                    Submitted ${escapeHtml(
                                        createdDate
                                    )}

                                </div>

                            </div>


                            ${statusBadge}

                        </div>


                        <div class="intel-body">


                            <div class="info-grid">


                                <div class="info-box">

                                    <div class="info-label">

                                        Intel Type

                                    </div>

                                    <div class="info-value">

                                        ${escapeHtml(
                                            intel.intel_type
                                            ||
                                            'Not specified'
                                        )}

                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">

                                        Submitted By

                                    </div>

                                    <div class="info-value">

                                        ${escapeHtml(
                                            senderDisplay
                                        )}

                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">

                                        Recipient

                                    </div>

                                    <div class="info-value">

                                        ${escapeHtml(
                                            recipientDisplay
                                        )}

                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">

                                        Received

                                    </div>

                                    <div class="info-value">

                                        ${escapeHtml(
                                            createdDate
                                        )}

                                    </div>

                                </div>


                            </div>


                            <div class="section">

                                <div class="section-title">

                                    Finding

                                </div>

                                <div class="section-content">

                                    ${escapeHtml(
                                        intel.finding
                                        ||
                                        intel.description
                                        ||
                                        'No finding provided.'
                                    )}

                                </div>

                            </div>


                            ${locationHtml}

                            ${sourceHtml}

                            ${evidenceHtml}

                            ${assignedHtml}

                            ${triageHtml}


                        </div>


                        ${deleteHtml}

                    `;


                    intelList.appendChild(
                        card
                    );

                }
            );

        }


        /* ================================================== */
        /* HANDLE REASSIGN CHECKBOX */
        /* ================================================== */

        function handleReassignSelection(
            intelId,
            selectedCheckbox
        ) {

            const checkboxes =
                document.querySelectorAll(
                    `.reassign-checkbox[data-intel-id="${intelId}"]`
                );


            checkboxes.forEach(
                checkbox => {

                    if (
                        checkbox !== selectedCheckbox
                    ) {

                        checkbox.checked =
                            false;

                    }

                }
            );

        }


        /* ================================================== */
        /* ASSIGN / REASSIGN INTEL */
        /* ================================================== */

        async function assignIntel(
            intelId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const selectedCheckbox =
                document.querySelector(
                    `.reassign-checkbox[data-intel-id="${intelId}"]:checked`
                );


            if (!selectedCheckbox) {

                alert(
                    'Please select an SCU officer.'
                );

                return;

            }


            const recipientId =
                selectedCheckbox.value;


            const selectedAgent =
                scaAgents.find(
                    agent =>
                        agent.id === recipientId
                );


            const recipientName =
                selectedAgent
                    ? `${selectedAgent.rank || ''} ${selectedAgent.full_name || 'SCU Agent'}`.trim()
                    : 'the selected officer';


            const confirmed =
                confirm(
                    `Send this intelligence to ${recipientName}?`
                );


            if (!confirmed) {

                return;

            }


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (button) {

                button.disabled = true;

                button.textContent =
                    'SENDING...';

            }


            const {
                error
            } = await supabaseClient

                .from('intel_submissions')

                .update({
                    recipient_id:
                        recipientId
                })

                .eq(
                    'id',
                    intelId
                );


            if (error) {

                console.error(
                    'Intel assignment error:',
                    error
                );


                alert(
                    `Unable to assign intelligence.\n\n${error.message || error}`
                );


                if (button) {

                    button.disabled = false;

                    button.textContent =
                        'REASSIGN INTEL';

                }


                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE INTEL */
        /* ================================================== */

        async function deleteIntel(
            intelId
        ) {

            /*
             * First retrieve the Intel record so we can
             * verify who it is assigned to.
             */

            const {
                data: intelRecord,
                error: intelCheckError
            } = await supabaseClient

                .from('intel_submissions')

                .select(
                    'recipient_id'
                )

                .eq(
                    'id',
                    intelId
                )

                .single();


            if (
                intelCheckError
                ||
                !intelRecord
            ) {

                console.error(
                    'Intel permission check error:',
                    intelCheckError
                );


                alert(
                    'Unable to verify this intelligence.'
                );

                return;

            }


            /*
             * Senior roles can delete any Intel.
             *
             * Normal officers can only delete Intel
             * assigned to themselves.
             */

            const canDelete =
                hasFullIntelAccess()
                ||
                (
                    intelRecord.recipient_id
                    &&
                    intelRecord.recipient_id === currentUser.id
                );


            if (!canDelete) {

                alert(
                    'You do not have permission to delete this intelligence.'
                );

                return;

            }


            const confirmed =
                confirm(
                    'Are you sure you want to permanently delete this intelligence?'
                );


            if (!confirmed) {

                return;

            }


            const {
                error
            } = await supabaseClient

                .from('intel_submissions')

                .delete()

                .eq(
                    'id',
                    intelId
                );


            if (error) {

                console.error(
                    'Intel deletion error:',
                    error
                );


                alert(
                    `Unable to delete intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* INITIALISE */
        /* ================================================== */

        async function initialise() {

            const userLoaded =
                await loadCurrentUser();


            if (!userLoaded) {

                return;

            }


            await loadScuAgents();


            if (
                hasFullIntelAccess()
            ) {

                document.getElementById(
                    'page-description'
                ).textContent =
                    'All intelligence submissions across the SCU system. Unassigned intelligence requires triage and assigned intelligence can be reassigned.';

            }


            await loadIntel();

        }


        initialise();

    </script>

</body>

</html>

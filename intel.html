<!DOCTYPE html>

    <style>

<body>

    <div class="header">

                <div class="header-title">

        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'"
        >
            BACK TO DASHBOARD
        </button>

    </div>


    <img
        src="SCU.png"
        class="background-logo background-logo-left"
        alt=""
    >

    <img
        src="SCU.png"
        class="background-logo background-logo-right"
        alt=""
    >


    <div class="container">

        <div class="intro">

            <h1>
                Intelligence
            </h1>

            <p id="page-description">
                Intelligence assigned to you and intelligence requiring review.
            </p>

        </div>


        <div
            id="intel-list"
        >

            <div class="loading">
                Loading intelligence...
            </div>

        </div>

    </div>


    <script>

        const SUPABASE_URL =
            'https://mtlozyseibrefhxnocvb.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let currentUser = null;
        let currentOfficer = null;

        let scaAgents = [];
        let intelRecords = [];
        let nonScuReports = [];


        const fullAccessRoles = [
            'master',
            'investigator',
            'case_lead'
        ];


        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return '';

            }


            return String(value)

                .replace(
                    /&/g,
                    '&amp;'
                )

                .replace(
                    /</g,
                    '&lt;'
                )

                .replace(
                    />/g,
                    '&gt;'
                )

                .replace(
                    /"/g,
                    '&quot;'
                )

                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        function escapeAttribute(value) {

            return escapeHtml(value)
                .replace(
                    /`/g,
                    '&#096;'
                );

        }


        function hasFullIntelAccess() {

            return Boolean(
                currentOfficer &&
                fullAccessRoles.includes(
                    currentOfficer.role
                )
            );

        }


        /* ================================================== */
        /* LOAD CURRENT USER */
        /* ================================================== */

        async function loadCurrentUser() {

            const {
                data: {
                    user
                },
                error
            } =
                await supabaseClient.auth.getUser();


            if (
                error ||
                !user
            ) {

                console.error(
                    'Unable to load current user:',
                    error
                );

                alert(
                    'Your login session could not be found. Please log in again.'
                );

                window.location.href =
                    'index.html';

                return false;

            }


            currentUser =
                user;


            const {
                data: officer,
                error: officerError
            } =
                await supabaseClient
                    .from('officers')
                    .select('*')
                    .eq(
                        'id',
                        user.id
                    )
                    .single();


            if (
                officerError ||
                !officer
            ) {

                console.error(
                    'Unable to load officer profile:',
                    officerError
                );

                alert(
                    'Unable to load your SCU officer profile.'
                );

                return false;

            }


            currentOfficer =
                officer;

            return true;

        }


        /* ================================================== */
        /* LOAD ACTIVE SCU AGENTS */
        /* ================================================== */

        async function loadScuAgents() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('officers')
                    .select(
                        'id, full_name, rank, callsign, portal_title'
                    )
                    .eq(
                        'is_scu_agent',
                        true
                    )
                    .eq(
                        'active',
                        true
                    );


            if (error) {

                console.error(
                    'SCU agent loading error:',
                    error
                );

                scaAgents = [];

                return;

            }


            const rankOrder = {

                'Head of SCU': 1,
                'Assistant Head of SCU': 2,
                'Head of Weapons': 3,
                'Head of Drugs': 4,
                'Detective': 5

            };


            const filteredAgents =
                (data || []).filter(
                    agent => {

                        const rank =
                            (agent.rank || '').trim();

                        const portalTitle =
                            (agent.portal_title || '').trim();


                        /*
                         * GOV and High Command are
                         * overseer accounts.
                         *
                         * They can see all intelligence,
                         * but must NOT appear as
                         * selectable recipients.
                         */

                        if (
                            portalTitle === 'GOV' ||
                            portalTitle === 'High Command'
                        ) {

                            return false;

                        }


                        return Object.prototype.hasOwnProperty.call(
                            rankOrder,
                            rank
                        );

                    }
                );


            filteredAgents.sort(
                (a, b) => {

                    const rankA =
                        (a.rank || '').trim();

                    const rankB =
                        (b.rank || '').trim();


                    const rankDifference =
                        rankOrder[rankA] -
                        rankOrder[rankB];


                    if (
                        rankDifference !== 0
                    ) {

                        return rankDifference;

                    }


                    const nameA =
                        (a.full_name || '')
                            .trim()
                            .toLowerCase();

                    const nameB =
                        (b.full_name || '')
                            .trim()
                            .toLowerCase();


                    return nameA.localeCompare(
                        nameB
                    );

                }
            );


            scaAgents =
                filteredAgents;

        }


        /* ================================================== */
        /* BUILD AGENT LIST */
        /* ================================================== */

        function buildAgentList(
            reportId,
            selectedRecipientIds = []
        ) {

            const selectedIds =
                Array.isArray(
                    selectedRecipientIds
                )
                    ? selectedRecipientIds.map(
                        id =>
                            String(id)
                    )
                    : (
                        selectedRecipientIds
                            ? [
                                String(
                                    selectedRecipientIds
                                )
                            ]
                            : []
                    );


            if (
                !scaAgents.length
            ) {

                return `
                    <div class="error-box">
                        No active SCU officers are currently available for assignment.
                    </div>
                `;

            }


            return scaAgents
                .map(
                    agent => {

                        const checked =
                            selectedIds.includes(
                                String(
                                    agent.id
                                )
                            )
                                ? 'checked'
                                : '';


                        const displayRole =
                            agent.portal_title ||
                            agent.rank ||
                            'SCU Officer';


                        return `
                            <label class="agent-option">

                                <input
                                    type="checkbox"
                                    class="reassign-checkbox"
                                    value="${escapeAttribute(agent.id)}"
                                    data-intel-id="${escapeAttribute(reportId)}"
                                    ${checked}
                                >

                                <div class="agent-name">

                                    ${escapeHtml(
                                        agent.full_name ||
                                        'Unknown Officer'
                                    )}

                                    ${
                                        agent.callsign
                                            ? ` — ${escapeHtml(agent.callsign)}`
                                            : ''
                                    }

                                </div>

                            </label>
                        `;

                    }
                )
                .join('');

        }


        /* ================================================== */
        /* LOAD INTELLIGENCE */
        /* ================================================== */

        async function loadIntel() {

            try {

                let query =
                    supabaseClient
                        .from('intel_submissions')
                        .select('*')
                        .order(
                            'created_at',
                            {
                                ascending: false
                            }
                        );


                /*
                 * Senior users can see all Intel.
                 *
                 * Normal SCU recipients only see
                 * their own copies.
                 */

                if (
                    !hasFullIntelAccess()
                ) {

                    query =
                        query.eq(
                            'recipient_id',
                            currentUser.id
                        );

                }


                const {
                    data: intel,
                    error
                } =
                    await query;


                if (error) {

                    console.error(
                        'Error loading intelligence:',
                        error
                    );

                    throw error;

                }


                intelRecords =
                    intel || [];


                /*
                 * If grouping is enabled, normal recipients
                 * also try to load the other copies belonging
                 * to the same Intel groups.
                 *
                 * This allows the page to display the full
                 * recipient list on one card.
                 */

                const groupIds =
                    [
                        ...new Set(
                            intelRecords
                                .map(
                                    item =>
                                        item.intel_group_id
                                )
                                .filter(Boolean)
                        )
                    ];


                if (
                    groupIds.length
                ) {

                    const {
                        data: groupedCopies,
                        error: groupedError
                    } =
                        await supabaseClient
                            .from(
                                'intel_submissions'
                            )
                            .select('*')
                            .in(
                                'intel_group_id',
                                groupIds
                            );


                    if (!groupedError) {

                        const existingIds =
                            new Set(
                                intelRecords.map(
                                    item =>
                                        String(
                                            item.id
                                        )
                                )
                            );


                        (groupedCopies || []).forEach(
                            item => {

                                if (
                                    !existingIds.has(
                                        String(
                                            item.id
                                        )
                                    )
                                ) {

                                    intelRecords.push(
                                        item
                                    );

                                }

                            }
                        );

                    } else {

                        console.warn(
                            'Unable to load grouped Intel copies. RLS may restrict access:',
                            groupedError
                        );

                    }

                }


                /*
                 * Load officer details.
                 */

                const officerIds =
                    [
                        ...new Set(
                            intelRecords
                                .flatMap(
                                    item => [
                                        item.sender_id,
                                        item.recipient_id
                                    ]
                                )
                                .filter(Boolean)
                                .map(
                                    id =>
                                        String(id)
                                )
                        )
                    ];


                let officerMap = {};


                if (
                    officerIds.length
                ) {

                    const {
                        data: officers,
                        error: officerError
                    } =
                        await supabaseClient
                            .from('officers')
                            .select(
                                'id, full_name, rank, callsign, portal_title'
                            )
                            .in(
                                'id',
                                officerIds
                            );


                    if (
                        officerError
                    ) {

                        console.error(
                            'Intel officer loading error:',
                            officerError
                        );

                    } else {

                        (officers || []).forEach(
                            officer => {

                                officerMap[
                                    String(
                                        officer.id
                                    )
                                ] =
                                    officer;

                            }
                        );

                    }

                }


                intelRecords =
                    intelRecords.map(
                        item => ({

                            ...item,

                            sender_officer:
                                item.sender_id
                                    ? officerMap[
                                        String(
                                            item.sender_id
                                        )
                                    ] || null
                                    : null,

                            recipient_officer:
                                item.recipient_id
                                    ? officerMap[
                                        String(
                                            item.recipient_id
                                        )
                                    ] || null
                                    : null

                        })
                    );


                /*
                 * Load NON-SCU intelligence for
                 * senior users only.
                 */

                if (
                    hasFullIntelAccess()
                ) {

                    const {
                        data: publicReports,
                        error: publicError
                    } =
                        await supabaseClient
                            .from(
                                'non_scu_intel_submissions'
                            )
                            .select('*')
                            .eq(
                                'status',
                                'unassigned'
                            )
                            .order(
                                'created_at',
                                {
                                    ascending: false
                                }
                            );


                    if (
                        publicError
                    ) {

                        console.error(
                            'NON-SCU load error:',
                            publicError
                        );

                        nonScuReports =
                            [];

                    } else {

                        nonScuReports =
                            publicReports || [];

                    }

                } else {

                    nonScuReports =
                        [];

                }


                renderIntel();

            } catch (error) {

                console.error(
                    'loadIntel failed:',
                    error
                );

                document.getElementById(
                    'intel-list'
                ).innerHTML = `
                    <div class="error-box">
                        Unable to load intelligence.
                        <br><br>
                        ${escapeHtml(
                            error?.message ||
                            error ||
                            'Unknown error'
                        )}
                    </div>
                `;

            }

        }


        /* ================================================== */
        /* RENDER INTELLIGENCE */
        /* ================================================== */

        function renderIntel() {

            const intelList =
                document.getElementById(
                    'intel-list'
                );


            intelList.innerHTML =
                '';


            /*
             * Group SCU Intel by intel_group_id.
             *
             * This means several database copies
             * become ONE visual Intel card.
             */

            const groupedScuIntel =
                new Map();


            intelRecords.forEach(
                item => {

                    const groupKey =
                        item.intel_group_id ||
                        item.id;


                    if (
                        !groupedScuIntel.has(
                            groupKey
                        )
                    ) {

                        groupedScuIntel.set(
                            groupKey,
                            []
                        );

                    }


                    groupedScuIntel
                        .get(groupKey)
                        .push(item);

                }
            );


            const combined =
                [];


            groupedScuIntel.forEach(
                groupItems => {

                    const newest =
                        [...groupItems]
                            .sort(
                                (a, b) =>
                                    new Date(
                                        b.created_at
                                    ) -
                                    new Date(
                                        a.created_at
                                    )
                            )[0];


                    combined.push({

                        type:
                            'scu',

                        created_at:
                            newest.created_at,

                        items:
                            groupItems

                    });

                }
            );


            if (
                hasFullIntelAccess()
            ) {

                nonScuReports.forEach(
                    item => {

                        combined.push({

                            type:
                                'non-scu',

                            created_at:
                                item.created_at,

                            items:
                                [
                                    item
                                ]

                        });

                    }
                );

            }


            combined.sort(
                (a, b) =>
                    new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    )
            );


            if (
                !combined.length
            ) {

                intelList.innerHTML = `
                    <div class="empty-state">
                        No intelligence currently requires your attention.
                    </div>
                `;

                return;

            }


            combined.forEach(
                entry => {

                    if (
                        entry.type ===
                        'non-scu'
                    ) {

                        renderNonScuIntel(
                            entry.items[0],
                            intelList
                        );

                    } else {

                        renderScuIntel(
                            entry.items,
                            intelList
                        );

                    }

                }
            );

        }

        function renderScuIntel(

            if (

                !intelItems.length
            ) {

                return;

            }


            const primaryIntel =
                intelItems[0];


            const card =
                document.createElement(
                    'div'
                );


            const currentCopy =
                intelItems.find(
                    item =>
                        currentUser &&
                        String(
                            item.recipient_id
                        ) ===
                        String(
                            currentUser.id
                        )
                ) ||
                primaryIntel;


            const isCurrentRecipient =
                Boolean(
                    currentCopy &&
                    currentUser &&
                    String(
                        currentCopy.recipient_id
                    ) ===
                    String(
                        currentUser.id
                    )
                );


            card.className =
                isCurrentRecipient
                    ? 'intel-card unread'
                    : 'intel-card read';


            const createdDate =
                primaryIntel.created_at
                    ? new Date(
                        primaryIntel.created_at
                    ).toLocaleString(
                        'en-GB'
                    )
                    : 'Unknown';


            /*
             * Sender.
             */

            const sender =
                primaryIntel.sender_officer ||
                null;


            const senderDisplay =
                sender
                    ? `${sender.full_name || 'Unknown Officer'}${
                        sender.callsign
                            ? ` — ${sender.callsign}`
                            : ''
                    }`
                    : 'Unknown Officer';


            /*
             * Build complete recipient list.
             */

            const recipientMap =
                new Map();


            intelItems.forEach(
                item => {

                    if (
                        !item.recipient_id
                    ) {

                        return;

                    }


                    const key =
                        String(
                            item.recipient_id
                        );


                    if (
                        !recipientMap.has(
                            key

                        recipientMap.set(

                            item.recipient_officer ||

            const recipientEntries =
                Array.from(
                    recipientMap.entries()

            const recipientListHtml =
                recipientEntries.length
                    ? `
                        <div class="recipient-list">

                            ${

                                                currentUser &&
                                                String(

                                                String(

                                                recipient
                                                    ? `${recipient.full_name || 'Unknown Officer'}${

                                                            ? ` — ${recipient.callsign}`
                                                            : ''

            const selectedRecipientIds =

            const agentColumnsHtml =

            const locationHtml =

                                Evidence

            card.innerHTML = `

                            <div class="info-value">

                        <div class="info-box">

        /* ================================================== */
        /* ASSIGN / REASSIGN EXISTING SCU INTEL */
        /* ================================================== */

        async function assignIntel(
            intelId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const selectedCheckboxes =
                Array.from(
                    document.querySelectorAll(
                        `.reassign-checkbox[data-intel-id="${intelId}"]:checked`
                    )
                );


            const recipientIds =
                [
                    ...new Set(
                        selectedCheckboxes
                            .map(
                                checkbox =>
                                    checkbox.value
                            )
                            .filter(Boolean)
                    )
                ];


            if (
                recipientIds.length === 0
            ) {

                alert(
                    'Please select at least one SCU officer.'
                );

                return;

            }


            const recipientNames =
                recipientIds
                    .map(
                        recipientId => {

                            const agent =
                                scaAgents.find(
                                    item =>
                                        String(
                                            item.id
                                        ) ===
                                        String(
                                            recipientId
                                        )
                                );


                            return agent
                                ? `${agent.full_name || 'SCU Officer'}${agent.callsign ? ` (${agent.callsign})` : ''}`
                                : 'Selected officer';

                        }
                    );


            if (
                !confirm(
                    `Send this intelligence to ${recipientNames.join(', ')}?`
                )
            ) {

                return;

            }


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            /*
             * Load the selected Intel row.
             */

            const {
                data: existingIntel,
                error: existingError
            } =
                await supabaseClient
                    .from('intel_submissions')
                    .select('*')
                    .eq(
                        'id',
                        intelId
                    )
                    .single();


            if (
                existingError ||
                !existingIntel
            ) {

                console.error(
                    'Unable to load existing intelligence:',
                    existingError
                );

                alert(
                    `Unable to load this intelligence.\n\n${existingError?.message || existingError || 'Unknown error'}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'REASSIGN INTEL';

                }

                return;

            }


            /*
             * Make sure every copy in the group has the
             * same intel_group_id.
             */

            let intelGroupId =
                existingIntel.intel_group_id;


            if (!intelGroupId) {

                intelGroupId =
                    crypto.randomUUID();


                const {
                    error: groupIdError
                } =
                    await supabaseClient
                        .from(
                            'intel_submissions'
                        )
                        .update({
                            intel_group_id:
                                intelGroupId
                        })
                        .eq(
                            'id',
                            intelId
                        );


                if (
                    groupIdError
                ) {

                    console.error(
                        'Unable to create Intel group:',
                        groupIdError
                    );

                    alert(
                        `Unable to create an Intel group for this intelligence.\n\n${groupIdError.message || groupIdError}`
                    );


                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            'REASSIGN INTEL';

                    }

                    return;

                }

            }


            /*
             * Load all current copies in this group.
             */

            const {
                data: groupRows,
                error: groupError
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .select('*')
                    .eq(
                        'intel_group_id',
                        intelGroupId
                    );


            if (
                groupError
            ) {

                console.error(
                    'Unable to load Intel group:',
                    groupError
                );

                alert(
                    `Unable to load the current Intel recipients.\n\n${groupError.message || groupError}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'REASSIGN INTEL';

                }

                return;

            }


            const currentRows =
                groupRows || [];


            const currentRecipientMap =
                new Map();


            currentRows.forEach(
                row => {

                    if (
                        row.recipient_id
                    ) {

                        currentRecipientMap.set(
                            String(
                                row.recipient_id
                            ),
                            row
                        );

                    }

                }
            );


            /*
             * Insert missing recipients.
             */

            const rowsToInsert =
                recipientIds
                    .filter(
                        recipientId =>
                            !currentRecipientMap.has(
                                String(
                                    recipientId
                                )
                            )
                    )
                    .map(
                        recipientId => {

                            const copy =
                                {
                                    ...existingIntel,

                                    id:
                                        undefined,

                                    recipient_id:
                                        recipientId,

                                    intel_group_id:
                                        intelGroupId
                                };


                            delete copy.id;


                            return copy;

                        }
                    );


            if (
                rowsToInsert.length
            ) {

                const {
                    error: insertError
                } =
                    await supabaseClient
                        .from(
                            'intel_submissions'
                        )
                        .insert(
                            rowsToInsert
                        );


                if (
                    insertError
                ) {

                    console.error(
                        'Intel recipient creation error:',
                        insertError
                    );

                    alert(
                        `Unable to add one or more recipients.\n\n${insertError.message || insertError}`
                    );


                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            'REASSIGN INTEL';

                    }

                    await loadIntel();

                    return;

                }

            }


            /*
             * If the original row does not currently belong
             * to a selected recipient, move it to the first
             * selected recipient.
             *
             * This avoids creating a duplicate copy for the
             * original row.
             */

            const existingSelectedRow =
                currentRows.find(
                    row =>
                        row.recipient_id &&
                        recipientIds.includes(
                            String(
                                row.recipient_id
                            )
                        )
                );


            if (
                !existingSelectedRow &&
                currentRows.length
            ) {

                const firstRow =
                    currentRows[0];


                const {
                    error: moveError
                } =
                    await supabaseClient
                        .from(
                            'intel_submissions'
                        )
                        .update({
                            recipient_id:
                                recipientIds[0],

                            intel_group_id:
                                intelGroupId
                        })
                        .eq(
                            'id',
                            firstRow.id
                        );


                if (
                    moveError
                ) {

                    console.error(
                        'Intel recipient reassignment error:',
                        moveError
                    );

                    alert(
                        `Unable to reassign the original Intel copy.\n\n${moveError.message || moveError}`
                    );


                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            'REASSIGN INTEL';

                    }

                    await loadIntel();

                    return;

                }

            }


            /*
             * Remove recipients who were unchecked.
             *
             * Only rows belonging to this Intel group are
             * affected.
             */

            const rowsAfterInsert =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .select(
                        'id, recipient_id, intel_group_id'
                    )
                    .eq(
                        'intel_group_id',
                        intelGroupId
                    );


            if (
                !rowsAfterInsert.error
            ) {

                const rowsToRemove =
                    (
                        rowsAfterInsert.data ||
                        []
                    ).filter(
                        row =>
                            row.recipient_id &&
                            !recipientIds.includes(
                                String(
                                    row.recipient_id
                                )
                            )
                    );


                for (
                    const row
                    of rowsToRemove
                ) {

                    const {
                        error: removeError
                    } =
                        await supabaseClient
                            .from(
                                'intel_submissions'
                            )
                            .delete()
                            .eq(
                                'id',
                                row.id
                            );


                    if (
                        removeError
                    ) {

                        console.error(
                            'Unable to remove old Intel recipient:',
                            removeError
                        );

                    }

                }

            }


            await loadIntel();

        }


        /* ================================================== */
        /* ASSIGN NON-SCU INTEL */
        /* ================================================== */

        async function assignNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            if (
                !currentOfficer ||
                !currentOfficer.id
            ) {

                alert(
                    'Unable to identify the sending SCU officer. Please refresh the page and try again.'
                );

                return;

            }


            const report =
                nonScuReports.find(
                    item =>
                        item.id ===
                        reportId
                );


            if (!report) {

                alert(
                    'Unable to find this NON-SCU intelligence report.'
                );

                return;

            }


            const selectedCheckboxes =
                Array.from(
                    document.querySelectorAll(
                        `.reassign-checkbox[data-intel-id="public-${reportId}"]:checked`
                    )
                );


            const recipientIds =
                [
                    ...new Set(
                        selectedCheckboxes
                            .map(
                                checkbox =>
                                    checkbox.value
                            )
                            .filter(Boolean)
                    )
                ];


            if (
                recipientIds.length === 0
            ) {

                alert(
                    'Please select at least one SCU officer.'
                );

                return;

            }


            const recipientNames =
                recipientIds
                    .map(
                        recipientId => {

                            const agent =
                                scaAgents.find(
                                    item =>
                                        String(
                                            item.id
                                        ) ===
                                        String(
                                            recipientId
                                        )
                                );


                            return agent
                                ? `${agent.full_name || 'SCU Officer'}${agent.callsign ? ` (${agent.callsign})` : ''}`
                                : 'Selected officer';

                        }
                    );


            if (
                !confirm(
                    `Send this NON-SCU intelligence to ${recipientNames.join(', ')}?`
                )
            ) {

                return;

            }


            const button =
                document.getElementById(
                    `send-public-${reportId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            const senderId =
                currentOfficer.id;


            /*
             * One group ID is used for every recipient copy.
             */

            const intelGroupId =
                crypto.randomUUID();


            const rowsToInsert =
                recipientIds.map(
                    recipientId => ({

                        sender_id:
                            senderId,

                        recipient_id:
                            recipientId,

                        intel_group_id:
                            intelGroupId,

                        subject:
                            'NON-SCU MEMBER INTELLIGENCE',

                        intel_type:
                            report.intel_type ||
                            'NON-SCU MEMBER REPORT',

                        finding:
                            report.finding ||
                            '',

                        location:
                            report.location ||
                            null,

                        source:
                            report.source
                                ? `NON-SCU MEMBER REPORTER: ${report.reporter_name || 'Unknown'} — CALL SIGN: ${report.reporter_callsign || 'None'}\n\n${report.source}`
                                : `NON-SCU MEMBER REPORTER: ${report.reporter_name || 'Unknown'} — CALL SIGN: ${report.reporter_callsign || 'None'}`,

                        evidence:
                            report.evidence ||
                            null

                    })
                );


            const {
                data: insertedIntel,
                error: insertError
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .insert(
                        rowsToInsert
                    )
                    .select();


            if (
                insertError
            ) {

                console.error(
                    'NON-SCU conversion error:',
                    insertError
                );

                alert(
                    `Unable to send NON-SCU intelligence.\n\n${insertError.message || insertError}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'SEND INTEL';

                }

                return;

            }


            console.log(
                'NON-SCU INTEL CREATED:',
                insertedIntel
            );


            const {
                error: statusError
            } =
                await supabaseClient
                    .from(
                        'non_scu_intel_submissions'
                    )
                    .update({
                        status:
                            'assigned'
                    })
                    .eq(
                        'id',
                        reportId
                    );


            if (
                statusError
            ) {

                console.error(
                    'NON-SCU status update error:',
                    statusError
                );

                alert(
                    'The intelligence was sent successfully, but the original NON-SCU report could not be marked as assigned. Please refresh the page and check the queue.'
                );


                await loadIntel();

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE EXISTING SCU INTEL */
        /* ================================================== */

        async function deleteIntel(
            intelId
        ) {

            const {
                data: intelRecord,
                error: intelCheckError
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .select(
                        'recipient_id'
                    )
                    .eq(
                        'id',
                        intelId
                    )
                    .single();


            if (
                intelCheckError ||
                !intelRecord
            ) {

                console.error(
                    'Intel permission check error:',
                    intelCheckError
                );

                alert(
                    'Unable to verify this intelligence.'
                );

                return;

            }


            const canDelete =
                hasFullIntelAccess()
                ||
                (
                    intelRecord.recipient_id &&
                    String(
                        intelRecord.recipient_id
                    ) ===
                    String(
                        currentUser.id
                    )
                );


            if (!canDelete) {

                alert(
                    'You do not have permission to delete this intelligence.'
                );

                return;

            }


            if (
                !confirm(
                    'Are you sure you want to permanently delete this intelligence?'
                )
            ) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .delete()
                    .eq(
                        'id',
                        intelId
                    );


            if (error) {

                console.error(
                    'Intel deletion error:',
                    error
                );

                alert(
                    `Unable to delete intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE NON-SCU INTEL */
        /* ================================================== */

        async function deleteNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to delete NON-SCU intelligence.'
                );

                return;

            }


            const report =
                nonScuReports.find(
                    item =>
                        item.id ===
                        reportId
                );


            if (!report) {

                alert(
                    'Unable to find this NON-SCU intelligence report.'
                );

                return;

            }


            if (
                !confirm(
                    'DELETE BOGUS REPORT?\n\nThis will permanently delete this NON-SCU intelligence report and it cannot be recovered.'
                )
            ) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        'non_scu_intel_submissions'
                    )
                    .delete()
                    .eq(
                        'id',
                        reportId
                    );


            if (error) {

                console.error(
                    'NON-SCU intelligence deletion error:',
                    error
                );

                alert(
                    `Unable to delete NON-SCU intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* INITIALISE */
        /* ================================================== */

        async function initialise() {

            const userLoaded =
                await loadCurrentUser();


            if (!userLoaded) {

                return;

            }


            await loadScuAgents();


            if (
                hasFullIntelAccess()
            ) {

                document.getElementById(
                    'page-description'
                ).textContent =
                    'All intelligence submissions across the SCU system. NON-SCU member reports appear here for triage and assignment.';

            }


            await loadIntel();

        }


        initialise();

    </script>

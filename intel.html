<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Intelligence</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e5e7eb;
        }

        .header {
            background: #0d131a;
            border-bottom: 1px solid #293542;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: #17212b;
            border: 1px solid #344353;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            margin-top: 3px;
            font-size: 11px;
            color: #8d9aaa;
            letter-spacing: 0.5px;
        }

        .back-button {
            background: #17212b;
            color: #dbe4ed;
            border: 1px solid #344353;
            border-radius: 6px;
            padding: 9px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #202c38;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
        }

        .page-heading {
            margin-bottom: 20px;
        }

        .page-title {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }

        .page-description {
            margin-top: 7px;
            color: #7f8b99;
            font-size: 12px;
            line-height: 1.5;
        }

        .intel-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .intel-card {
            background: #10171f;
            border: 1px solid #293542;
            border-radius: 9px;
            overflow: hidden;
        }

        .intel-card.new {
            border-left: 4px solid #9b2c2c;
        }

        .intel-card.open {
            border-left: 4px solid #365f7c;
        }

        .intel-card.non-scu {
            border-left: 4px solid #7c5a36;
        }

        .intel-header {
            padding: 16px 18px;
            background: #141d26;
            border-bottom: 1px solid #293542;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .intel-heading {
            min-width: 0;
        }

        .intel-subject {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .intel-type {
            color: #91a0b0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .intel-status {
            flex-shrink: 0;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.6px;
        }

        .status-new {
            background: #552020;
            color: #ffb5b5;
            border: 1px solid #783232;
        }

        .status-open {
            background: #1c3446;
            color: #a9d7f5;
            border: 1px solid #2e536d;
        }

        .status-unassigned {
            background: #4c3822;
            color: #f3c78f;
            border: 1px solid #73552f;
        }

        .intel-body {
            padding: 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .info-box {
            background: #0b1117;
            border: 1px solid #232f3a;
            border-radius: 6px;
            padding: 10px 12px;
        }

        .info-label {
            color: #687787;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #dbe4ed;
            font-size: 12px;
            line-height: 1.45;
            word-break: break-word;
        }

        .section {
            margin-top: 14px;
            background: #0b1117;
            border: 1px solid #232f3a;
            border-radius: 6px;
            overflow: hidden;
        }

        .section-title {
            padding: 9px 12px;
            background: #111923;
            border-bottom: 1px solid #232f3a;
            color: #8191a1;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-weight: bold;
        }

        .section-content {
            padding: 12px;
            color: #d5dde5;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .triage-panel {
            margin-top: 18px;
            background: #0c141c;
            border: 1px solid #344353;
            border-radius: 7px;
            padding: 16px;
        }

        .non-scu-triage {
            border-color: #654a2b;
            background: #15110c;
        }

        .triage-title {
            font-size: 11px;
            font-weight: bold;
            color: #e6edf5;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        .non-scu-triage .triage-title {
            color: #efc07b;
        }

        .triage-description {
            font-size: 11px;
            line-height: 1.5;
            color: #8391a0;
            margin-bottom: 14px;
        }

        .agent-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .agent-option {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #111a23;
            border: 1px solid #293542;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .agent-option:hover {
            background: #17222d;
            border-color: #405264;
        }

        .agent-option input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #4e7696;
            cursor: pointer;
            flex-shrink: 0;
        }

        .agent-details {
            min-width: 0;
        }

        .agent-name {
            color: #dce5ed;
            font-size: 11px;
            font-weight: bold;
        }

        .agent-role {
            color: #738294;
            font-size: 9px;
            margin-top: 2px;
        }

        .current-recipient {
            margin-top: 12px;
            padding: 9px 10px;
            background: #0b1117;
            border: 1px solid #232f3a;
            border-radius: 5px;
            color: #8b9aaa;
            font-size: 10px;
        }

        .reassign-button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .send-button {
            background: #29485d;
            border: 1px solid #3b6682;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:hover {
            background: #355d76;
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .delete-button {
            background: #551f1f;
            border: 1px solid #793030;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #6b2929;
        }

        .delete-non-scu-button {
            background: #5a2d1e;
            border: 1px solid #7a412b;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-non-scu-button:hover {
            background: #713923;
        }

        .empty-state {
            background: #10171f;
            border: 1px solid #293542;
            border-radius: 9px;
            padding: 45px 20px;
            text-align: center;
            color: #6f7d8b;
            font-size: 12px;
        }

        .loading {
            padding: 35px;
            text-align: center;
            color: #788694;
            font-size: 12px;
        }

        .error-box {
            background: #241313;
            border: 1px solid #5f2929;
            border-radius: 7px;
            padding: 15px;
            color: #e6a5a5;
            font-size: 12px;
            line-height: 1.5;
        }

        .error-box button {
            margin-top: 10px;
            background: #552020;
            border: 1px solid #783232;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .page {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .agent-list {
                grid-template-columns: 1fr;
            }

            .intel-header {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <div class="header-brand">

            <div class="header-logo">
                SCU
            </div>

            <div>
                <div class="header-title">
                    SCU INTELLIGENCE
                </div>

                <div class="header-subtitle">
                    STREET CRIMES UNIT
                </div>
            </div>

        </div>

        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'"
        >
            BACK TO DASHBOARD
        </button>

    </div>


    <div class="page">

        <div class="page-heading">

            <h1 class="page-title">
                Intelligence
            </h1>

            <div
                class="page-description"
                id="page-description"
            >
                Intelligence assigned to you and intelligence requiring review.
            </div>

        </div>


        <div
            class="intel-list"
            id="intel-list"
        >

            <div class="loading">
                Loading intelligence...
            </div>

        </div>

    </div>


    <script>

        const SUPABASE_URL =
            'https://mtlozyseibrefhxnocvb.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let currentUser = null;
        let currentOfficer = null;
        let scaAgents = [];
        let intelRecords = [];
        let nonScuReports = [];


        const fullAccessRoles = [
            'master',
            'investigator',
            'case_lead'
        ];


        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function escapeAttribute(value) {

            return escapeHtml(value)
                .replace(/`/g, '&#096;');

        }


        function hasFullIntelAccess() {

            return Boolean(
                currentOfficer &&
                fullAccessRoles.includes(
                    currentOfficer.role
                )
            );

        }


        /* ================================================== */
        /* LOAD CURRENT USER */
        /* ================================================== */

        async function loadCurrentUser() {

            const {
                data: {
                    user
                },
                error
            } =
                await supabaseClient.auth.getUser();


            if (
                error ||
                !user
            ) {

                console.error(
                    'Unable to load current user:',
                    error
                );

                alert(
                    'Your login session could not be found. Please log in again.'
                );

                window.location.href =
                    'index.html';

                return false;

            }


            currentUser =
                user;


            const {
                data: officer,
                error: officerError
            } =
                await supabaseClient
                    .from('officers')
                    .select('*')
                    .eq(
                        'id',
                        user.id
                    )
                    .single();


            if (
                officerError ||
                !officer
            ) {

                console.error(
                    'Unable to load officer profile:',
                    officerError
                );

                alert(
                    'Unable to load your SCU officer profile.'
                );

                return false;

            }


            currentOfficer =
                officer;

            return true;

        }


        /* ================================================== */
        /* LOAD SCU AGENTS */
        /* ================================================== */

        async function loadScuAgents() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('officers')
                    .select(
                        'id, full_name, callsign, rank, role, portal_title, active, is_scu_agent'
                    )
                    .eq(
                        'active',
                        true
                    )
                    .eq(
                        'is_scu_agent',
                        true
                    );


            if (error) {

                console.error(
                    'Unable to load SCU agents:',
                    error
                );

                scaAgents = [];

                return;

            }


            const rankOrder = {
                'Head of SCU': 1,
                'Assistant Head of SCU': 2,
                'Head of Weapons': 3,
                'Head of Drugs': 4,
                'Detective': 5
            };


            scaAgents =
                (data || []).sort(
                    (a, b) => {

                        const aRank =
                            rankOrder[
                                a.portal_title
                            ] ||
                            rankOrder[
                                a.rank
                            ] ||
                            99;

                        const bRank =
                            rankOrder[
                                b.portal_title
                            ] ||
                            rankOrder[
                                b.rank
                            ] ||
                            99;

                        if (
                            aRank !==
                            bRank
                        ) {

                            return (
                                aRank -
                                bRank
                            );

                        }

                        return String(
                            a.full_name ||
                            ''
                        ).localeCompare(
                            String(
                                b.full_name ||
                                ''
                            )
                        );

                    }
                );

        }


        /* ================================================== */
        /* BUILD AGENT LIST */
        /* ================================================== */

        function buildAgentList(
            reportId,
            selectedRecipientIds = []
        ) {

            const selectedIds =
                Array.isArray(
                    selectedRecipientIds
                )
                    ? selectedRecipientIds.map(
                        id => String(id)
                    )
                    : (
                        selectedRecipientIds
                            ? [
                                String(
                                    selectedRecipientIds
                                )
                            ]
                            : []
                    );


            if (
                !scaAgents.length
            ) {

                return `
                    <div class="error-box">
                        No active SCU officers are currently available for assignment.
                    </div>
                `;

            }


            return scaAgents
                .map(
                    agent => {

                        const checked =
                            selectedIds.includes(
                                String(agent.id)
                            )
                                ? 'checked'
                                : '';


                        const displayRole =
                            agent.portal_title ||
                            agent.rank ||
                            'SCU Officer';


                        return `
                            <label class="agent-option">

                                <input
                                    type="checkbox"
                                    class="reassign-checkbox"
                                    value="${escapeAttribute(agent.id)}"
                                    data-intel-id="${escapeAttribute(reportId)}"
                                    ${checked}
                                >

                                <div class="agent-details">

                                    <div class="agent-name">
                                        ${escapeHtml(agent.full_name || 'Unknown Officer')}
                                    </div>

                                    <div class="agent-role">
                                        ${escapeHtml(displayRole)}
                                        ${
                                            agent.callsign
                                                ? ` — ${escapeHtml(agent.callsign)}`
                                                : ''
                                        }
                                    </div>

                                </div>

                            </label>
                        `;

                    }
                )
                .join('');

        }


        /* ================================================== */
        /* LOAD INTELLIGENCE */
        /* ================================================== */

        async function loadIntel() {

            const intelList =
                document.getElementById(
                    'intel-list'
                );


            intelList.innerHTML = `
                <div class="loading">
                    Loading intelligence...
                </div>
            `;


            let query =
                supabaseClient
                    .from('intel_submissions')
                    .select('*')
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );


            if (
                !hasFullIntelAccess()
            ) {

                query =
                    query.eq(
                        'recipient_id',
                        currentUser.id
                    );

            }


            const {
                data: intel,
                error: intelError
            } =
                await query;


            if (intelError) {

                console.error(
                    'Intel load error:',
                    intelError
                );

                intelList.innerHTML = `
                    <div class="error-box">
                        Unable to load intelligence.
                        <br><br>
                        ${escapeHtml(
                            intelError.message ||
                            intelError
                        )}
                        <br>
                        <button onclick="loadIntel()">
                            RETRY
                        </button>
                    </div>
                `;

                return;

            }


            intelRecords =
                intel || [];


            if (
                hasFullIntelAccess()
            ) {

                const {
                    data: publicReports,
                    error: publicError
                } =
                    await supabaseClient
                        .from(
                            'non_scu_intel_submissions'
                        )
                        .select('*')
                        .eq(
                            'status',
                            'unassigned'
                        )
                        .order(
                            'created_at',
                            {
                                ascending: false
                            }
                        );


                if (publicError) {

                    console.error(
                        'NON-SCU load error:',
                        publicError
                    );

                    nonScuReports = [];

                } else {

                    nonScuReports =
                        publicReports || [];

                }

            } else {

                nonScuReports = [];

            }


            renderIntel();

        }


        /* ================================================== */
        /* RENDER INTELLIGENCE */
        /* ================================================== */

        function renderIntel() {

            const intelList =
                document.getElementById(
                    'intel-list'
                );


            intelList.innerHTML = '';


            const combined = [];


            intelRecords.forEach(
                item => {

                    combined.push({
                        type: 'scu',
                        created_at:
                            item.created_at,
                        item
                    });

                }
            );


            if (
                hasFullIntelAccess()
            ) {

                nonScuReports.forEach(
                    item => {

                        combined.push({
                            type: 'non-scu',
                            created_at:
                                item.created_at,
                            item
                        });

                    }
                );

            }


            combined.sort(
                (a, b) => {

                    return new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    );

                }
            );


            if (
                !combined.length
            ) {

                intelList.innerHTML = `
                    <div class="empty-state">
                        No intelligence currently requires your attention.
                    </div>
                `;

                return;

            }


            combined.forEach(
                entry => {

                    if (
                        entry.type === 'non-scu'
                    ) {

                        renderNonScuIntel(
                            entry.item,
                            intelList
                        );

                    } else {

                        renderScuIntel(
                            entry.item,
                            intelList
                        );

                    }

                }
            );

        }


        /* ================================================== */
        /* RENDER SCU INTEL */
        /* ================================================== */

        function renderScuIntel(
            intel,
            intelList
        ) {

            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'intel-card open';


            const createdDate =
                intel.created_at
                    ? new Date(
                        intel.created_at
                    ).toLocaleString(
                        'en-GB'
                    )
                    : 'Unknown';


            const isRecipient =
                intel.recipient_id &&
                currentUser &&
                String(
                    intel.recipient_id
                ) ===
                String(
                    currentUser.id
                );


            const statusClass =
                isRecipient
                    ? 'status-new'
                    : 'status-open';


            const statusText =
                isRecipient
                    ? 'NEW'
                    : 'OPEN';


            const locationHtml =
                intel.location
                    ? `
                        <div class="section">

                            <div class="section-title">
                                Location
                            </div>

                            <div class="section-content">${escapeHtml(intel.location)}</div>

                        </div>
                    `
                    : '';


            const sourceHtml =
                intel.source
                    ? `
                        <div class="section">

                            <div class="section-title">
                                Source
                            </div>

                            <div class="section-content">${escapeHtml(intel.source)}</div>

                        </div>
                    `
                    : '';


            const evidenceHtml =
                intel.evidence
                    ? `
                        <div class="section">

                            <div class="section-title">
                                Evidence
                            </div>

                            <div class="section-content">${escapeHtml(intel.evidence)}</div>

                        </div>
                    `
                    : '';


            const selectedRecipientIds =
                intel.recipient_id
                    ? [
                        intel.recipient_id
                    ]
                    : [];


            const agentColumnsHtml =
                buildAgentList(
                    intel.id,
                    selectedRecipientIds
                );


            card.innerHTML = `

                <div class="intel-header">

                    <div class="intel-heading">

                        <div class="intel-subject">
                            ${escapeHtml(
                                intel.subject ||
                                'Untitled Intelligence'
                            )}
                        </div>

                        <div class="intel-type">
                            ${escapeHtml(
                                intel.intel_type ||
                                'General Intelligence'
                            )}
                        </div>

                    </div>

                    <div class="intel-status ${statusClass}">
                        ${statusText}
                    </div>

                </div>


                <div class="intel-body">

                    <div class="info-grid">

                        <div class="info-box">

                            <div class="info-label">
                                Received
                            </div>

                            <div class="info-value">
                                ${escapeHtml(
                                    createdDate
                                )}
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Recipient
                            </div>

                            <div class="info-value">

                                ${
                                    intel.recipient_id
                                        ? (
                                            scaAgents.find(
                                                agent =>
                                                    String(agent.id) ===
                                                    String(intel.recipient_id)
                                            )
                                                ? escapeHtml(
                                                    scaAgents.find(
                                                        agent =>
                                                            String(agent.id) ===
                                                            String(intel.recipient_id)
                                                    ).full_name
                                                )
                                                : 'Assigned SCU Officer'
                                        )
                                        : 'UNASSIGNED'
                                }

                            </div>

                        </div>

                    </div>


                    <div class="section">

                        <div class="section-title">
                            Finding
                        </div>

                        <div class="section-content">${escapeHtml(
                            intel.finding ||
                            'No finding provided.'
                        )}</div>

                    </div>


                    ${locationHtml}

                    ${sourceHtml}

                    ${evidenceHtml}


                    ${
                        hasFullIntelAccess()
                            ? `
                                <div class="triage-panel">

                                    <div class="triage-title">
                                        ASSIGN / REASSIGN INTELLIGENCE
                                    </div>

                                    <div class="triage-description">
                                        Select one or more SCU officers. There is no limit on the number of officers that can be selected.
                                    </div>

        /* ================================================== */
        /* ASSIGN EXISTING SCU INTEL */
        /* ================================================== */

        async function assignIntel(
            intelId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            const selectedCheckboxes =
                Array.from(
                    document.querySelectorAll(
                        `.reassign-checkbox[data-intel-id="${intelId}"]:checked`
                    )
                );


            const recipientIds =
                selectedCheckboxes
                    .map(
                        checkbox =>
                            checkbox.value
                    )
                    .filter(
                        Boolean
                    );


            if (
                !recipientIds.length
            ) {

                alert(
                    'Please select at least one SCU officer.'
                );

                return;

            }


            const uniqueRecipientIds =
                [
                    ...new Set(
                        recipientIds
                    )
                ];


            const selectedNames =
                uniqueRecipientIds
                    .map(
                        recipientId => {

                            const agent =
                                scaAgents.find(
                                    item =>
                                        String(
                                            item.id
                                        ) ===
                                        String(
                                            recipientId
                                        )
                                );

                            return agent
                                ? `${agent.full_name || 'SCU Officer'}${agent.callsign ? ` (${agent.callsign})` : ''}`
                                : 'SCU Officer';

                        }
                    );


            if (
                !confirm(
                    `Send this intelligence to ${uniqueRecipientIds.length} selected officer${uniqueRecipientIds.length === 1 ? '' : 's'}?\n\n${selectedNames.join('\n')}`
                )
            ) {

                return;

            }


            const button =
                document.getElementById(
                    `send-${intelId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            /*
             * Keep the existing intel row wherever possible.
             *
             * If its current recipient is one of the selected
             * officers, that row stays with that recipient.
             *
             * If its current recipient is NOT selected, the
             * existing row is reassigned to the first selected
             * officer.
             *
             * Additional selected officers receive new copies.
             */

            const {
                data: existingIntel,
                error: existingError
            } =
                await supabaseClient
                    .from('intel_submissions')
                    .select('*')
                    .eq(
                        'id',
                        intelId
                    )
                    .single();


            if (
                existingError ||
                !existingIntel
            ) {

                console.error(
                    'Unable to load existing intelligence:',
                    existingError
                );

                alert(
                    `Unable to load this intelligence.\n\n${existingError?.message || existingError || 'Unknown error'}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'REASSIGN INTEL';

                }

                return;

            }


            const existingRecipient =
                existingIntel.recipient_id
                    ? String(
                        existingIntel.recipient_id
                    )
                    : null;


            let keepRecipient =
                existingRecipient &&
                uniqueRecipientIds.includes(
                    existingRecipient
                )
                    ? existingRecipient
                    : uniqueRecipientIds[0];


            const recipientsForCopies =
                uniqueRecipientIds.filter(
                    recipientId =>
                        String(
                            recipientId
                        ) !==
                        String(
                            keepRecipient
                        )
                );


            const {
                error: updateError
            } =
                await supabaseClient
                    .from('intel_submissions')
                    .update({
                        recipient_id:
                            keepRecipient
                    })
                    .eq(
                        'id',
                        intelId
                    );


            if (updateError) {

                console.error(
                    'Intel assignment update error:',
                    updateError
                );

                alert(
                    `Unable to assign intelligence.\n\n${updateError.message || updateError}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'REASSIGN INTEL';

                }

                return;

            }


            if (
                recipientsForCopies.length
            ) {

                const copies =
                    recipientsForCopies.map(
                        recipientId => {

                            const copy =
                                {
                                    ...existingIntel,
                                    id: undefined,
                                    recipient_id:
                                        recipientId
                                };


                            delete copy.id;


                            return copy;

                        }
                    );


                const {
                    error: copyError
                } =
                    await supabaseClient
                        .from(
                            'intel_submissions'
                        )
                        .insert(
                            copies
                        );


                if (copyError) {

                    console.error(
                        'Intel copy creation error:',
                        copyError
                    );

                    alert(
                        `The original intelligence was assigned, but one or more additional copies could not be created.\n\n${copyError.message || copyError}`
                    );


                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            'REASSIGN INTEL';

                    }

                    await loadIntel();

                    return;

                }

            }


            await loadIntel();

        }


        /* ================================================== */
        /* ASSIGN NON-SCU INTEL */
        /* ================================================== */

        async function assignNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to assign intelligence.'
                );

                return;

            }


            if (
                !currentOfficer ||
                !currentOfficer.id
            ) {

                console.error(
                    'NON-SCU conversion stopped: currentOfficer.id is missing.',
                    currentOfficer
                );

                alert(
                    'Unable to identify the sending SCU officer. Please refresh the page and try again.'
                );

                return;

            }


            const report =
                nonScuReports.find(
                    item =>
                        item.id ===
                        reportId
                );


            if (!report) {

                alert(
                    'Unable to find this NON-SCU intelligence report.'
                );

                return;

            }


            const selectedCheckboxes =
                Array.from(
                    document.querySelectorAll(
                        `.reassign-checkbox[data-intel-id="public-${reportId}"]:checked`
                    )
                );


            const recipientIds =
                selectedCheckboxes
                    .map(
                        checkbox =>
                            checkbox.value
                    )
                    .filter(
                        Boolean
                    );


            if (
                !recipientIds.length
            ) {

                alert(
                    'Please select at least one SCU officer.'
                );

                return;

            }


            const uniqueRecipientIds =
                [
                    ...new Set(
                        recipientIds
                    )
                ];


            const selectedNames =
                uniqueRecipientIds
                    .map(
                        recipientId => {

                            const agent =
                                scaAgents.find(
                                    item =>
                                        String(
                                            item.id
                                        ) ===
                                        String(
                                            recipientId
                                        )
                                );

                            return agent
                                ? `${agent.full_name || 'SCU Officer'}${agent.callsign ? ` (${agent.callsign})` : ''}`
                                : 'SCU Officer';

                        }
                    );


            if (
                !confirm(
                    `Send this NON-SCU intelligence to ${uniqueRecipientIds.length} selected officer${uniqueRecipientIds.length === 1 ? '' : 's'}?\n\n${selectedNames.join('\n')}`
                )
            ) {

                return;

            }


            const button =
                document.getElementById(
                    `send-public-${reportId}`
                );


            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    'SENDING...';

            }


            const senderId =
                currentOfficer.id;


            const intelRows =
                uniqueRecipientIds.map(
                    recipientId => {

                        return {
                            sender_id:
                                senderId,

                            recipient_id:
                                recipientId,

                            subject:
                                'NON-SCU MEMBER INTELLIGENCE',

                            intel_type:
                                report.intel_type ||
                                'NON-SCU MEMBER REPORT',

                            finding:
                                report.finding ||
                                '',

                            location:
                                report.location ||
                                null,

                            source:
                                report.source
                                    ? `NON-SCU MEMBER REPORTER: ${report.reporter_name || 'Unknown'} — CALL SIGN: ${report.reporter_callsign || 'None'}\n\n${report.source}`
                                    : `NON-SCU MEMBER REPORTER: ${report.reporter_name || 'Unknown'} — CALL SIGN: ${report.reporter_callsign || 'None'}`

                        };

                    }
                );


            const {
                data: insertedIntel,
                error: insertError
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .insert(
                        intelRows
                    )
                    .select();


            if (
                insertError
            ) {

                console.error(
                    'NON-SCU conversion error:',
                    insertError
                );

                console.error(
                    'NON-SCU sender ID used:',
                    senderId
                );

                console.error(
                    'NON-SCU recipient IDs used:',
                    uniqueRecipientIds
                );


                alert(
                    `Unable to send NON-SCU intelligence.\n\n${insertError.message || insertError}`
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        'SEND INTEL';

                }

                return;

            }


            console.log(
                'NON-SCU INTEL CREATED:',
                insertedIntel
            );


            const {
                error: statusError
            } =
                await supabaseClient
                    .from(
                        'non_scu_intel_submissions'
                    )
                    .update({
                        status:
                            'assigned'
                    })
                    .eq(
                        'id',
                        reportId
                    );


            if (
                statusError
            ) {

                console.error(
                    'NON-SCU status update error:',
                    statusError
                );


                alert(
                    'The intelligence was sent successfully, but the original NON-SCU report could not be marked as assigned. Please refresh the page and check the queue.'
                );


                await loadIntel();

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE EXISTING SCU INTEL */
        /* ================================================== */

        async function deleteIntel(
            intelId
        ) {

            const {
                data: intelRecord,
                error: intelCheckError
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .select(
                        'recipient_id'
                    )
                    .eq(
                        'id',
                        intelId
                    )
                    .single();


            if (
                intelCheckError ||
                !intelRecord
            ) {

                console.error(
                    'Intel permission check error:',
                    intelCheckError
                );

                alert(
                    'Unable to verify this intelligence.'
                );

                return;

            }


            const canDelete =
                hasFullIntelAccess()
                ||
                (
                    intelRecord.recipient_id &&
                    intelRecord.recipient_id ===
                    currentUser.id
                );


            if (!canDelete) {

                alert(
                    'You do not have permission to delete this intelligence.'
                );

                return;

            }


            if (
                !confirm(
                    'Are you sure you want to permanently delete this intelligence?'
                )
            ) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        'intel_submissions'
                    )
                    .delete()
                    .eq(
                        'id',
                        intelId
                    );


            if (error) {

                console.error(
                    'Intel deletion error:',
                    error
                );

                alert(
                    `Unable to delete intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* DELETE NON-SCU INTEL */
        /* ================================================== */

        async function deleteNonScuIntel(
            reportId
        ) {

            if (
                !hasFullIntelAccess()
            ) {

                alert(
                    'You do not have permission to delete NON-SCU intelligence.'
                );

                return;

            }


            const report =
                nonScuReports.find(
                    item =>
                        item.id ===
                        reportId
                );


            if (!report) {

                alert(
                    'Unable to find this NON-SCU intelligence report.'
                );

                return;

            }


            if (
                !confirm(
                    'DELETE BOGUS REPORT?\n\nThis will permanently delete this NON-SCU intelligence report and it cannot be recovered.'
                )
            ) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        'non_scu_intel_submissions'
                    )
                    .delete()
                    .eq(
                        'id',
                        reportId
                    );


            if (error) {

                console.error(
                    'NON-SCU intelligence deletion error:',
                    error
                );

                alert(
                    `Unable to delete NON-SCU intelligence.\n\n${error.message || error}`
                );

                return;

            }


            await loadIntel();

        }


        /* ================================================== */
        /* INITIALISE */
        /* ================================================== */

        async function initialise() {

            const userLoaded =
                await loadCurrentUser();


            if (!userLoaded) {

                return;

            }


            await loadScuAgents();


            if (
                hasFullIntelAccess()
            ) {

                document.getElementById(
                    'page-description'
                ).textContent =
                    'All intelligence submissions across the SCU system. NON-SCU member reports appear here for triage and assignment.';

            }


            await loadIntel();

        }


        initialise();

    </script>

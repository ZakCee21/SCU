<header class="header">

</header>


<main class="container">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentUserRole = null;


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    currentUser =
        session.user;


    // --------------------------------------------------
    // Get logged-in officer's role
    // --------------------------------------------------

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select('role, active')

        .eq(
            'id',
            currentUser.id
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        document
            .getElementById('intelList')
            .innerHTML = `

                <div class="error">

                    Unable to verify officer access.

                </div>

            `;

        return;

    }


    currentUserRole =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    // --------------------------------------------------
    // Change page heading for Masters
    // --------------------------------------------------

    if (
        currentUserRole === 'master'
    ) {

        document
            .getElementById('pageTitle')
            .textContent =
                'All SCU Intelligence';


        document
            .getElementById('pageDescription')
            .textContent =
                'All intelligence submissions across the SCU system.';

    }


    loadIntel();

}


// ======================================================
// LOAD INTELLIGENCE
// ======================================================

async function loadIntel() {

    const intelList =
        document.getElementById(
            'intelList'
        );


    let query =
        supabaseClient

            .from(
                'intel_submissions'
            )

            .select('*');


    // --------------------------------------------------
    // MASTER ACCESS
    // --------------------------------------------------

    if (
        currentUserRole === 'master'
    ) {

        console.log(
            'MASTER ACCESS: Loading ALL intelligence'
        );

    } else {

        console.log(
            'STANDARD ACCESS: Loading received intelligence only'
        );


        query =
            query.eq(
                'recipient_id',
                currentUser.id
            );

    }


    const {
        data,
        error
    } = await query

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            'Load intel error:',
            error
        );


        intelList.innerHTML = `

            <div class="error">

                Unable to load intelligence.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    // --------------------------------------------------
    // Nothing found
    // --------------------------------------------------

    if (
        !data ||
        data.length === 0
    ) {

        intelList.innerHTML = `

            <div class="empty">

                <strong>No intelligence available.</strong>

                <br><br>

                There are currently no intelligence submissions available to you.

            </div>

        `;

        return;

    }


    // --------------------------------------------------
    // Get sender information
    // --------------------------------------------------

    const senderIds =
        [
            ...new Set(
                data.map(
                    intel =>
                        intel.sender_id
                )
            )
        ];


    let senders = [];


    if (
        senderIds.length > 0
    ) {

        const {
            data: senderData,
            error: senderError
        } = await supabaseClient

            .from('officers')

            .select(
                'id, full_name, rank, callsign'
            )

            .in(
                'id',
                senderIds
            );


        if (senderError) {

            console.error(
                'Load sender information error:',
                senderError
            );

        } else {

            senders =
                senderData || [];

        }

    }


    // --------------------------------------------------
    // Get this user's viewed records
    // --------------------------------------------------
    //
    // IMPORTANT:
    //
    // intel_views belongs to the USER.
    //
    // Therefore:
    //
    // Master viewing an Intel only marks it as
    // viewed for that Master.
    //
    // It does NOT mark it viewed for the recipient.
    //
    // --------------------------------------------------

    const intelIds =
        data.map(
            intel =>
                intel.id
        );


    let viewedIds = [];


    if (
        intelIds.length > 0
    ) {

        const {
            data: viewData,
            error: viewError
        } = await supabaseClient

            .from('intel_views')

            .select('intel_id')

            .eq(
                'user_id',
                currentUser.id
            )

            .in(
                'intel_id',
                intelIds
            );


        if (viewError) {

            console.error(
                'Load intel views error:',
                viewError
            );

        } else {

            viewedIds =
                (viewData || [])
                    .map(
                        view =>
                            view.intel_id
                    );

        }

    }


    // --------------------------------------------------
    // Clear loading
    // --------------------------------------------------

    intelList.innerHTML = '';


    // --------------------------------------------------
    // Display intelligence
    // --------------------------------------------------

    data.forEach(
        intel => {

            const sender =
                senders.find(
                    officer =>
                        officer.id ===
                        intel.sender_id
                );


            const senderName =
                sender
                    ? `${sender.rank || ''} ${sender.full_name || ''}${sender.callsign ? ' — ' + sender.callsign : ''}`.trim()
                    : 'Unknown Officer';


            const hasBeenViewed =
                viewedIds.includes(
                    intel.id
                );


            const card =
                document.createElement(
                    'article'
                );


            card.className =
                hasBeenViewed
                    ? 'intel-card read'
                    : 'intel-card unread';


            const createdDate =
                new Date(
                    intel.created_at
                );


            const formattedDate =
                createdDate.toLocaleString(
                    'en-GB',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );


            card.innerHTML = `

                <div class="intel-header">

                    <div>

                        <div class="intel-subject">

                            ${escapeHtml(
                                intel.subject
                            )}

                        </div>


                        <div class="intel-meta">

                            From:
                            ${escapeHtml(
                                senderName
                            )}

                        </div>


                        <div class="status-badge ${
                            hasBeenViewed
                                ? 'status-open'
                                : 'status-new'
                        }">

                            ${
                                hasBeenViewed
                                    ? 'OPEN'
                                    : 'NEW'
                            }

                        </div>

                    </div>


                    <div class="intel-type">

                        ${escapeHtml(
                            intel.intel_type
                        )}

                    </div>

                </div>


                <div class="section">

                    <div class="section-title">

                        Finding / Intelligence

                    </div>


                    <div class="section-content">

                        ${escapeHtml(
                            intel.finding
                        )}

                    </div>

                </div>


                ${
                    intel.location
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Location

                            </div>


                            <div class="section-content">

                                ${escapeHtml(
                                    intel.location
                                )}

                            </div>

                        </div>

                    `
                    : ''
                }


                ${
                    intel.source
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Source / Context

                            </div>


                            <div class="section-content">

                                ${escapeHtml(
                                    intel.source
                                )}

                            </div>

                        </div>

                    `
                    : ''
                }


                ${
                    intel.evidence_link
                    ? `

                        <div class="section">

                            <div class="section-title">

                                Evidence / Document

                            </div>


                            <div class="section-content">

                                <a
                                    class="evidence-link"
                                    href="${escapeAttribute(
                                        intel.evidence_link
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Open supporting evidence
                                </a>

                            </div>

                        </div>

                    `
                    : ''
                }


                <div class="intel-footer">

                    <div class="date">

                        Received:
                        ${formattedDate}

                    </div>


                    <button
                        class="delete-button"
                        onclick="deleteIntel('${intel.id}')"
                    >
                        DELETE INTEL
                    </button>

                </div>

            `;


            intelList.appendChild(
                card
            );


            // --------------------------------------------------
            // Automatically mark as viewed
            // --------------------------------------------------
            //
            // We do this AFTER displaying the card.
            //
            // This means opening the Intel page counts it
            // as viewed.
            //
            // The view is stored against the logged-in user's
            // ID, not the recipient ID.
            //
            // --------------------------------------------------

            if (
                !hasBeenViewed
            ) {

                markIntelAsViewed(
                    intel.id
                );

            }

        }
    );

}


// ======================================================
// MARK INTEL AS VIEWED
// ======================================================

async function markIntelAsViewed(
    intelId
) {

    if (
        !currentUser
    ) {

        return;

    }


    const {
        error
    } = await supabaseClient

        .from('intel_views')

        .upsert(
            {
                intel_id:
                    intelId,

                user_id:
                    currentUser.id

            },
            {
                onConflict:
                    'intel_id,user_id'
            }
        );


    if (error) {

        console.error(
            'Mark intel as viewed error:',
            error
        );

    }

}


// ======================================================
// DELETE INTELLIGENCE
// ======================================================

async function deleteIntel(
    intelId
) {

    const confirmed =
        confirm(
            'Are you sure you want to delete this intelligence submission?\n\nOnly delete it once the information has been copied into a case or is no longer required.'
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } = await supabaseClient

        .from(
            'intel_submissions'
        )

        .delete()

        .eq(
            'id',
            intelId
        );


    if (error) {

        console.error(
            'Delete intel error:',
            error
        );


        alert(
            'Unable to delete intelligence.\n\n' +
            error.message
        );

        return;

    }


    loadIntel();

}


// ======================================================
// HTML SECURITY
// ======================================================

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


// ======================================================
// START
// ======================================================

checkLogin();


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Officer Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
        }

        header {
            background: #111820;
            border-bottom: 1px solid #26313c;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .master {
            color: #7dd3fc;
            font-size: 13px;
            margin-right: 15px;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0;
        }

        button {
            background: #1d4ed8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .logout {
            background: #374151;
        }

        .logout:hover {
            background: #4b5563;
        }

        .panel {
            background: #111820;
            border: 1px solid #26313c;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #26313c;
        }

        th {
            background: #151d26;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            background: #0b0f14;
            color: white;
            border: 1px solid #374151;
            border-radius: 4px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        .save {
            background: #15803d;
        }

        .save:hover {
            background: #16a34a;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
        }

        .warning {
            margin-bottom: 20px;
            padding: 14px;
            background: #151d26;
            border: 1px solid #26313c;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>

    <h1>SCU // OFFICER MANAGEMENT</h1>

    <div>
        <span class="master">MASTER ACCESS</span>

        <button class="logout" onclick="logout()">
            LOGOUT
        </button>
    </div>

</header>

<main>

    <div class="top-bar">

        <h2>Authorised Officers</h2>

    </div>

    <div class="warning">
        Changes made here are saved directly to the SCU database.
        System roles control website permissions.
    </div>

    <div class="panel">

        <table>

            <thead>

                <tr>
                    <th>Callsign</th>
                    <th>In-Game Name</th>
                    <th>Rank</th>
                    <th>System Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="officerList">

                <tr>
                    <td colspan="6" class="empty">
                        Loading officers...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

const SUPABASE_URL = 'https://mtlozyseibrefhxnocvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function checkMaster() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.href = 'index.html';

        return;
    }


    const {
        data: officer,
        error
    } = await supabaseClient
        .from('officers')
        .select('*')
        .eq('id', session.user.id)
        .single();


    if (
        error ||
        !officer ||
        officer.role !== 'master'
    ) {

        alert('ACCESS DENIED');

        window.location.href = 'dashboard.html';

        return;
    }


    loadOfficers();

}


async function loadOfficers() {

    const {
        data,
        error
    } = await supabaseClient
        .from('officers')
        .select('*')
        .order('callsign');


    const list =
        document.getElementById('officerList');


    if (error) {

        console.error(error);

        list.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Unable to load officers.
                </td>
            </tr>
        `;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No officers found.
                </td>
            </tr>
        `;

        return;
    }


    list.innerHTML = data.map(officer => `

        <tr>

            <td>

                <input
                    id="callsign-${officer.id}"
                    value="${escapeHtml(officer.callsign || '')}"
                >

            </td>


            <td>

                <input
                    id="name-${officer.id}"
                    value="${escapeHtml(officer.full_name || '')}"
                >

            </td>


            <td>

                <input
                    id="rank-${officer.id}"
                    value="${escapeHtml(officer.rank || '')}"
                    placeholder="e.g. Detective"
                >

            </td>


            <td>

                <select id="role-${officer.id}">

                    <option value="officer"
                        ${officer.role === 'officer' ? 'selected' : ''}>
                        Officer
                    </option>

                    <option value="investigator"
                        ${officer.role === 'investigator' ? 'selected' : ''}>
                        Investigator
                    </option>

                    <option value="lead"
                        ${officer.role === 'lead' ? 'selected' : ''}>
                        Case Lead
                    </option>

                    <option value="master"
                        ${officer.role === 'master' ? 'selected' : ''}>
                        Master
                    </option>

                </select>

            </td>


          <td class="status">
    ${officer.active ? 'ACTIVE' : 'INACTIVE'}
</td>

            <td>

<td>

    <button
        class="save"
        onclick="saveOfficer('${officer.id}')"
    >
        SAVE
    </button>

    <br>

    <button
        onclick="toggleOfficerStatus('${officer.id}', ${officer.active})"
        style="
            margin-top:8px;
            background:${officer.active ? '#991b1b' : '#15803d'};
        "
    >
        ${officer.active ? 'DEACTIVATE' : 'REACTIVATE'}
    </button>

</td>
        </tr>

    `).join('');

}


async function saveOfficer(id) {

    const callsign =
        document.getElementById(`callsign-${id}`).value.trim();

    const fullName =
        document.getElementById(`name-${id}`).value.trim();

    const rank =
        document.getElementById(`rank-${id}`).value.trim();

    const role =
        document.getElementById(`role-${id}`).value;


    if (!callsign || !fullName || !rank) {

        alert('Please complete Callsign, Name and Rank.');

        return;
    }


    /*
     * Prevent the currently logged-in Master
     * from accidentally removing their own Master role.
     */

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (id === session.user.id && role !== 'master') {

        alert('You cannot remove your own Master role.');

        return;
    }


    const {
        error
    } = await supabaseClient
        .from('officers')
        .update({
            callsign: callsign,
            full_name: fullName,
            rank: rank,
            role: role
        })
        .eq('id', id);


    if (error) {

        console.error(error);

        alert(
            'SAVE FAILED: ' +
            error.message
        );

        return;
    }


    alert('OFFICER UPDATED SUCCESSFULLY');

}
async function toggleOfficerStatus(id, currentlyActive) {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        alert('You are not logged in.');
        return;
    }

    // Prevent a Master from deactivating themselves
    if (id === session.user.id && currentlyActive) {
        alert('You cannot deactivate your own account.');
        return;
    }

    const newStatus = !currentlyActive;

    const action = newStatus
        ? 'reactivate'
        : 'deactivate';

    const confirmed = confirm(
        `Are you sure you want to ${action} this officer?`
    );

    if (!confirmed) {
        return;
    }

    const {
        error
    } = await supabaseClient
        .from('officers')
        .update({
            active: newStatus
        })
        .eq('id', id);

    if (error) {

        console.error(error);

        alert(
            'STATUS UPDATE FAILED: ' +
            error.message
        );

        return;
    }

    alert(
        newStatus
            ? 'OFFICER REACTIVATED SUCCESSFULLY'
            : 'OFFICER DEACTIVATED SUCCESSFULLY'
    );

    loadOfficers();
}

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = 'index.html';

}


checkMaster();

</script>

</body>
</html>

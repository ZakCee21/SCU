
<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Officer Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
        }

        header {
            background: #111820;
            border-bottom: 1px solid #26313c;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .master {
            color: #7dd3fc;
            font-size: 13px;
            margin-right: 15px;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0;
        }

        button {
            background: #1d4ed8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .logout {
            background: #374151;
        }

        .logout:hover {
            background: #4b5563;
        }

        .panel {
            background: #111820;
            border: 1px solid #26313c;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #26313c;
        }

        th {
            background: #151d26;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            background: #0b0f14;
            color: white;
            border: 1px solid #374151;
            border-radius: 4px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        .save {
            background: #15803d;
        }

        .save:hover {
            background: #16a34a;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
        }

        .warning {
            margin-bottom: 20px;
            padding: 14px;
            background: #151d26;
            border: 1px solid #26313c;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 13px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        SCU // OFFICER MANAGEMENT
    </h1>


    <div>

        <span class="master">
            SCU COMMAND ACCESS
        </span>


        <button
            class="logout"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>

</header>


<main>


    <div class="top-bar">

        <h2>
            Authorised Officers
        </h2>

    </div>


    <div class="warning">

        Changes made here are saved directly to the SCU database.
        System roles control website permissions.

    </div>


    <div class="panel">

        <table>

            <thead>

                <tr>

                    <th>Callsign</th>

                    <th>In-Game Name</th>

                    <th>Rank</th>

                    <th>System Role</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="officerList">

                <tr>

                    <td
                        colspan="6"
                        class="empty"
                    >
                        Loading officers...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</main>


<script>


const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// BACKEND ROLE VALUES
// ======================================================
//
// IMPORTANT:
// These are the existing database values.
// DO NOT rename them.
//
// master      = SCU command
// Officer     = Detective
// investigator = Head of Drugs
// Case Lead   = Head of Weapons
//
// ======================================================


const ROLE_MASTER =
    'master';


const ROLE_DETECTIVE =
    'Officer';


const ROLE_HEAD_DRUGS =
    'investigator';


const ROLE_HEAD_WEAPONS =
    'Case Lead';


// ======================================================
// MASTER CHECK
// ======================================================

function isMasterRole(role) {

    return String(
        role || ''
    )
    .trim()
    .toLowerCase() ===
        ROLE_MASTER;

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

    return String(value ?? '')

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


// ======================================================
// ESCAPE JAVASCRIPT
// ======================================================

function escapeJs(value) {

    return String(value ?? '')

        .replace(
            /\\/g,
            '\\\\'
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            '\\r'
        )

        .replace(
            /\n/g,
            '\\n'
        );

}


// ======================================================
// DEFAULT DISPLAY TITLE
// ======================================================

function getDefaultPortalTitle(role) {

    const normalRole =
        String(
            role || ''
        )
        .trim()
        .toLowerCase();


    switch (normalRole) {

        case 'master':
            return 'High Command';


        case 'officer':
            return 'Detective';


        case 'investigator':
            return 'Head of Drugs';


        case 'case lead':
            return 'Head of Weapons';


        default:
            return '';

    }

}


// ======================================================
// CHECK COMMAND ACCESS
// ======================================================

async function checkCommandAccess() {

    const {
        data: {
            session
        },
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !session
    ) {

        window.location.href =
            'index.html';

        return;

    }


    const {
        data: officer,
        error
    } =
        await supabaseClient

            .from('officers')

            .select('role')

            .eq(
                'id',
                session.user.id
            )

            .single();


    if (
        error ||
        !officer ||
        !isMasterRole(
            officer.role
        )
    ) {

        alert(
            'ACCESS DENIED'
        );

        window.location.href =
            'dashboard.html';

        return;

    }


    loadOfficers();

}


// ======================================================
// LOAD OFFICERS
// ======================================================

async function loadOfficers() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from('officers')

            .select('*')

            .order(
                'callsign'
            );


    const list =
        document.getElementById(
            'officerList'
        );


    if (error) {

        console.error(
            error
        );


        list.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Unable to load officers.
                </td>

            </tr>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No officers found.
                </td>

            </tr>

        `;

        return;

    }


    list.innerHTML =
        data.map(
            officer => {

                const id =
                    escapeJs(
                        officer.id
                    );


                const safeId =
                    escapeHtml(
                        officer.id
                    );


                const callsign =
                    escapeHtml(
                        officer.callsign || ''
                    );


                const fullName =
                    escapeHtml(
                        officer.full_name || ''
                    );


                const rank =
                    escapeHtml(
                        officer.rank || ''
                    );


                const active =
                    Boolean(
                        officer.active
                    );


                const backendRole =
                    String(
                        officer.role || ''
                    ).trim();


                const normalRole =
                    backendRole.toLowerCase();


                const portalTitle =
                    officer.portal_title ||
                    getDefaultPortalTitle(
                        backendRole
                    );


                let roleOptions = '';


                // ==================================================
                // MASTER ACCOUNT
                // ==================================================

                if (
                    normalRole === 'master'
                ) {

                    roleOptions = `

                        <option
                            value="master|Head of SCU"
                            ${
                                portalTitle === 'Head of SCU'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            Head of SCU
                        </option>


                        <option
                            value="master|Assistant Head of SCU"
                            ${
                                portalTitle === 'Assistant Head of SCU'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            Assistant Head of SCU
                        </option>


                        <option
                            value="master|GOV"
                            ${
                                portalTitle === 'GOV'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            GOV
                        </option>


                        <option
                            value="master|High Command"
                            ${
                                portalTitle === 'High Command'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            High Command
                        </option>


                        <option
                            value="Officer|Detective"
                        >
                            Detective
                        </option>


                        <option
                            value="investigator|Head of Drugs"
                        >
                            Head of Drugs
                        </option>


                        <option
                            value="Case Lead|Head of Weapons"
                        >
                            Head of Weapons
                        </option>

                    `;

                }


                // ==================================================
                // NON-MASTER ACCOUNT
                // ==================================================

                else {

                    roleOptions = `

                        <option
                            value="Officer|Detective"
                            ${
                                normalRole === 'officer'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            Detective
                        </option>


                        <option
                            value="investigator|Head of Drugs"
                            ${
                                normalRole === 'investigator'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            Head of Drugs
                        </option>


                        <option
                            value="Case Lead|Head of Weapons"
                            ${
                                normalRole === 'case lead'
                                    ? 'selected'
                                    : ''
                            }
                        >
                            Head of Weapons
                        </option>


                        <option
                            value="master|Head of SCU"
                        >
                            Head of SCU
                        </option>


                        <option
                            value="master|Assistant Head of SCU"
                        >
                            Assistant Head of SCU
                        </option>


                        <option
                            value="master|GOV"
                        >
                            GOV
                        </option>


                        <option
                            value="master|High Command"
                        >
                            High Command
                        </option>

                    `;

                }


                return `

                    <tr>


                        <td>

                            <input
                                id="callsign-${safeId}"
                                value="${callsign}"
                            >

                        </td>


                        <td>

                            <input
                                id="name-${safeId}"
                                value="${fullName}"
                            >

                        </td>


                        <td>

                            <input
                                id="rank-${safeId}"
                                value="${rank}"
                                placeholder="e.g. Detective"
                            >

                        </td>


                        <td>

                            <select
                                id="role-${safeId}"
                            >

                                ${roleOptions}

                            </select>

                        </td>


                        <td class="status">

                            ${
                                active
                                    ? 'ACTIVE'
                                    : 'INACTIVE'
                            }

                        </td>


                        <td>

                            <button
                                class="save"
                                onclick="saveOfficer('${id}')"
                            >
                                SAVE
                            </button>


                            <br>


                            <button
                                onclick="toggleOfficerStatus(
                                    '${id}',
                                    ${active}
                                )"
                                style="
                                    margin-top:8px;
                                    background:${
                                        active
                                            ? '#991b1b'
                                            : '#15803d'
                                    };
                                "
                            >

                                ${
                                    active
                                        ? 'DEACTIVATE'
                                        : 'REACTIVATE'
                                }

                            </button>

                        </td>

                    </tr>

                `;

            }
        )
        .join('');

}


// ======================================================
// SAVE OFFICER
// ======================================================

async function saveOfficer(id) {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        alert(
            'You are not logged in.'
        );

        return;

    }


    const callsign =
        document
            .getElementById(
                `callsign-${id}`
            )
            .value
            .trim();


    const fullName =
        document
            .getElementById(
                `name-${id}`
            )
            .value
            .trim();


    const rank =
        document
            .getElementById(
                `rank-${id}`
            )
            .value
            .trim();


    const roleSelection =
        document
            .getElementById(
                `role-${id}`
            )
            .value;


    const separatorIndex =
        roleSelection.indexOf('|');


    if (
        separatorIndex === -1
    ) {

        alert(
            'Invalid system role.'
        );

        return;

    }


    const role =
        roleSelection.substring(
            0,
            separatorIndex
        );


    const portalTitle =
        roleSelection.substring(
            separatorIndex + 1
        );


    if (
        !callsign ||
        !fullName ||
        !rank
    ) {

        alert(
            'Please complete Callsign, Name and Rank.'
        );

        return;

    }


    // ==================================================
    // ONLY EXISTING BACKEND ROLES
    // ==================================================

    const allowedRoles = [

        'master',

        'Officer',

        'investigator',

        'Case Lead'

    ];


    if (
        !allowedRoles.includes(
            role
        )
    ) {

        alert(
            'Invalid system role.'
        );

        return;

    }


    // ==================================================
    // PREVENT SELF-REMOVAL OF MASTER ACCESS
    // ==================================================

    if (
        id === session.user.id &&
        !isMasterRole(role)
    ) {

        alert(
            'You cannot remove your own SCU Command access.'
        );

        return;

    }


    // ==================================================
    // VERIFY CURRENT MASTER
    // ==================================================

    const {
        data: currentUser,
        error: currentUserError
    } =
        await supabaseClient

            .from('officers')

            .select('role')

            .eq(
                'id',
                session.user.id
            )

            .single();


    if (
        currentUserError ||
        !currentUser ||
        !isMasterRole(
            currentUser.role
        )
    ) {

        alert(
            'Unable to verify your permissions.'
        );

        return;

    }


    // ==================================================
    // PREVENT SELF DOWNGRADE
    // ==================================================

    if (
        id === session.user.id &&
        isMasterRole(
            currentUser.role
        ) &&
        !isMasterRole(role)
    ) {

        alert(
            'You cannot downgrade your own SCU Command access.'
        );

        return;

    }


    // ==================================================
    // SAVE
    // ==================================================

    const {
        error
    } =
        await supabaseClient

            .from('officers')

            .update({

                callsign:
                    callsign,

                full_name:
                    fullName,

                rank:
                    rank,

                role:
                    role,

                portal_title:
                    portalTitle

            })

            .eq(
                'id',
                id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            'SAVE FAILED: ' +
            error.message
        );

        return;

    }


    alert(
        'OFFICER UPDATED SUCCESSFULLY'
    );


    loadOfficers();

}


// ======================================================
// ACTIVATE / DEACTIVATE
// ======================================================

async function toggleOfficerStatus(
    id,
    currentlyActive
) {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        alert(
            'You are not logged in.'
        );

        return;

    }


    if (
        id === session.user.id &&
        currentlyActive
    ) {

        alert(
            'You cannot deactivate your own account.'
        );

        return;

    }


    const newStatus =
        !currentlyActive;


    const action =
        newStatus
            ? 'reactivate'
            : 'deactivate';


    const confirmed =
        confirm(
            `Are you sure you want to ${action} this officer?`
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
        await supabaseClient

            .from('officers')

            .update({

                active:
                    newStatus

            })

            .eq(
                'id',
                id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            'STATUS UPDATE FAILED: ' +
            error.message
        );

        return;

    }


    alert(
        newStatus
            ? 'OFFICER REACTIVATED SUCCESSFULLY'
            : 'OFFICER DEACTIVATED SUCCESSFULLY'
    );


    loadOfficers();

}


// ======================================================
// LOGOUT
// ======================================================

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        'index.html';

}


// ======================================================
// START
// ======================================================

checkCommandAccess();


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Officer Registration</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .panel {
            background: #111820;
            border: 1px solid #26313c;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 25px;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            margin: 8px 0 30px;
            color: #7dd3fc;
            font-size: 13px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0b0f14;
            color: white;
            border: 1px solid #374151;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #1d4ed8;
            color: white;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background: #2563eb;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #151d26;
            border: 1px solid #26313c;
            border-radius: 5px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="panel">

        <h1>SCU</h1>

        <div class="subtitle">
            OFFICER REGISTRATION
        </div>

        <form id="signupForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Officer email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >

            <label for="fullName">
                In-Game Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="e.g. John Smith"
                required
            >

            <label for="callsign">
                Callsign
            </label>

            <input
                type="text"
                id="callsign"
                placeholder="e.g. SCU-02"
                required
            >

            <button type="submit">
                CREATE OFFICER ACCOUNT
            </button>

        </form>

        <div class="notice">
            New accounts are automatically registered as
            <strong>OFFICER</strong>.
            System permissions can only be changed by SCU Master personnel.
        </div>

        <a href="index.html" class="back">
            ← Return to Login
        </a>

    </div>

</div>

<script>

    const SUPABASE_URL = 'https://mtlozyseibrefhxnocvb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const signupForm =
        document.getElementById('signupForm');


    signupForm.addEventListener('submit', async function(event) {

        event.preventDefault();


        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        const fullName =
            document.getElementById('fullName').value.trim();

        const callsign =
            document.getElementById('callsign').value.trim();


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {
                    data: {
                        full_name: fullName,
                        callsign: callsign
                    }
                }

            });


        if (error) {

            alert('REGISTRATION FAILED: ' + error.message);

            return;
        }


        /*
         * The Auth account has been created.
         *
         * The officer record will be created
         * automatically once we add the secure
         * database trigger in the next step.
         */


        alert(
            'ACCOUNT CREATED!\n\n' +
            'Your account has been registered as an Officer.'
        );


        window.location.href = 'index.html';

    });

</script>

</body>
</html>

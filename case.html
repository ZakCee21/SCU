<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Case Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e8edf2;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;
            background: #0d131a;
            border-bottom: 1px solid #25313c;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            z-index: 2;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 11px;
            color: #6f7c88;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .header-right {
            margin-left: auto;
        }

        /* =========================
           BACKGROUND LOGOS
        ========================= */

        .background-logo {
            position: fixed;
            top: 50%;
            width: 220px;
            height: 220px;
            object-fit: contain;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .background-logo-left {
            left: 20px;
            transform: translateY(-50%);
        }

        .background-logo-right {
            right: 20px;
            transform: translateY(-50%);
        }

        .page {
            position: relative;
            z-index: 1;
        }

        /* =========================
           BUTTONS
        ========================= */

        .back-button {
            background: #17202a;
            border: 1px solid #354554;
            color: #dce3e8;
            padding: 9px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .back-button:hover {
            background: #202c38;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px 40px;
        }

        /* =========================
           CASE HEADER
        ========================= */

        .case-header {
            background: #0d131a;
            border: 1px solid #25313c;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .case-number {
            color: #6f7c88;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .case-title {
            font-size: 24px;
            font-weight: bold;
        }

        .case-status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-active {
            background: #12351f;
            color: #4ade80;
            border: 1px solid #216b3d;
        }

        .status-closed {
            background: #3a1717;
            color: #ff6666;
            border: 1px solid #713030;
        }

        .closed-notice {
            background: #3a1717;
            border: 1px solid #713030;
            color: #ff6666;
            padding: 12px 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        /* =========================
           SECTIONS
        ========================= */

        .section {
            background: #0d131a;
            border: 1px solid #25313c;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .section-header {
            padding: 14px 18px;
            background: #111821;
            border-bottom: 1px solid #25313c;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: .5px;
        }

        .section-body {
            padding: 20px;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;
            color: #8d9aa6;
            font-size: 11px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #080c11;
            border: 1px solid #354554;
            color: #e8edf2;
            border-radius: 4px;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #4b6478;
        }

        .field {
            margin-bottom: 18px;
        }

        /* =========================
           BUTTON ROW
        ========================= */

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .save-button {
            background: #1d4ed8;
            color: white;
        }

        .save-button:hover {
            background: #2563eb;
        }

        .close-case-button {
            background: #9f1239;
            color: white;
        }

        .close-case-button:hover {
            background: #be123c;
        }

        .delete-button {
            background: #7f1d1d;
            color: white;
        }

        .delete-button:hover {
            background: #991b1b;
        }

        .upload-button {
            background: #1d4ed8;
            color: white;
        }

        .upload-button:hover {
            background: #2563eb;
        }

        .link-button {
            background: #374151;
            color: white;
        }

        .link-button:hover {
            background: #4b5563;
        }

        /* =========================
           OFFICER ACCESS
        ========================= */

        .agent-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 20px;
            background: #080c11;
            border: 1px solid #354554;
            border-radius: 5px;
            overflow: hidden;
        }

        .agent-column {
            min-width: 0;
        }

        .agent-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            margin: 0;
            border-bottom: 1px solid #202b36;
            cursor: pointer;
            color: #e8edf2;
            font-size: 13px;
            font-weight: normal;
        }

        .agent-option:hover {
            background: #111a23;
        }

        .agent-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
            accent-color: #1d4ed8;
            cursor: pointer;
        }

        .agent-name {
            flex: 1;
            min-width: 0;
        }

        .agent-rank {
            color: #6f7c88;
            font-size: 11px;
            margin-left: 5px;
        }

        .agent-loading {
            grid-column: 1 / -1;
            padding: 12px;
            color: #6f7c88;
            font-size: 12px;
        }

        /* =========================
           EVIDENCE
        ========================= */

        .evidence-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
        }

        .evidence-item {
            background: #080c11;
            border: 1px solid #25313c;
            border-radius: 4px;
            padding: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .evidence-info {
            flex: 1;
            min-width: 0;
        }

        .evidence-name {
            font-size: 13px;
            color: #e8edf2;
            font-weight: bold;
            word-break: break-word;
        }

        .evidence-description {
            font-size: 11px;
            color: #9aa6b2;
            margin-top: 6px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .evidence-type {
            font-size: 10px;
            color: #6f7c88;
            margin-top: 6px;
        }

        .evidence-open {
            background: #17202a;
            border: 1px solid #354554;
            color: #dce3e8;
            padding: 7px 10px;
            font-size: 10px;
            flex-shrink: 0;
        }

        .evidence-open:hover {
            background: #202c38;
        }

        .evidence-delete {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: white;
            padding: 7px 10px;
            font-size: 10px;
            flex-shrink: 0;
        }

        .evidence-delete:hover {
            background: #991b1b;
        }

        .evidence-delete:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           GENERAL
        ========================= */

        .empty {
            color: #6f7c88;
            font-size: 12px;
            padding: 10px 0;
        }

        .loading {
            color: #6f7c88;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .agent-list {
                grid-template-columns: 1fr;
            }

            .agent-loading {
                grid-column: 1;
            }

            header {
                padding: 0 15px;
            }

            .page {
                padding: 0 12px 30px;
            }

            .header-logo {
                width: 42px;
                height: 42px;
            }

            .header-brand {
                gap: 10px;
            }

            .header-title {
                font-size: 16px;
            }

            .header-subtitle {
                font-size: 9px;
            }

            .background-logo {
                width: 130px;
                height: 130px;
                opacity: 0.25;
            }

            .background-logo-left {
                left: -45px;
            }

            .background-logo-right {
                right: -45px;
            }

            .evidence-item {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>


<!-- =========================

========================= -->

<img

>


<!-- =========================

========================= -->

<img

    alt=""
>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-brand">

        <img
            class="header-logo"
            src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
            alt="SCU Logo"
        >

        <div class="header-left">

</header>


<!-- =========================

========================= -->

<div class="page">

    <div
        id="loadingMessage"
        class="loading"
    >
        Loading case...
    </div>


    <div
        id="caseContent"
        style="display:none;"
    >


        <!-- =========================
             CASE HEADER
        ========================= -->

        <div class="case-header">

            <div
                id="caseNumber"
                class="case-number"
            ></div>

            <div
                id="caseTitle"

            ></div>

            <div
                id="caseStatus"

            ></div>

            <div
                id="closedNotice"
                class="closed-notice"
                style="display:none;"
            >
                THIS CASE IS CLOSED
            </div>

        </div>


        <!-- =========================

        <div class="section">

            <div class="section-header">

            <div class="section-body">

                    <input

                </div>

                <div class="field">

                    </label>

                    <textarea

                <div class="field">

                    <input

                <div class="button-row">

                    <button

                        ADD EXTERNAL LINK

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentOfficer = null;
let caseData = null;
let canManageAccess = false;
let canDeleteEvidence = false;


const closeCaseRoles = [
    'master',
    'investigator',
    'case_lead'
];


const params =
    new URLSearchParams(
        window.location.search
    );


const caseId =
    params.get('id');


/* =========================
   INITIALISE
========================= */

async function initialise() {

    if (!caseId) {

        alert('No case selected.');

        window.location.href =
            'dashboard.html';

        return;

    }


    const {
        data: {
            user
        },
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (userError || !user) {

        window.location.href =
            'index.html';

        return;

    }


    currentUser = user;


    const {
        data: officer,
        error: officerError
    } =
        await supabaseClient
            .from('officers')
            .select(
                'id, full_name, rank, role, active'
            )
            .eq(
                'id',
                user.id
            )
            .single();


    if (officerError || !officer) {

        alert(
            'Unable to load your officer profile.'
        );

        return;

    }


    currentOfficer = officer;


    await loadCase();

}


/* =========================
   LOAD CASE
========================= */

async function loadCase() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from('cases')
            .select(
                'id, case_name, case_number, status, classification, description, created_at, created_by'
            )
            .eq(
                'id',
                caseId
            )
            .single();


    if (error || !data) {

        console.error(error);

        alert(
            'Unable to load case.'
        );

        return;

    }


    caseData = data;


    document.getElementById(
        'caseNumber'
    ).textContent =
        data.case_number || 'CASE';


    document.getElementById(
        'caseTitle'
    ).textContent =
        data.case_name || 'Untitled Case';


    document.getElementById(
        'caseName'
    ).value =
        data.case_name || '';


    document.getElementById(
        'classification'
    ).value =
        data.classification || 'Restricted';


    document.getElementById(
        'caseDescription'
    ).value =
        data.description || '';


    updateStatusDisplay(
        data.status
    );


    setupPermissions(
        data
    );


    await loadOfficerAccess();

    await loadEvidence();


    document.getElementById(
        'loadingMessage'
    ).style.display =
        'none';


    document.getElementById(
        'caseContent'
    ).style.display =
        'block';

}


/* =========================
   STATUS
========================= */

function updateStatusDisplay(status) {

    const element =
        document.getElementById(
            'caseStatus'
        );


    const notice =
        document.getElementById(
            'closedNotice'
        );


    if (
        String(status || '').toLowerCase()
        === 'closed'
    ) {

        element.textContent =
            'CLOSED';

        element.className =
            'case-status status-closed';

        notice.style.display =
            'block';

    } else {

        element.textContent =
            'ACTIVE';

        element.className =
            'case-status status-active';

        notice.style.display =
            'none';

    }

}


/* =========================
   PERMISSIONS
========================= */

function setupPermissions(data) {

    const saveCase =
        document.getElementById(
            'saveCase'
        );


    const closeCase =
        document.getElementById(
            'closeCase'
        );


    const deleteCase =
        document.getElementById(
            'deleteCase'
        );


    const canEditCase =
        currentOfficer &&
        (
            String(currentOfficer.id)
            === String(data.created_by)
            ||
            [
                'master',
                'officer',
                'investigator',
                'case_lead'
            ].includes(
                currentOfficer.role
            )
        );


    saveCase.style.display =
        canEditCase
            ? 'inline-block'
            : 'none';


    const canCloseCase =
        currentOfficer &&
        closeCaseRoles.includes(
            currentOfficer.role
        );


    closeCase.style.display =
        canCloseCase &&
        String(data.status).toLowerCase()
            !== 'closed'
            ? 'inline-block'
            : 'none';


    const canDeleteCase =
        currentOfficer &&
        closeCaseRoles.includes(
            currentOfficer.role
        );


    deleteCase.style.display =
        canDeleteCase
            ? 'inline-block'
            : 'none';

}


/* =========================
   ACCESS PERMISSION
========================= */

function updateAccessPermission(
    accessRows
) {

    const saveAccess =
        document.getElementById(
            'saveAccess'
        );


    const isCaseCreator =
        currentOfficer &&
        caseData &&
        String(currentOfficer.id)
        === String(caseData.created_by);


    const isSenior =
        currentOfficer &&
        [
            'master',
            'investigator',
            'case_lead'
        ].includes(
            currentOfficer.role
        );


    const isInvolvedOfficer =
        currentOfficer &&
        (accessRows || []).some(
            row =>
                String(row.officer_id)
                === String(currentOfficer.id)
        );


    canDeleteEvidence =
        Boolean(
            isInvolvedOfficer
        );


    canManageAccess =
        Boolean(
            isCaseCreator ||
            isSenior ||
            isInvolvedOfficer
        );


    saveAccess.style.display =
        canManageAccess
            ? 'inline-block'
            : 'none';

}


/* =========================
   LOAD OFFICER ACCESS
========================= */

async function loadOfficerAccess() {

    const list =
        document.getElementById(
            'caseOfficerList'
        );


    list.innerHTML = '';


    const {
        data: officers,
        error: officerError
    } =
        await supabaseClient
            .from('officers')
            .select(
                'id, full_name, rank, callsign, active'
            )
            .eq(
                'is_scu_agent',
                true
            )
            .eq(
                'active',
                true
            );


    if (officerError) {

        console.error(
            officerError
        );

        list.innerHTML = `
            <div class="agent-loading">
                Failed to load officers.
            </div>
        `;

        return;

    }


    const {
        data: accessRows,
        error: accessError
    } =
        await supabaseClient
            .from('case_access')
            .select(
                'officer_id, permission'
            )
            .eq(
                'case_id',
                caseId
            );


    if (accessError) {

        console.error(
            accessError
        );

        list.innerHTML = `
            <div class="agent-loading">
                Failed to load case access.
            </div>
        `;

        canDeleteEvidence = false;

        return;

    }


    updateAccessPermission(
        accessRows || []
    );


    const selectedOfficerIds =
        new Set(
            (accessRows || []).map(
                row =>
                    String(row.officer_id)
            )
        );


    const rankOrder = {

        'Head of SCU': 1,
        'Assistant Head of SCU': 2,
        'Head of Weapons': 3,
        'Head of Drugs': 4,
        'Detective': 5

    };


    const filteredOfficers =
        (officers || [])
            .filter(
                officer => {

                    const rank =
                        (officer.rank || '')
                            .trim();

                    return Object.prototype
                        .hasOwnProperty.call(
                            rankOrder,
                            rank
                        );

                }
            )
            .sort(
                (a, b) => {

                    const rankA =
                        (a.rank || '')
                            .trim();

                    const rankB =
                        (b.rank || '')
                            .trim();


                    const difference =
                        rankOrder[rankA]
                        -
                        rankOrder[rankB];


                    if (difference !== 0) {
                        return difference;
                    }


                    const nameA =
                        (a.full_name || '')
                            .trim()
                            .toLowerCase();


                    const nameB =
                        (b.full_name || '')
                            .trim()
                            .toLowerCase();


                    return nameA.localeCompare(
                        nameB
                    );

                }
            );


    const officersPerColumn = 8;


    const numberOfColumns =
        Math.ceil(
            filteredOfficers.length
            /
            officersPerColumn
        );


    const columns = [];


    for (
        let i = 0;
        i < numberOfColumns;
        i++
    ) {

        const column =
            document.createElement(
                'div'
            );


        column.className =
            'agent-column';


        columns.push(
            column
        );


        list.appendChild(
            column
        );

    }


    filteredOfficers.forEach(
        (officer, index) => {

            const columnIndex =
                Math.floor(
                    index
                    /
                    officersPerColumn
                );


            const label =
                document.createElement(
                    'label'
                );


            label.className =
                'agent-option';


            const checkbox =
                document.createElement(
                    'input'
                );


            checkbox.type =
                'checkbox';


            checkbox.value =
                officer.id;


            checkbox.checked =
                selectedOfficerIds.has(
                    String(officer.id)
                );


            checkbox.disabled =
                !canManageAccess;


            const name =
                document.createElement(
                    'span'
                );


            name.className =
                'agent-name';


            const displayName =
                officer.full_name
                ||
                officer.callsign
                ||
                'Unknown Officer';


            name.textContent =
                displayName;


            const rank =
                document.createElement(
                    'span'
                );


            rank.className =
                'agent-rank';


            rank.textContent =
                officer.rank || '';


            label.appendChild(
                checkbox
            );


            label.appendChild(
                name
            );


            label.appendChild(
                rank
            );


            columns[columnIndex]
                .appendChild(
                    label
                );

        }
    );


    if (!filteredOfficers.length) {

        list.innerHTML = `
            <div class="agent-loading">
                No active SCU officers found.
            </div>
        `;

    }

}

document.getElementById(

).addEventListener(
    'click',
    async function () {

        if (!canManageAccess) {

            alert(
                'You do not have permission to change case access.'
            );

            return;

        }


        const checkedBoxes =
            Array.from(
                document.querySelectorAll(
                    '#caseOfficerList input[type="checkbox"]'
                )
            ).filter(
                checkbox =>
                    checkbox.checked
            );


        const selectedOfficers =
            checkedBoxes
                .map(
                    checkbox =>
                        String(checkbox.value)
                )
                .filter(
                    id =>
                        id.length > 0
                );


        console.log(
            'SELECTED OFFICERS BEING SENT:',
            selectedOfficers
        );


        const {
            error
        } =
            await supabaseClient.rpc(
                'update_case_access',
                {
                    p_case_id:
                        caseId,

                    p_officer_ids:
                        selectedOfficers
                }
            );


        if (error) {

            console.error(
                error
            );

            alert(
                'Failed to update access: '
                +
                error.message
            );

        }


        alert(
            'Access updated successfully.'

        await loadEvidence();

    }
);

/* =========================
   UPLOAD EVIDENCE
========================= */

document.getElementById(
    'uploadEvidence'
).addEventListener(
    'click',
    async function () {

        const titleInput =
            document.getElementById(
                'evidenceTitle'
            );


        const descriptionInput =
            document.getElementById(
                'evidenceDescription'
            );


        const input =
            document.getElementById(
                'evidenceFile'
            );


        const title =
            titleInput.value.trim();


        const description =
            descriptionInput.value.trim();


        const file =
            input.files[0];


        if (!title) {

            alert(
                'Please enter an evidence title.'
            );

            titleInput.focus();

            return;

        }


        if (!description) {

            alert(
                'Please enter an evidence description.'
            );

            descriptionInput.focus();

            return;

        }


        if (!file) {

            alert(
                'Please select a file first.'
            );

            return;

        }


        const filePath =
            `${caseId}/${Date.now()}_${file.name}`;


        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from('case-evidence')
                .upload(
                    filePath,
                    file
                );


        if (uploadError) {

            console.error(
                uploadError
            );

            alert(
                'Failed to upload evidence: '
                +
                uploadError.message
            );

            return;

        }


        const {
            data: publicData
        } =
            supabaseClient
                .storage
                .from('case-evidence')
                .getPublicUrl(
                    filePath
                );


        const {
            error: evidenceError
        } =
            await supabaseClient
                .from('evidence')
                .insert({

                    case_id:
                        caseId,

                    officer_id:
                        currentUser.id,

                    evidence_type:
                        'File',

                    title:
                        title,

                    description:
                        description,

                    file_url:
                        publicData.publicUrl

                });


        if (evidenceError) {

            console.error(
                evidenceError
            );

            alert(
                'Evidence uploaded but could not be recorded: '
                +
                evidenceError.message
            );

            return;

        }


        titleInput.value = '';

        descriptionInput.value = '';

        input.value = '';


        alert(
            'Evidence uploaded successfully.'
        );


        await loadEvidence();

    }
);

/* =========================
   DELETE EVIDENCE
========================= */

async function deleteEvidence(
    item,
    deleteButton
) {

    const confirmed =
        confirm(
            'Are you sure you want to permanently delete this evidence? This cannot be undone.'
        );


    if (!confirmed) {
        return;
    }


    deleteButton.disabled =
        true;


    deleteButton.textContent =
        'DELETING...';


    try {

        /*
         * The database RLS policy is the
         * final permission check.
         *
         * The frontend only shows this
         * button to officers currently
         * attached to the case.
         */


        /* =========================
           DELETE STORAGE FILE
        ========================= */

        if (
            item.file_url &&
            String(
                item.evidence_type || ''
            ).toUpperCase()
            === 'FILE'
        ) {

            try {

                const publicUrl =
                    item.file_url;


                const bucketMarker =
                    '/storage/v1/object/public/case-evidence/';


                const markerIndex =
                    publicUrl.indexOf(
                        bucketMarker
                    );


                if (
                    markerIndex !== -1
                ) {

                    const filePath =
                        publicUrl.substring(
                            markerIndex
                            +
                            bucketMarker.length
                        );


                    const {
                        error:
                            storageError
                    } =
                        await supabaseClient
                            .storage
                            .from(
                                'case-evidence'
                            )
                            .remove(
                                [filePath]
                            );


                    if (
                        storageError
                    ) {

                        console.warn(
                            'Storage file could not be deleted:',
                            storageError
                        );

                    }

                }

            } catch (
                storageError
            ) {

                console.warn(
                    'Storage deletion failed:',
                    storageError
                );

            }

        }


        /* =========================
           DELETE DATABASE RECORD
        ========================= */

        const {
            error:
                deleteError
        } =
            await supabaseClient
                .from('evidence')
                .delete()
                .eq(
                    'id',
                    item.id
                )
                .eq(
                    'case_id',
                    caseId
                );


        if (deleteError) {

            console.error(
                deleteError
            );

            alert(
                'Failed to delete evidence: '
                +
                deleteError.message
            );

            deleteButton.disabled =
                false;

            deleteButton.textContent =
                'DELETE';

            return;

        }


        alert(
            'Evidence deleted successfully.'
        );


        await loadEvidence();

    } catch (error) {

        console.error(
            error
        );

        alert(
            'Failed to delete evidence: '
            +
            error.message
        );


        deleteButton.disabled =
            false;

        deleteButton.textContent =
            'DELETE';

    }

}


/* =========================
   LOAD EVIDENCE
========================= */

async function loadEvidence() {

    const list =
        document.getElementById(
            'evidenceList'
        );


    list.innerHTML = '';


    const {
        data,
        error
    } =
        await supabaseClient
            .from('evidence')
            .select('*')
            .eq(
                'case_id',
                caseId
            )
            .order(
                'created_at',
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            error
        );

        list.innerHTML = `
            <div class="empty">
                Failed to load evidence.
            </div>
        `;

        return;

    }


    if (!data || !data.length) {

        list.innerHTML = `
            <div class="empty">
                No evidence has been added to this case.
            </div>
        `;

        return;

    }


    data.forEach(
        item => {

            const row =
                document.createElement(
                    'div'
                );


            row.className =
                'evidence-item';


            const info =
                document.createElement(
                    'div'
                );


            info.className =
                'evidence-info';


            const name =
                document.createElement(
                    'div'
                );


            name.className =
                'evidence-name';


            name.textContent =
                item.title ||
                'Untitled Evidence';


            const type =
                document.createElement(
                    'div'
                );


            type.className =
                'evidence-type';


            type.textContent =
                item.evidence_type ||
                'Evidence';


            info.appendChild(
                name
            );


            info.appendChild(
                type
            );


            if (item.description) {

                const description =
                    document.createElement(
                        'div'
                    );


                description.className =
                    'evidence-description';


                description.textContent =
                    item.description;


                info.appendChild(
                    description
                );

            }


            /* =========================
               OPEN BUTTON
            ========================= */

            const openButton =
                document.createElement(
                    'button'
                );


            openButton.className =
                'evidence-open';


            openButton.textContent =
                'OPEN';


            openButton.addEventListener(
                'click',
                function () {

                    if (
                        item.file_url
                    ) {

                        window.open(
                            item.file_url,
                            '_blank'
                        );

                    }

                }
            );


            row.appendChild(
                info
            );


            row.appendChild(
                openButton
            );


            /* =========================
               DELETE BUTTON
            ========================= */

            if (
                canDeleteEvidence
            ) {

                const deleteButton =
                    document.createElement(
                        'button'
                    );


                deleteButton.className =
                    'evidence-delete';


                deleteButton.textContent =
                    'DELETE';


                deleteButton.addEventListener(
                    'click',
                    function () {

                        deleteEvidence(
                            item,
                            deleteButton
                        );

                    }
                );


                row.appendChild(
                    deleteButton
                );

            }


            list.appendChild(
                row
            );

        }
    );

}

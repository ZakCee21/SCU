<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCU Case Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080c11;color:#e8edf2}
header{height:70px;background:#0d131a;border-bottom:1px solid #25313c;display:flex;align-items:center;padding:0 30px;position:relative;z-index:2}
.header-brand{display:flex;align-items:center;gap:14px}
.header-logo{width:52px;height:52px;object-fit:contain;flex-shrink:0}
.header-left{display:flex;flex-direction:column}
.header-title{font-size:20px;font-weight:bold;letter-spacing:1px}
.header-subtitle{font-size:11px;color:#6f7c88;margin-top:3px;letter-spacing:1px}
.header-right{margin-left:auto}
.background-logo{position:fixed;top:50%;width:220px;height:220px;object-fit:contain;opacity:.5;z-index:0;pointer-events:none}
.background-logo-left{left:20px;transform:translateY(-50%)}
.background-logo-right{right:20px;transform:translateY(-50%)}
.page{position:relative;z-index:1;max-width:1200px;margin:25px auto;padding:0 20px 40px}
.back-button{background:#17202a;border:1px solid #354554;color:#dce3e8;padding:9px 15px;border-radius:4px;cursor:pointer;font-size:12px}
.back-button:hover{background:#202c38}
.case-header{background:#0d131a;border:1px solid #25313c;border-radius:5px;padding:20px;margin-bottom:20px}
.case-number{color:#6f7c88;font-size:12px;margin-bottom:5px}
.case-title{font-size:24px;font-weight:bold}
.case-status{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:3px;font-size:11px;font-weight:bold}
.status-active{background:#12351f;color:#4ade80;border:1px solid #216b3d}
.status-closed{background:#3a1717;color:#ff6666;border:1px solid #713030}
.closed-notice{background:#3a1717;border:1px solid #713030;color:#ff6666;padding:12px 15px;border-radius:4px;margin-top:15px;font-size:12px;font-weight:bold}
.section{background:#0d131a;border:1px solid #25313c;border-radius:5px;margin-bottom:20px;overflow:hidden}
.section-header{padding:14px 18px;background:#111821;border-bottom:1px solid #25313c;font-size:13px;font-weight:bold;letter-spacing:.5px}
.section-body{padding:20px}
label{display:block;color:#8d9aa6;font-size:11px;margin-bottom:6px}
input,textarea,select{width:100%;background:#080c11;border:1px solid #354554;color:#e8edf2;border-radius:4px;padding:10px;font-family:Arial,sans-serif;font-size:13px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:#4b6478}
.field{margin-bottom:18px}
.button-row{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:4px;padding:10px 15px;cursor:pointer;font-size:12px;font-weight:bold}
button:disabled{opacity:.6;cursor:not-allowed}
.save-button,.upload-button{background:#1d4ed8;color:white}
.save-button:hover,.upload-button:hover{background:#2563eb}
.close-case-button{background:#9f1239;color:white}
.close-case-button:hover{background:#be123c}
.unassign-case-button{background:#92400e;color:white}
.unassign-case-button:hover{background:#b45309}
.delete-button,.evidence-delete{background:#7f1d1d;color:white}
.delete-button:hover,.evidence-delete:hover{background:#991b1b}
.agent-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;background:#080c11;border:1px solid #354554;border-radius:5px;overflow:hidden}
.agent-column{min-width:0}
.agent-option{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:0;border-bottom:1px solid #202b36;cursor:pointer;color:#e8edf2;font-size:13px;font-weight:normal}
.agent-option:hover{background:#111a23}
.agent-option input[type=checkbox]{width:16px;height:16px;margin:0;padding:0;flex-shrink:0;accent-color:#1d4ed8;cursor:pointer}
.agent-name{flex:1;min-width:0}
.agent-rank{color:#6f7c88;font-size:11px;margin-left:5px}
.agent-loading{grid-column:1/-1;padding:12px;color:#6f7c88;font-size:12px}
.evidence-list{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.evidence-item{background:#080c11;border:1px solid #25313c;border-radius:4px;padding:14px;display:flex;align-items:flex-start;gap:12px}
.evidence-info{flex:1;min-width:0}
.evidence-name{font-size:13px;color:#e8edf2;font-weight:bold;word-break:break-word}
.evidence-description{font-size:11px;color:#9aa6b2;margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.evidence-type{font-size:10px;color:#6f7c88;margin-top:6px}
.evidence-open{background:#17202a;border:1px solid #354554;color:#dce3e8;padding:7px 10px;font-size:10px;flex-shrink:0}
.evidence-open:hover{background:#202c38}
.evidence-delete{border:1px solid #991b1b;color:white;padding:7px 10px;font-size:10px;flex-shrink:0}
.empty,.loading{color:#6f7c88;font-size:12px;padding:10px 0}
@media(max-width:650px){
.agent-list{grid-template-columns:1fr}.agent-loading{grid-column:1}
header{padding:0 15px}.page{padding:0 12px 30px}
.header-logo{width:42px;height:42px}.header-brand{gap:10px}
.header-title{font-size:16px}.header-subtitle{font-size:9px}
.background-logo{width:130px;height:130px;opacity:.25}
.background-logo-left{left:-45px}.background-logo-right{right:-45px}
.evidence-item{flex-direction:column}
}
</style>
</head>
<body>
<img class="background-logo background-logo-left" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="">
<img class="background-logo background-logo-right" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="">
<header>
  <div class="header-brand">
    <img class="header-logo" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="SCU Logo">
    <div class="header-left">
      <div class="header-title">SCU CASE MANAGEMENT</div>
      <div class="header-subtitle">SPECIAL CONSTABULARY UNIT</div>
    </div>
  </div>
  <div class="header-right"><button class="back-button" onclick="window.location.href='dashboard.html'">BACK TO DASHBOARD</button></div>
</header>

<div class="page">
  <div id="loadingMessage" class="loading">Loading case...</div>
  <div id="caseContent" style="display:none;">
    <div class="case-header">
      <div id="caseNumber" class="case-number"></div>
      <div id="caseTitle" class="case-title"></div>
      <div id="caseCreatedBy" class="case-number" style="margin-top:6px;"></div>
      <div id="caseStatus" class="case-status"></div>
      <div id="closedNotice" class="closed-notice" style="display:none;">THIS CASE IS CLOSED</div>
    </div>

    <div class="section">
      <div class="section-header">CASE INFORMATION</div>
      <div class="section-body">
        <div class="field"><label>CASE NAME</label><input id="caseName" type="text"></div>
        <div class="field">
          <label>CLASSIFICATION</label>
          <select id="classification">
            <option value="Restricted">Restricted</option>
            <option value="Confidential">Confidential</option>
            <option value="Secret">Secret</option>
            <option value="Top Secret">Top Secret</option>
          </select>
        </div>
        <div class="field"><label>DESCRIPTION</label><textarea id="caseDescription"></textarea></div>
        <div class="button-row">
          <button id="saveCase" class="save-button">SAVE CHANGES</button>
          <button id="closeCase" class="close-case-button" style="display:none;">CLOSE CASE</button>
          <button id="unassignCase" class="unassign-case-button" style="display:none;">UNASSIGN CASE</button>
          <button id="deleteCase" class="delete-button" style="display:none;">DELETE CASE</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">OFFICER ACCESS</div>
      <div class="section-body">
        <div id="caseOfficerList" class="agent-list"><div class="agent-loading">Loading officers...</div></div>
        <div style="margin-top:15px;color:#6f7c88;font-size:11px;">All selected officers have the same case permissions. Any officer already involved in the case can manage this list.</div>
        <div class="button-row" style="margin-top:15px;"><button id="saveAccess" class="save-button" style="display:none;">SAVE ACCESS</button></div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">EVIDENCE &amp; DOCUMENTS</div>
      <div class="section-body">
        <div class="field"><label>EVIDENCE TITLE</label><input id="evidenceTitle" type="text" placeholder="Enter evidence title"></div>
        <div class="field"><label>EVIDENCE DESCRIPTION</label><textarea id="evidenceDescription" placeholder="Enter a description of the evidence"></textarea></div>
        <div class="field"><label>PASTE ANY RELEVANT LINKS HERE. BODYCAM, DOCS ETC</label><input id="evidenceUrl" type="url" placeholder="https://..."></div>
        <div class="field"><label>UPLOAD ANY IMAGES HERE — MAX SIZE 50MB</label><input id="evidenceFile" type="file"></div>
        <div class="button-row"><button id="uploadEvidence" class="upload-button">UPLOAD + CONFIRM EVIDENCE</button></div>
        <div id="evidenceList" class="evidence-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mtlozyseibrefhxnocvb.supabase.co';
const SUPABASE_KEY='sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let currentOfficer=null;
let caseData=null;
let canManageAccess=false;
let canDeleteEvidence=false;
let caseHasAssignment=false;

const closeCaseRoles=['master','investigator','case_lead','case lead'];
const unassignCaseRanks=['head of drugs','head of gangs','head of weapons'];
const params=new URLSearchParams(window.location.search);
const caseId=params.get('id');

function normalise(value){return String(value||'').trim().toLowerCase();}
function isActiveOfficer(){return Boolean(currentOfficer&&currentOfficer.active===true&&normalise(currentOfficer.role)!=='probationary');}
function hasSeniorCaseRole(){return Boolean(currentOfficer&&closeCaseRoles.includes(normalise(currentOfficer.role)));}

/* ACTIVITY LOG */
async function logActivity(action,details){
  if(!caseId||!currentUser)return;
  try{
    const {error}=await supabaseClient.from('activity_log').insert({
      case_id:caseId,
      officer_id:currentUser.id,
      action:action,
      details:details||''
    });
    if(error)console.warn('Activity log error:',error.message);
  }catch(error){console.warn('Activity log error:',error);}
}

/* INITIALISE — role and active checks happen BEFORE any case data is loaded */
async function initialise(){
  if(!caseId){alert('No case selected.');window.location.href='dashboard.html';return;}
  const {data:{user},error:userError}=await supabaseClient.auth.getUser();
  if(userError||!user){window.location.href='index.html';return;}
  currentUser=user;
  const {data:officer,error:officerError}=await supabaseClient
    .from('officers')
    .select('id, full_name, rank, role, active')
    .eq('id',user.id)
    .single();

  if(officerError||!officer){
    alert('Unable to load your officer profile.');
    window.location.href='index.html';
    return;
  }
  currentOfficer=officer;

  if(officer.active!==true){
    alert('Your officer account is inactive. You cannot access case management.');
    await supabaseClient.auth.signOut();
    window.location.href='index.html';
    return;
  }
  if(normalise(officer.role)==='probationary'){
    alert('Probationary officers cannot access case management. You can submit intelligence from the dashboard.');
    window.location.href='dashboard.html';
    return;
  }
  await loadCase();
}

/* LOAD CASE */
async function loadCase(){
  const {data,error}=await supabaseClient.from('cases')
    .select('id, case_name, case_number, status, classification, description, created_at, created_by')
    .eq('id',caseId).single();
  if(error||!data){console.error(error);alert('Unable to load case. You may not have access to it.');window.location.href='dashboard.html';return;}
  caseData=data;
  document.getElementById('caseNumber').textContent=data.case_number||'CASE';
  document.getElementById('caseTitle').textContent=data.case_name||'Untitled Case';

  const {data:creator}=await supabaseClient.from('officers').select('full_name, callsign').eq('id',data.created_by).single();
  document.getElementById('caseCreatedBy').textContent='Created By: '+(creator?(creator.full_name||creator.callsign||'Unknown Officer'):'Unknown Officer');
  document.getElementById('caseName').value=data.case_name||'';
  document.getElementById('classification').value=data.classification||'Restricted';
  document.getElementById('caseDescription').value=data.description||'';
  updateStatusDisplay(data.status);
  setupPermissions(data);
  await loadOfficerAccess();
  await loadEvidence();
  document.getElementById('loadingMessage').style.display='none';
  document.getElementById('caseContent').style.display='block';
}

function updateStatusDisplay(status){
  const element=document.getElementById('caseStatus');
  const notice=document.getElementById('closedNotice');
  if(normalise(status)==='closed'){
    element.textContent='CLOSED';element.className='case-status status-closed';notice.style.display='block';
  }else{
    element.textContent='ACTIVE';element.className='case-status status-active';notice.style.display='none';
  }
}

function canUnassignCurrentCase(){
  if(!currentOfficer)return false;
  return normalise(currentOfficer.role)==='master'||unassignCaseRanks.includes(normalise(currentOfficer.rank));
}
function updateUnassignButton(){
  const button=document.getElementById('unassignCase');
  if(button)button.style.display=canUnassignCurrentCase()&&caseHasAssignment?'inline-block':'none';
}

/* FRONT-END PERMISSIONS — database RLS remains the final check */
function setupPermissions(data){
  const role=normalise(currentOfficer&&currentOfficer.role);
  const isCreator=currentOfficer&&String(currentOfficer.id)===String(data.created_by);
  const canEdit=Boolean(isCreator||['master','officer','investigator','case_lead','case lead'].includes(role));
  document.getElementById('saveCase').style.display=canEdit?'inline-block':'none';
  const canClose=hasSeniorCaseRole();
  document.getElementById('closeCase').style.display=canClose&&normalise(data.status)!=='closed'?'inline-block':'none';
  document.getElementById('deleteCase').style.display=canClose?'inline-block':'none';
  updateUnassignButton();
}

function updateAccessPermission(accessRows){
  const isCreator=currentOfficer&&caseData&&String(currentOfficer.id)===String(caseData.created_by);
  const role=normalise(currentOfficer&&currentOfficer.role);
  const isSenior=['master','investigator','case_lead','case lead'].includes(role);
  const isInvolved=(accessRows||[]).some(row=>String(row.officer_id)===String(currentOfficer.id));
  canDeleteEvidence=Boolean(role==='master'||isInvolved);
  canManageAccess=Boolean(isCreator||isSenior||isInvolved);
  document.getElementById('saveAccess').style.display=canManageAccess?'inline-block':'none';
}

async function loadOfficerAccess(){
  const list=document.getElementById('caseOfficerList');
  list.innerHTML='';
  const {data:officers,error:officerError}=await supabaseClient.from('officers')
    .select('id, full_name, rank, portal_title, callsign, active, is_scu_agent')
    .eq('active',true);
  if(officerError){console.error(officerError);list.innerHTML='<div class="agent-loading">Failed to load officers.</div>';return;}

  const {data:accessRows,error:accessError}=await supabaseClient.from('case_access')
    .select('officer_id, permission').eq('case_id',caseId);
  if(accessError){
    console.error(accessError);list.innerHTML='<div class="agent-loading">Failed to load case access.</div>';
    canDeleteEvidence=false;caseHasAssignment=false;updateUnassignButton();return;
  }
  caseHasAssignment=(accessRows||[]).length>0;
  updateAccessPermission(accessRows||[]);
  updateUnassignButton();
  const selectedOfficerIds=new Set((accessRows||[]).map(row=>String(row.officer_id)));
  const rankOrder={'Head of SCU':1,'Assistant Head of SCU':2,'Head of Weapons':3,'Head of Drugs':3,'Head of Gangs':3,'Detective':4};

  function getOfficerPortalRank(officer){
    const savedRank=String(officer.rank||'').trim();
    const portalTitle=String(officer.portal_title||'').trim();
    if(Object.prototype.hasOwnProperty.call(rankOrder,portalTitle))return portalTitle;
    if(Object.prototype.hasOwnProperty.call(rankOrder,savedRank))return savedRank;
    return '';
  }

  const filteredOfficers=(officers||[]).filter(officer=>normalise(officer.role)!=='probationary'&&Boolean(getOfficerPortalRank(officer)))
    .sort((a,b)=>{
      const difference=rankOrder[getOfficerPortalRank(a)]-rankOrder[getOfficerPortalRank(b)];
      if(difference!==0)return difference;
      return (a.full_name||'').trim().toLowerCase().localeCompare((b.full_name||'').trim().toLowerCase());
    });

  const perColumn=8;
  const numberOfColumns=Math.ceil(filteredOfficers.length/perColumn);
  const columns=[];
  for(let i=0;i<numberOfColumns;i++){
    const column=document.createElement('div');column.className='agent-column';columns.push(column);list.appendChild(column);
  }
  filteredOfficers.forEach((officer,index)=>{
    const columnIndex=Math.floor(index/perColumn);
    const label=document.createElement('label');label.className='agent-option';
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=officer.id;
    checkbox.checked=selectedOfficerIds.has(String(officer.id));checkbox.disabled=!canManageAccess;
    const name=document.createElement('span');name.className='agent-name';
    name.textContent=officer.full_name||officer.callsign||'Unknown Officer';
    const rank=document.createElement('span');rank.className='agent-rank';
    rank.textContent=getOfficerPortalRank(officer)||officer.rank||'';
    label.append(checkbox,name,rank);columns[columnIndex].appendChild(label);
  });
  if(!filteredOfficers.length)list.innerHTML='<div class="agent-loading">No active SCU officers found.</div>';
}

/* SAVE ACCESS */
document.getElementById('saveAccess').addEventListener('click',async function(){
  if(!canManageAccess){alert('You do not have permission to change case access.');return;}
  const selectedOfficers=Array.from(document.querySelectorAll('#caseOfficerList input[type="checkbox"]:checked'))
    .map(checkbox=>String(checkbox.value)).filter(id=>id.length>0);
  const {error}=await supabaseClient.rpc('update_case_access',{p_case_id:caseId,p_officer_ids:selectedOfficers});
  if(error){console.error(error);alert('Failed to update access: '+error.message);return;}
  await logActivity('OFFICER ACCESS UPDATED',selectedOfficers.length?selectedOfficers.length+' officer(s) assigned to the case.':'All officers removed from the case.');
  alert('Access updated successfully.');
  await loadOfficerAccess();await loadEvidence();
});

/* UNASSIGN CASE */
document.getElementById('unassignCase').addEventListener('click',async function(){
  if(!canUnassignCurrentCase()){alert('You do not have permission to unassign this case.');return;}
  if(!caseHasAssignment){alert('This case is already unassigned.');return;}
  if(!confirm('Are you sure you want to unassign this case? This will remove all assigned officers from the case, but will NOT delete or close the case.'))return;
  const button=document.getElementById('unassignCase');button.disabled=true;button.textContent='UNASSIGNING...';
  try{
    const {error}=await supabaseClient.rpc('update_case_access',{p_case_id:caseId,p_officer_ids:[]});
    if(error)throw new Error('Failed to unassign case: '+error.message);
    await logActivity('CASE UNASSIGNED','All officers were removed from the case.');
    alert('Case unassigned successfully.');await loadCase();
  }catch(error){console.error(error);alert(error.message);button.disabled=false;button.textContent='UNASSIGN CASE';}
});

/* SAVE CASE */
document.getElementById('saveCase').addEventListener('click',async function(){
  const role=normalise(currentOfficer&&currentOfficer.role);
  const allowed=Boolean(currentOfficer&&(String(currentOfficer.id)===String(caseData.created_by)||['master','officer','investigator','case_lead','case lead'].includes(role)));
  if(!allowed){alert('You do not have permission to edit this case.');return;}
  const caseName=document.getElementById('caseName').value.trim();
  const classification=document.getElementById('classification').value;
  const description=document.getElementById('caseDescription').value.trim();
  const oldName=caseData.case_name||'';
  const oldClassification=caseData.classification||'';
  const oldDescription=caseData.description||'';
  const changes=[];
  if(oldName!==caseName)changes.push('Case name changed');
  if(oldClassification!==classification)changes.push('Classification changed from '+oldClassification+' to '+classification);
  if(oldDescription!==description)changes.push('Case description changed');
  const {error}=await supabaseClient.from('cases').update({
    case_name:caseName,classification:classification,description:description,updated_at:new Date().toISOString()
  }).eq('id',caseId);
  if(error){console.error(error);alert('Failed to save case: '+error.message);return;}
  if(changes.length)await logActivity('CASE UPDATED',changes.join('; '));
  alert('Case updated successfully.');await loadCase();
});

/* CLOSE CASE */
document.getElementById('closeCase').addEventListener('click',async function(){
  if(!hasSeniorCaseRole()){alert('You do not have permission to close this case.');return;}
  if(!confirm('Are you sure you want to close this case?'))return;
  const {error}=await supabaseClient.from('cases').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',caseId);
  if(error){console.error(error);alert('Failed to close case: '+error.message);return;}
  await logActivity('CASE CLOSED','Case was closed by '+(currentOfficer.full_name||currentOfficer.id));
  alert('Case closed successfully.');await loadCase();
});

/* DELETE CASE */
document.getElementById('deleteCase').addEventListener('click',async function(){
  if(!hasSeniorCaseRole()){alert('You do not have permission to delete this case.');return;}
  if(!confirm('Are you sure you want to permanently delete this case? This cannot be undone.'))return;
  const button=document.getElementById('deleteCase');button.disabled=true;button.textContent='DELETING...';
  try{
    const {data:evidenceRows,error:evidenceLoadError}=await supabaseClient.from('evidence')
      .select('id, evidence_type, file_url').eq('case_id',caseId);
    if(evidenceLoadError)throw new Error('Unable to check the case evidence before deletion: '+evidenceLoadError.message);
    const storagePaths=[];
    (evidenceRows||[]).forEach(item=>{
      if(!item.file_url||normalise(item.evidence_type)!=='file')return;
      const fileUrl=String(item.file_url);
      const markers=['/storage/v1/object/public/case-evidence/','/storage/v1/object/sign/case-evidence/','/storage/v1/object/authenticated/case-evidence/'];
      const marker=markers.find(value=>fileUrl.includes(value));
      if(marker){
        const path=decodeURIComponent(fileUrl.substring(fileUrl.indexOf(marker)+marker.length).split('?')[0]);
        if(path)storagePaths.push(path);
        return;
      }
      if(fileUrl.startsWith(caseId+'/')){storagePaths.push(decodeURIComponent(fileUrl));return;}
      throw new Error('A case evidence file has an invalid Storage path. The case was NOT deleted.');
    });
    if(storagePaths.length){
      const {error:storageError}=await supabaseClient.storage.from('case-evidence').remove([...new Set(storagePaths)]);
      if(storageError)throw new Error('The case files could not be removed from Storage. The case was NOT deleted: '+storageError.message);
    }
    const {error:deleteError}=await supabaseClient.rpc('delete_case',{p_case_id:caseId});
    if(deleteError)throw new Error('The case database record could not be deleted: '+deleteError.message);
    alert('Case deleted successfully.');window.location.href='dashboard.html';
  }catch(error){
    console.error(error);alert(error.message);button.disabled=false;button.textContent='DELETE CASE';
  }
});

/* UPLOAD + CONFIRM EVIDENCE */
document.getElementById('uploadEvidence').addEventListener('click',async function(){
  const titleInput=document.getElementById('evidenceTitle');
  const descriptionInput=document.getElementById('evidenceDescription');
  const fileInput=document.getElementById('evidenceFile');
  const urlInput=document.getElementById('evidenceUrl');
  const title=titleInput.value.trim();
  const description=descriptionInput.value.trim();
  const file=fileInput.files[0];
  const url=urlInput.value.trim();
  if(!title){alert('Please enter an evidence title.');titleInput.focus();return;}
  if(!description){alert('Please enter an evidence description.');descriptionInput.focus();return;}
  if(!file&&!url){alert('Please provide either a relevant link or upload a file.');urlInput.focus();return;}
  if(file&&file.size>50*1024*1024){alert('The selected file exceeds the 50MB limit.');return;}
  const button=document.getElementById('uploadEvidence');button.disabled=true;button.textContent='UPLOADING...';
  try{
    if(file){
      const filePath=caseId+'/'+Date.now()+'_'+file.name;
      const {error:uploadError}=await supabaseClient.storage.from('case-evidence').upload(filePath,file);
      if(uploadError)throw new Error('Failed to upload evidence file: '+uploadError.message);
      const {data:publicData}=supabaseClient.storage.from('case-evidence').getPublicUrl(filePath);
      const {error:evidenceError}=await supabaseClient.from('evidence').insert({
        case_id:caseId,officer_id:currentUser.id,evidence_type:'File',title:title,description:description,file_url:publicData.publicUrl
      });
      if(evidenceError)throw new Error('Evidence file uploaded but could not be recorded: '+evidenceError.message);
      await logActivity('EVIDENCE ADDED','File evidence added: '+title);
    }
    if(url){
      const {error}=await supabaseClient.from('evidence').insert({
        case_id:caseId,officer_id:currentUser.id,evidence_type:'External Link',title:title,description:description,file_url:url
      });
      if(error)throw new Error('Evidence link could not be recorded: '+error.message);
      await logActivity('EVIDENCE ADDED','External link evidence added: '+title);
    }
    titleInput.value='';descriptionInput.value='';fileInput.value='';urlInput.value='';
    alert('Evidence uploaded successfully.');await loadEvidence();
  }catch(error){console.error(error);alert(error.message);}
  finally{button.disabled=false;button.textContent='UPLOAD + CONFIRM EVIDENCE';}
});

/* DELETE EVIDENCE */
async function deleteEvidence(item,button){
  if(!confirm('Are you sure you want to permanently delete this evidence? This cannot be undone.'))return;
  button.disabled=true;button.textContent='DELETING...';
  try{
    if(item.file_url&&normalise(item.evidence_type)==='file'){
      const fileUrl=String(item.file_url);
      const markers=['/storage/v1/object/public/case-evidence/','/storage/v1/object/sign/case-evidence/','/storage/v1/object/authenticated/case-evidence/'];
      const marker=markers.find(value=>fileUrl.includes(value));
      if(marker){
        const filePath=decodeURIComponent(fileUrl.substring(fileUrl.indexOf(marker)+marker.length).split('?')[0]);
        const {error:storageError}=await supabaseClient.storage.from('case-evidence').remove([filePath]);
        if(storageError)throw new Error('The evidence record was not deleted because its file could not be removed: '+storageError.message);
      }else if(fileUrl.startsWith(caseId+'/')){
        const {error:storageError}=await supabaseClient.storage.from('case-evidence').remove([decodeURIComponent(fileUrl)]);
        if(storageError)throw new Error('The evidence record was not deleted because its file could not be removed: '+storageError.message);
      }else{
        throw new Error('Unable to determine the evidence file path. The evidence was not deleted.');
      }
    }
    const {error:deleteError}=await supabaseClient.from('evidence').delete().eq('id',item.id).eq('case_id',caseId);
    if(deleteError)throw new Error('Failed to delete evidence: '+deleteError.message);
    await logActivity('EVIDENCE DELETED','Evidence deleted: '+(item.title||'Untitled Evidence'));
    alert('Evidence deleted successfully.');await loadEvidence();
  }catch(error){console.error(error);alert(error.message);button.disabled=false;button.textContent='DELETE';}
}

/* LOAD EVIDENCE */
async function loadEvidence(){
  const list=document.getElementById('evidenceList');list.innerHTML='';
  const {data,error}=await supabaseClient.from('evidence').select('*').eq('case_id',caseId)
    .order('created_at',{ascending:false});
  if(error){console.error(error);list.innerHTML='<div class="empty">Failed to load evidence.</div>';return;}
  if(!data||!data.length){list.innerHTML='<div class="empty">No evidence has been added to this case.</div>';return;}
  data.forEach(item=>{
    const row=document.createElement('div');row.className='evidence-item';
    const info=document.createElement('div');info.className='evidence-info';
    const name=document.createElement('div');name.className='evidence-name';
    name.textContent=(item.evidence_number!=null?'E-'+String(item.evidence_number).padStart(3,'0')+' — ':'')+(item.title||'Untitled Evidence');
    info.appendChild(name);
    const type=document.createElement('div');type.className='evidence-type';type.textContent=item.evidence_type||'Evidence';info.appendChild(type);
    if(item.description){const description=document.createElement('div');description.className='evidence-description';description.textContent=item.description;info.appendChild(description);}
    row.appendChild(info);
    const openButton=document.createElement('button');openButton.className='evidence-open';openButton.textContent='OPEN';
    openButton.addEventListener('click',async function(){
      if(!item.file_url)return;
      if(normalise(item.evidence_type)!=='file'){window.open(item.file_url,'_blank','noopener');return;}
      openButton.disabled=true;openButton.textContent='OPENING...';
      try{
        const fileUrl=String(item.file_url);
        const markers=['/storage/v1/object/public/case-evidence/','/storage/v1/object/sign/case-evidence/','/storage/v1/object/authenticated/case-evidence/'];
        const marker=markers.find(value=>fileUrl.includes(value));
        if(!marker)throw new Error('Unable to determine the evidence file path.');
        const filePath=decodeURIComponent(fileUrl.substring(fileUrl.indexOf(marker)+marker.length).split('?')[0]);
        const {data:signedData,error:signedError}=await supabaseClient.storage.from('case-evidence').createSignedUrl(filePath,3600);
        if(signedError)throw signedError;
        if(!signedData||!signedData.signedUrl)throw new Error('Supabase did not return a valid file URL.');
        window.open(signedData.signedUrl,'_blank','noopener');
      }catch(error){console.error('Unable to open evidence:',error);alert('Unable to open this evidence: '+error.message);}
      finally{openButton.disabled=false;openButton.textContent='OPEN';}
    });
    row.appendChild(openButton);
    if(canDeleteEvidence){
      const deleteButton=document.createElement('button');deleteButton.className='evidence-delete';deleteButton.textContent='DELETE';
      deleteButton.addEventListener('click',()=>deleteEvidence(item,deleteButton));row.appendChild(deleteButton);
    }
    list.appendChild(row);
  });
}

initialise();
</script>

<body>

    <div class="header">

        <div class="header-left">

            <h1>SCU CASE ACTIVITY LOG</h1>

            <p>Master Intelligence & Case Audit System</p>

        </div>

        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'"
        >
            BACK TO DASHBOARD
        </button>

    </div>


    <div class="container">

        <div class="page-title">

            <h2>Case Activity Log</h2>

            <p>
                Complete activity history across SCU cases.
                This page is restricted to master-level personnel.
            </p>

        </div>


        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search case, officer or details..."
            >

            <select id="actionFilter">

                <option value="">ALL ACTIONS</option>

            </select>

            <button
                class="clear-button"
                onclick="clearFilters()"
            >
                CLEAR FILTERS
            </button>

        </div>


        <div class="log-container">

            <div class="log-header">

                <h3>ACTIVITY</h3>

                <span
                    class="log-count"
                    id="logCount"
                >
                    Loading...
                </span>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Date / Time</th>

                            <th>Case</th>

                            <th>Officer</th>

                            <th>Action</th>

                            <th>Details</th>

                        </tr>

                    </thead>

                    <tbody id="activityBody">

                        <tr>

                            <td
                                colspan="5"
                                class="loading"
                            >
                                Loading activity log...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


<script>

const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let activityData = [];


async function checkMasterAccess() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return false;

    }


    const {
        data: officer,
        error
    } = await supabaseClient

        .from('officers')

        .select('role, active')

        .eq('id', session.user.id)

        .single();


    if (
        error ||
        !officer ||
        officer.active !== true ||
        officer.role !== 'master'
    ) {

        alert(
            'ACCESS DENIED: MASTER AUTHORIZATION REQUIRED.'
        );

        window.location.href =
            'dashboard.html';

        return false;

    }


    return true;

}


async function loadActivity() {

    const activityBody =
        document.getElementById(
            'activityBody'
        );


    activityBody.innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                Loading activity log...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient

        .from('activity_log')

        .select(`
            id,
            case_id,
            officer_id,
            action,
            details,
            created_at,
            cases (
                case_number,
                case_name
            ),
            officers (
                full_name,
                callsign
            )
        `)

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            'Activity log error:',
            error
        );

        activityBody.innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    Unable to load activity log.
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        document.getElementById(
            'logCount'
        ).textContent = 'Error';

        return;

    }


    activityData =
        data || [];


    populateActionFilter();

    renderActivity();

}


function populateActionFilter() {

    const select =
        document.getElementById(
            'actionFilter'
        );


    const actions =
        [
            ...new Set(
                activityData
                    .map(
                        item => item.action
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    select.innerHTML =
        '<option value="">ALL ACTIONS</option>';


    actions.forEach(
        action => {

            const option =
                document.createElement(
                    'option'
                );

            option.value = action;

            option.textContent =
                action;

            select.appendChild(
                option
            );

        }
    );

}


function renderActivity() {

    const body =
        document.getElementById(
            'activityBody'
        );


    const search =
        document.getElementById(
            'searchInput'
        )
        .value
        .trim()
        .toLowerCase();


    const action =
        document.getElementById(
            'actionFilter'
        )
        .value;


    const filtered =
        activityData.filter(
            item => {

                const caseNumber =
                    item.cases?.case_number ||
                    '';

                const caseName =
                    item.cases?.case_name ||
                    '';

                const officerName =
                    item.officers?.full_name ||
                    '';

                const callsign =
                    item.officers?.callsign ||
                    '';

                const details =
                    item.details ||
                    '';

                const actionText =
                    item.action ||
                    '';


                const searchable =
                    (
                        caseNumber +
                        ' ' +
                        caseName +
                        ' ' +
                        officerName +
                        ' ' +
                        callsign +
                        ' ' +
                        details +
                        ' ' +
                        actionText
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchable.includes(
                        search
                    );


                const matchesAction =
                    !action ||
                    actionText === action;


                return (
                    matchesSearch &&
                    matchesAction
                );

            }
        );


    document.getElementById(
        'logCount'
    ).textContent =
        filtered.length +
        (
            filtered.length === 1
                ? ' entry'
                : ' entries'
        );


    if (!filtered.length) {

        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No activity found.
                </td>
            </tr>
        `;

        return;

    }


    body.innerHTML =
        filtered
            .map(
                item => {

                    const date =
                        formatDate(
                            item.created_at
                        );


                    const caseNumber =
                        item.cases?.case_number ||
                        'Unknown Case';


                    const caseName =
                        item.cases?.case_name ||
                        '';


                    const officerName =
                        item.officers?.full_name ||
                        'Unknown Officer';


                    const callsign =
                        item.officers?.callsign ||
                        '';


                    return `
                        <tr>

                            <td class="date">
                                ${escapeHtml(date)}
                            </td>

                            <td>

                                <div class="case-number">
                                    ${escapeHtml(caseNumber)}
                                </div>

                                <div class="case-name">
                                    ${escapeHtml(caseName)}
                                </div>

                            </td>

                            <td class="officer">

                                ${escapeHtml(officerName)}

                                ${
                                    callsign
                                        ? `<br><span class="case-name">${escapeHtml(callsign)}</span>`
                                        : ''
                                }

                            </td>

                            <td class="action">
                                ${escapeHtml(item.action || '')}
                            </td>

                            <td class="details">
                                ${escapeHtml(item.details || '')}
                            </td>

                        </tr>
                    `;

                }
            )
            .join('');


}


function formatDate(
    value
) {

    if (!value) {

        return '';

    }


    const date =
        new Date(value);


    return date.toLocaleString(
        'en-GB',
        {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        }
    );

}


function clearFilters() {

    document.getElementById(
        'searchInput'
    ).value = '';


    document.getElementById(
        'actionFilter'
    ).value = '';


    renderActivity();

}


function escapeHtml(
    value
) {

    return String(
        value ?? ''
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );

}


document.getElementById(
    'searchInput'
).addEventListener(
    'input',
    renderActivity
);


document.getElementById(
    'actionFilter'
).addEventListener(
    'change',
    renderActivity
);


(async function () {

    const hasAccess =
        await checkMasterAccess();


    if (!hasAccess) {

        return;

    }


    await loadActivity();

})();

</script>

</body>

</html>

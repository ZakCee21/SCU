<script>


const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {


    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    const userId =
        session.user.id;


    // Load existing cases

    loadCases(
        userId
    );


    // Load Intel counters

    loadIntelCounts(
        userId
    );

}


// ======================================================
// LOAD AUTHORISED CASES
// ======================================================

async function loadCases(
    userId
) {


    const {
        data,
        error
    } = await supabaseClient

        .from('cases')

        .select('*')

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        document
            .getElementById('caseList')
            .innerHTML =
                '<div class="empty">Unable to load case files.</div>';

        console.error(error);

        return;

    }


    const list =
        document.getElementById(
            'caseList'
        );


    document
        .getElementById('activeCases')
        .textContent =
            data.filter(
                c => c.status === 'active'
            ).length;


    // --------------------------------------------------
    // My Cases
    // --------------------------------------------------

    const myCaseCount =
        data.filter(
            c =>
                c.created_by === userId ||
                c.owner_id === userId
        ).length;


    document
        .getElementById('myCases')
        .textContent =
            myCaseCount;


    // --------------------------------------------------
    // Evidence
    // --------------------------------------------------
    //
    // Keep the existing dashboard value at 0 for now.
    // This can be connected to the evidence system later.
    //
    // --------------------------------------------------

    document
        .getElementById('evidenceCount')
        .textContent =
            0;


    if (!data.length) {

        list.innerHTML =
            '<div class="empty">No authorised case files found.</div>';

        return;

    }


    list.innerHTML = '';


    data.forEach(
        caseFile => {


            const row =
                document.createElement(
                    'div'
                );


            row.className =
                'case-row';


            row.style.cursor =
                'pointer';


            row.onclick =
                function() {

                    window.location.href =
                        `case.html?id=${caseFile.id}`;

                };


            row.innerHTML = `

                <div>

                    <div class="case-name">

                        ${escapeHtml(
                            caseFile.case_name
                        )}

                    </div>

                    <div class="case-number">

                        ${escapeHtml(
                            caseFile.case_number
                        )}

                    </div>

                </div>


                <div class="status">

                    ${escapeHtml(
                        caseFile.status
                    )}

                </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


// ======================================================
// LOAD INTEL COUNTS
// ======================================================
//
// NEW INTEL
// = Intel without a view record for this user.
//
// OPEN INTEL
// = Intel with a view record for this user.
//
// For Masters:
// = All Intel in the system.
//
// For normal officers:
// = Only Intel sent to that officer.
//
// ======================================================

async function loadIntelCounts(
    userId
) {


    // --------------------------------------------------
    // Get officer role
    // --------------------------------------------------

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, active'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        return;

    }


    const role =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    const isMaster =
        role === 'master';


    // --------------------------------------------------
    // Load Intel
    // --------------------------------------------------

    let intelQuery =
        supabaseClient

            .from(
                'intel_submissions'
            )

            .select(
                'id'
            );


    // Normal officers only receive their own Intel.

    if (!isMaster) {

        intelQuery =
            intelQuery.eq(
                'recipient_id',
                userId
            );

    }


    const {
        data: intelData,
        error: intelError
    } = await intelQuery;


    if (intelError) {

        console.error(
            'Load Intel records error:',
            intelError
        );

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        document
            .getElementById('openIntel')
            .textContent =
                '0';

        return;

    }


    const intel =
        intelData || [];


    // --------------------------------------------------
    // No Intel
    // --------------------------------------------------

    if (
        intel.length === 0
    ) {

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        document
            .getElementById('openIntel')
            .textContent =
                '0';

        return;

    }


    // --------------------------------------------------
    // Get this user's viewed Intel
    // --------------------------------------------------

    const intelIds =
        intel.map(
            item =>
                item.id
        );


    const {
        data: viewData,
        error: viewError
    } = await supabaseClient

        .from('intel_views')

        .select(
            'intel_id'
        )

        .eq(
            'user_id',
            userId
        )

        .in(
            'intel_id',
            intelIds
        );


    if (viewError) {

        console.error(
            'Load Intel views error:',
            viewError
        );

        return;

    }


    const viewedIds =
        new Set(
            (viewData || [])
                .map(
                    view =>
                        view.intel_id
                )
        );


    // --------------------------------------------------
    // Calculate counts
    // --------------------------------------------------

    let newCount = 0;
    let openCount = 0;


    intel.forEach(
        item => {

            if (
                viewedIds.has(
                    item.id
                )
            ) {

                openCount++;

            } else {

                newCount++;

            }

        }
    );


    // --------------------------------------------------
    // Display counts
    // --------------------------------------------------

    document
        .getElementById('newIntel')
        .textContent =
            newCount;


    document
        .getElementById('openIntel')
        .textContent =
            openCount;


    console.log(
        'Intel counts:',
        {
            newIntel:
                newCount,

            openIntel:
                openCount,

            total:
                intel.length,

            master:
                isMaster
        }
    );

}


// ======================================================
// HTML SECURITY
// ======================================================

function escapeHtml(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


// ======================================================
// LOGOUT
// ======================================================

async function logout() {


    await supabaseClient.auth.signOut();


    window.location.href =
        'index.html';

}


// ======================================================
// START
// ======================================================

checkLogin();


</script>


</body>

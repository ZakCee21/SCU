<!DOCTYPE html>

<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCU Dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #080c11;
        color: #e8edf2;
    }

    .header {
        background: #111821;
        border-bottom: 1px solid #293542;
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .header-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .header h1 {
        margin: 0;
        font-size: 21px;
        letter-spacing: 1.5px;
    }

    .header p {
        margin: 5px 0 0;
        color: #7f8c99;
        font-size: 11px;
    }

    .officer-info {
        text-align: right;
        margin-right: 2px;
    }

    .officer-name {
        font-size: 13px;
        font-weight: bold;
        color: #e8edf2;
    }

    .officer-rank {
        margin-top: 3px;
        font-size: 11px;
        color: #7f8c99;
    }

    .officer-status {
        margin-top: 3px;
        font-size: 10px;
        font-weight: bold;
        color: #4ade80;
        letter-spacing: 0.8px;
    }

    .logout {
        background: #202c38;
        color: white;
        border: 1px solid #354554;
        padding: 9px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    .profile-button {
        background: #263746;
        color: white;
        border: 1px solid #354554;
        padding: 9px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    .profile-button:hover {
        background: #32495c;
    }

    .logout:hover {
        background: #2b3a48;
    }

    .container {
        max-width: 1400px;
        margin: auto;
        padding: 30px;
    }

    .welcome {
        margin-bottom: 25px;
    }

    .welcome h2 {
        margin: 0 0 6px;
    }

    .welcome p {
        color: #7f8c99;
        margin: 0;
    }

    .dashboard-buttons {
        margin-bottom: 25px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .dashboard-button {
        color: white;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .create-case-button {
        background: #1d4ed8;
        border: none;
    }

    .create-case-button:hover {
        background: #2563eb;
    }

    .documents-button {
        background: #263746;
        border: 1px solid #354554;
    }

    .documents-button:hover {
        background: #32495c;
    }

    .intel-button {
        background: #166534;
        border: 1px solid #22c55e;
    }

    .intel-button:hover {
        background: #15803d;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        margin-bottom: 30px;
    }

    .card {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;
        padding: 20px;
    }

    .card-title {
        color: #8996a3;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .number {
        font-size: 30px;
        font-weight: bold;
        margin-top: 10px;
    }

    /* ACTIVE CASES */

    .active-cases-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .active-cases-card:hover {
        border-color: #22c55e;
        background: #141f1a;
    }

    .active-cases-card .number {
        color: #4ade80;
    }

    .active-cases-card.selected {
        border-color: #22c55e;
        background: #141f1a;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
    }

    /* CLOSED CASES */

    .closed-cases-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .closed-cases-card:hover {
        border-color: #ef4444;
        background: #211416;
    }

    .closed-cases-card .number {
        color: #ef4444;
    }

    .closed-cases-card.selected {
        border-color: #ef4444;
        background: #211416;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
    }

    /* NEW INTEL */

    .intel-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .intel-card:hover {
        border-color: #22c55e;
        background: #141f1a;
    }

    .intel-card .number {
        color: #e8edf2;
    }

    /*
        New Intel notification state.

        When there is new Intel:
        - Number becomes green
        - Card gets green border
        - Card gets a subtle green glow
    */

    .intel-card.has-new-intel {
        border-color: #22c55e;
        background: #141f1a;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.18);
    }

    .intel-card.has-new-intel .number {
        color: #4ade80;
    }

    /* OPEN INTEL */

    .open-intel-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease;
    }

    .open-intel-card:hover {
        border-color: #3b82f6;
        background: #141b27;
    }

    .open-intel-card .number {
        color: #60a5fa;
    }

    .panel {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;
        padding: 22px;
    }

    .panel h2 {
        margin-top: 0;
    }

    /* CASE FILTER BUTTONS */

    .case-filter-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    .case-filter-button {
        background: #202c38;
        color: #dbe3ea;
        border: 1px solid #354554;
        padding: 8px 14px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
    }

    .case-filter-button:hover {
        background: #2b3a48;
    }

    .case-filter-button.active {
        background: #1d4ed8;
        border-color: #2563eb;
        color: white;
    }

    .case-filter-button.closed-filter.active {
        background: #991b1b;
        border-color: #ef4444;
    }

    .case-row {
        border-top: 1px solid #293542;
        padding: 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .case-row:hover {
        background: #0d141c;
    }

    .case-name {
        font-weight: bold;
    }

    .case-number {
        color: #7f8c99;
        font-size: 12px;
        margin-top: 5px;
    }

    .status {
        padding: 5px 9px;
        background: #1c2935;
        border-radius: 4px;
        font-size: 11px;
    }

    .status.closed {
        background: #3a1518;
        color: #f87171;
        border: 1px solid #7f1d1d;
    }

    .empty {
        color: #6f7c88;
        text-align: center;
        padding: 30px;
    }

    @media (max-width: 700px) {

        .header {
            padding: 16px;
        }

        .header h1 {
            font-size: 17px;
        }

        .container {
            padding: 20px 15px;
        }

        .case-row {
            gap: 15px;
        }

        .officer-name {
            font-size: 12px;
        }

        .officer-rank {
            font-size: 10px;
        }

        .officer-status {
            font-size: 9px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
        }

        .header-brand {
            gap: 10px;
        }
    }

</style>


</head>

<body>

<header class="header">


<div class="header-brand">

    <img
        class="header-logo"
        src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
        alt="SCU Logo"
    >

    <div>

        <h1>SCU CASE MANAGEMENT</h1>

        <p>
            STREET CRIMES UNIT • SECURE OPERATIONS
        </p>

    </div>

</div>


<div style="display: flex; gap: 10px; align-items: center;">

    <div class="officer-info">

        <div
            class="officer-name"
            id="officerName"
        >
            Loading...
        </div>

        <div
            class="officer-rank"
            id="officerRank"
        >
            Loading...
        </div>

        <div class="officer-status">
            ● ONLINE
        </div>

    </div>


    <button
        class="profile-button"
        onclick="window.location.href='profile.html'"
    >
        PROFILE
    </button>


    <button
        class="logout"
        onclick="logout()"
    >
        LOG OUT
    </button>

</div>


</header>

<main class="container">


<section class="welcome">

    <h2>
        SCU Dashboard
    </h2>

    <p>
        Authorised officer access.
    </p>

</section>


<!-- DASHBOARD ACTIONS -->

<div class="dashboard-buttons">

    <button
        class="dashboard-button create-case-button"
        onclick="window.location.href='create-case.html'"
    >
        + CREATE NEW CASE
    </button>


    <button
        class="dashboard-button documents-button"
        onclick="window.location.href='documents.html'"
    >
        DOCUMENTS & TEMPLATES
    </button>


    <button
        class="dashboard-button intel-button"
        onclick="window.location.href='submit-intel.html'"
    >
        SUBMIT SCU INTEL
    </button>

</div>


<!-- DASHBOARD CARDS -->

<section class="cards">

    <!-- ACTIVE CASES -->

    <div
        class="card active-cases-card"
        id="activeCasesCard"
        onclick="filterCases('active')"
    >

        <div class="card-title">
            Active Cases
        </div>

        <div
            class="number"
            id="activeCases"
        >
            0
        </div>

    </div>


    <!-- CLOSED CASES -->

    <div
        class="card closed-cases-card"
        id="closedCasesCard"
        onclick="filterCases('closed')"
    >

        <div class="card-title">
            Closed Cases
        </div>

        <div
            class="number"
            id="closedCases"
        >
            0
        </div>

    </div>


    <!-- NEW INTEL -->

    <div
        class="card intel-card"
        id="newIntelCard"
        onclick="window.location.href='intel.html'"
    >

        <div class="card-title">
            New Intel
        </div>

        <div
            class="number"
            id="newIntel"
        >
            0
        </div>

    </div>


    <!-- OPEN INTEL -->

    <div
        class="card open-intel-card"
        onclick="window.location.href='intel.html'"
    >

        <div class="card-title">
            Open Intel
        </div>

        <div
            class="number"
            id="openIntel"
        >
            0
        </div>

    </div>

</section>


<!-- CASE FILES -->

<section class="panel">

    <h2>
        Accessible Case Files
    </h2>


    <div class="case-filter-buttons">

        <button
            class="case-filter-button active"
            id="showAllCasesButton"
            onclick="filterCases('all')"
        >
            ALL CASES
        </button>


        <button
            class="case-filter-button"
            id="showActiveCasesButton"
            onclick="filterCases('active')"
        >
            ACTIVE CASES
        </button>


        <button
            class="case-filter-button closed-filter"
            id="showClosedCasesButton"
            onclick="filterCases('closed')"
        >
            CLOSED CASES
        </button>

    </div>


    <div id="caseList">

        <div class="empty">
            Loading case files...
        </div>

    </div>

</section>


</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// SENIOR CASE ACCESS
// ======================================================
//
// These website-facing titles all use the existing
// backend role values below.
//
// master      = Head of SCU / Assistant Head of SCU /
//               High Command / GOV
//
// investigator = Head of Drugs
//
// case_lead    = Head of Weapons
//
// ======================================================

const fullClosedCaseAccessRoles = [
    'master',
    'investigator',
    'case_lead'
];


// ======================================================
// CASE LIST STATE
// ======================================================

let accessibleCases = [];

let currentCaseFilter = 'all';


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    const userId =
        session.user.id;


    loadOfficerDetails(
        userId
    );


    loadCases(
        userId
    );


    loadIntelCounts(
        userId
    );

}


// ======================================================
// LOAD OFFICER DETAILS
// ======================================================

async function loadOfficerDetails(
    userId
) {

    const {
        data: officer,
        error
    } = await supabaseClient

        .from('officers')

        .select(
            'full_name, rank'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (error) {

        console.error(
            'Load officer details error:',
            error
        );

        document
            .getElementById('officerName')
            .textContent =
                'Unknown Officer';

        document
            .getElementById('officerRank')
            .textContent =
                '';

        return;

    }


    document
        .getElementById('officerName')
        .textContent =
            officer.full_name ||
            'Unknown Officer';


    document
        .getElementById('officerRank')
        .textContent =
            officer.rank ||
            '';

}


// ======================================================
// LOAD AUTHORISED CASES
// ======================================================

async function loadCases(
    userId
) {

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, rank'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        return;

    }


    const role =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    const hasFullClosedCaseAccess =
        fullClosedCaseAccessRoles.includes(
            role
        );


    const {
        data,
        error
    } = await supabaseClient

        .from('cases')

        .select('*')

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        document
            .getElementById('caseList')
            .innerHTML =
                '<div class="empty">Unable to load case files.</div>';

        console.error(error);

        return;

    }


    const allCases =
        data || [];


    const activeCases =
        allCases.filter(
            c =>
                String(
                    c.status || ''
                )
                .trim()
                .toLowerCase() === 'active'
        );


    document
        .getElementById('activeCases')
        .textContent =
            activeCases.length;


    const closedCases =
        allCases.filter(
            c =>
                String(
                    c.status || ''
                )
                .trim()
                .toLowerCase() === 'closed'
        );


    document
        .getElementById('closedCases')
        .textContent =
            closedCases.length;


    if (
        hasFullClosedCaseAccess
    ) {

        accessibleCases =
            allCases;

    } else {

        accessibleCases =
            allCases.filter(
                caseFile => {

                    const isClosed =
                        String(
                            caseFile.status || ''
                        )
                        .trim()
                        .toLowerCase() === 'closed';


                    if (isClosed) {

                        return (
                            caseFile.created_by === userId
                        );

                    }


                    return true;

                }
            );

    }


    renderCaseList();


    console.log(
        'Case access:',
        {
            totalCases:
                allCases.length,

            activeCases:
                activeCases.length,

            closedCases:
                closedCases.length,

            visibleCases:
                accessibleCases.length,

            fullClosedCaseAccess:
                hasFullClosedCaseAccess,

            role:
                role
        }
    );

}


// ======================================================
// FILTER CASES
// ======================================================

function filterCases(
    filter
) {

    currentCaseFilter =
        filter;


    document
        .getElementById(
            'showAllCasesButton'
        )
        .classList.toggle(
            'active',
            filter === 'all'
        );


    document
        .getElementById(
            'showActiveCasesButton'
        )
        .classList.toggle(
            'active',
            filter === 'active'
        );


    document
        .getElementById(
            'showClosedCasesButton'
        )
        .classList.toggle(
            'active',
            filter === 'closed'
        );


    document
        .getElementById(
            'activeCasesCard'
        )
        .classList.toggle(
            'selected',
            filter === 'active'
        );


    document
        .getElementById(
            'closedCasesCard'
        )
        .classList.toggle(
            'selected',
            filter === 'closed'
        );


    renderCaseList();

}


// ======================================================
// RENDER CASE LIST
// ======================================================

function renderCaseList() {

    const list =
        document.getElementById(
            'caseList'
        );


    if (!list) {

        return;

    }


    let casesToDisplay =
        accessibleCases || [];


    if (
        currentCaseFilter === 'active'
    ) {

        casesToDisplay =
            casesToDisplay.filter(
                caseFile =>
                    String(
                        caseFile.status || ''
                    )
                    .trim()
                    .toLowerCase() === 'active'
            );

    }


    if (
        currentCaseFilter === 'closed'
    ) {

        casesToDisplay =
            casesToDisplay.filter(
                caseFile =>
                    String(
                        caseFile.status || ''
                    )
                    .trim()
                    .toLowerCase() === 'closed'
            );

    }


    if (
        casesToDisplay.length === 0
    ) {

        let message =
            'No authorised case files found.';


        if (
            currentCaseFilter === 'active'
        ) {

            message =
                'No active cases found.';

        }


        if (
            currentCaseFilter === 'closed'
        ) {

            message =
                'No closed cases found.';

        }


        list.innerHTML =
            `<div class="empty">${message}</div>`;

        return;

    }


    list.innerHTML = '';


    casesToDisplay.forEach(
        caseFile => {

            const row =
                document.createElement(
                    'div'
                );


            row.className =
                'case-row';


            row.style.cursor =
                'pointer';


            row.onclick =
                function() {

                    window.location.href =
                        `case.html?id=${caseFile.id}`;

                };


            const caseStatus =
                String(
                    caseFile.status || ''
                )
                .trim()
                .toLowerCase();


            const statusClass =
                caseStatus === 'closed'
                    ? 'status closed'
                    : 'status';


            row.innerHTML = `

                <div>

                    <div class="case-name">

                        ${escapeHtml(
                            caseFile.case_name
                        )}

                    </div>

                    <div class="case-number">

                        ${escapeHtml(
                            caseFile.case_number
                        )}

                    </div>

                </div>


                <div class="${statusClass}">

                    ${escapeHtml(
                        caseFile.status
                    )}

                </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


// ======================================================
// LOAD INTEL COUNTS
// ======================================================
//
// NEW INTEL
// = Intel without a view record for this user.
//
// OPEN INTEL
// = Intel with a view record for this user.
//
// NON-SCU NEW INTEL
// = Unassigned NON-SCU intelligence reports.
//
// Full Intel access:
// = Master, Head of Drugs and Head of Weapons.
//
// Normal officers:
// = Only Intel sent to that officer.
//
// ======================================================

async function loadIntelCounts(
    userId
) {

    // --------------------------------------------------
    // Get officer role
    // --------------------------------------------------

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, active'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        return;

    }


    const role =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    // --------------------------------------------------
    // Full Intel access roles
    // --------------------------------------------------

    const fullIntelAccessRoles = [
        'master',
        'investigator',
        'case_lead'
    ];


    const hasFullIntelAccess =
        fullIntelAccessRoles.includes(
            role
        );


    // --------------------------------------------------
    // Load normal SCU Intel
    // --------------------------------------------------

    let intelQuery =
        supabaseClient

            .from(
                'intel_submissions'
            )

         .select(
    'id, intel_group_id'
);


    // Normal officers only receive their own Intel.

    if (
        !hasFullIntelAccess
    ) {

        intelQuery =
            intelQuery.eq(
                'recipient_id',
                userId
            );

    }


    const {
        data: intelData,
        error: intelError
    } = await intelQuery;


    if (intelError) {

        console.error(
            'Load Intel records error:',
            intelError
        );

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        document
            .getElementById('openIntel')
            .textContent =
                '0';

        document
            .getElementById('newIntelCard')
            .classList.remove(
                'has-new-intel'
            );

        return;

    }


    const intel =
        intelData || [];


    // --------------------------------------------------
    // Load NON-SCU Intel
    // --------------------------------------------------
    //
    // Only senior users can see/count NON-SCU reports.
    //
    // Unassigned reports are treated as NEW Intel.
    //
    // --------------------------------------------------

    let nonScuNewCount = 0;


    if (
        hasFullIntelAccess
    ) {

        const {
            data: nonScuData,
            error: nonScuError
        } = await supabaseClient

            .from(
                'non_scu_intel_submissions'
            )

            .select(
                'id'
            )

            .eq(
                'status',
                'unassigned'
            );


        if (nonScuError) {

            console.error(
                'Load NON-SCU Intel counts error:',
                nonScuError
            );

        } else {

            nonScuNewCount =
                (nonScuData || []).length;

        }

    }


    // --------------------------------------------------
    // No Intel at all
    // --------------------------------------------------

    if (
        intel.length === 0 &&
        nonScuNewCount === 0
    ) {

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        document
            .getElementById('openIntel')
            .textContent =
                '0';

        document
            .getElementById('newIntelCard')
            .classList.remove(
                'has-new-intel'
            );

        console.log(
            'Intel counts:',
            {
                newIntel: 0,
                openIntel: 0,
                total: 0,
                nonScuNewIntel: 0,
                fullIntelAccess:
                    hasFullIntelAccess,
                role:
                    role
            }
        );

        return;

    }


    // --------------------------------------------------
    // Get viewed normal SCU Intel
    // --------------------------------------------------

    let viewedIds =
        new Set();


    if (
        intel.length > 0
    ) {

        const intelIds =
            intel.map(
                item =>
                    item.id
            );


        const {
            data: viewData,
            error: viewError
        } = await supabaseClient

            .from('intel_views')

            .select(
                'intel_id'
            )

            .eq(
                'user_id',
                userId
            )

            .in(
                'intel_id',
                intelIds
            );


        if (viewError) {

            console.error(
                'Load Intel views error:',
                viewError
            );

            return;

        }


        viewedIds =
            new Set(
                (viewData || [])
                    .map(
                        view =>
                            view.intel_id
                    )
            );

    }


   // --------------------------------------------------
// Calculate Intel counts
// --------------------------------------------------
//
// NEW INTEL
// = Intel this officer has NOT viewed.
//
// OPEN INTEL
// = All active Intel records.
//   Viewing Intel does NOT remove it from this count.
//   It remains counted until the Intel record is deleted.
//
// --------------------------------------------------

const intelGroups =
    new Map();


intel.forEach(
    item => {

        const groupId =
            item.intel_group_id ||
            item.id;


        if (
            !intelGroups.has(
                groupId
            )
        ) {

            intelGroups.set(
                groupId,
                []
            );

        }


        intelGroups
            .get(groupId)
            .push(item);

    }
);


let newCount = 0;

let openCount =
    intelGroups.size;


intelGroups.forEach(
    groupRows => {

        const isViewed =
            groupRows.some(
                row =>
                    viewedIds.has(
                        row.id
                    )
            );


        if (
            !isViewed
        ) {

            newCount++;

        }

    }
);
   // --------------------------------------------------
// Add NON-SCU unassigned reports to NEW INTEL
// --------------------------------------------------

newCount +=
    nonScuNewCount;


// --------------------------------------------------
// Add NON-SCU reports to OPEN INTEL
// --------------------------------------------------
//
// They remain open until the underlying Intel
// record is deleted.
//
// --------------------------------------------------

openCount +=
    nonScuNewCount;
   
    // --------------------------------------------------
    // Display counts
    // --------------------------------------------------

    document
        .getElementById('newIntel')
        .textContent =
            newCount;


    document
        .getElementById('openIntel')
        .textContent =
            openCount;


    // --------------------------------------------------
    // New Intel notification
    // --------------------------------------------------

    const newIntelCard =
        document.getElementById(
            'newIntelCard'
        );


    if (
        newCount > 0
    ) {

        newIntelCard.classList.add(
            'has-new-intel'
        );

    } else {

        newIntelCard.classList.remove(
            'has-new-intel'
        );

    }


    // --------------------------------------------------
    // Debug information
    // --------------------------------------------------

    console.log(
        'Intel counts:',
        {
            newIntel:
                newCount,

            openIntel:
                openCount,

            total:
                intel.length +
                nonScuNewCount,

            nonScuNewIntel:
                nonScuNewCount,

            fullIntelAccess:
                hasFullIntelAccess,

            role:
                role
        }
    );

}


// ======================================================
// HTML SECURITY
// ======================================================

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


// ======================================================
// LOGOUT
// ======================================================

async function logout() {

    await supabaseClient.auth.signOut();


    window.location.href =
        'index.html';

}

checkLogin();

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCU Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e8edf2;
        }

        .header {
            background: #111821;
            border-bottom: 1px solid #293542;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            letter-spacing: 1.5px;
        }

        .header p {
            margin: 5px 0 0;
            color: #7f8c99;
            font-size: 11px;
        }

        .logout {
            background: #202c38;
            color: white;
            border: 1px solid #354554;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .profile-button {
            background: #263746;
            color: white;
            border: 1px solid #354554;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .profile-button:hover {
            background: #32495c;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin: 0 0 6px;
        }

        .welcome p {
            color: #7f8c99;
            margin: 0;
        }

        .dashboard-buttons {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dashboard-button {
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .create-case-button {
            background: #1d4ed8;
            border: none;
        }

        .create-case-button:hover {
            background: #2563eb;
        }

        .documents-button {
            background: #263746;
            border: 1px solid #354554;
        }

        .documents-button:hover {
            background: #32495c;
        }

        .intel-button {
            background: #166534;
            border: 1px solid #22c55e;
        }

        .intel-button:hover {
            background: #15803d;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: #111821;
            border: 1px solid #293542;
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            color: #8996a3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .intel-card {
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .intel-card:hover {
            border-color: #22c55e;
            background: #141f1a;
        }

        .intel-card .number {
            color: #4ade80;
        }

        .panel {
            background: #111821;
            border: 1px solid #293542;
            border-radius: 8px;
            padding: 22px;
        }

        .panel h2 {
            margin-top: 0;
        }

        .case-row {
            border-top: 1px solid #293542;
            padding: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .case-name {
            font-weight: bold;
        }

        .case-number {
            color: #7f8c99;
            font-size: 12px;
            margin-top: 5px;
        }

        .status {
            padding: 5px 9px;
            background: #1c2935;
            border-radius: 4px;
            font-size: 11px;
        }

        .empty {
            color: #6f7c88;
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


<header class="header">

    <div>

        <h1>SCU CASE MANAGEMENT</h1>

        <p>
            STREET CRIMES UNIT • SECURE OPERATIONS
        </p>

    </div>


    <div style="display: flex; gap: 10px;">

        <button
            class="profile-button"
            onclick="window.location.href='profile.html'"
        >
            PROFILE
        </button>

        <button
            class="logout"
            onclick="logout()"
        >
            LOG OUT
        </button>

    </div>

</header>


<main class="container">


    <section class="welcome">

        <h2>
            SCU Dashboard
        </h2>

        <p>
            Authorised officer access.
        </p>

    </section>


    <!-- DASHBOARD ACTIONS -->

    <div class="dashboard-buttons">

        <button
            class="dashboard-button create-case-button"
            onclick="window.location.href='create-case.html'"
        >
            + CREATE NEW CASE
        </button>


        <button
            class="dashboard-button documents-button"
            onclick="window.location.href='documents.html'"
        >
            DOCUMENTS & TEMPLATES
        </button>


        <button
            class="dashboard-button intel-button"
            onclick="window.location.href='submit-intel.html'"
        >
            SUBMIT SCU INTEL
        </button>

    </div>


    <!-- DASHBOARD CARDS -->

    <section class="cards">


        <div class="card">

            <div class="card-title">
                Active Cases
            </div>

            <div
                class="number"
                id="activeCases"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                My Cases
            </div>

            <div
                class="number"
                id="myCases"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Evidence
            </div>

            <div
                class="number"
                id="evidenceCount"
            >
                0
            </div>

        </div>


        <!-- NEW INTEL -->

        <div
            class="card intel-card"
            onclick="window.location.href='intel.html'"
        >

            <div class="card-title">
                New Intel
            </div>

            <div
                class="number"
                id="newIntel"
            >
                0
            </div>

        </div>


    </section>


    <!-- CASE FILES -->

    <section class="panel">

        <h2>
            Accessible Case Files
        </h2>

        <div id="caseList">

            <div class="empty">
                Loading case files...
            </div>

        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {


    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    // Load existing cases

    loadCases();


    // Load new intelligence count

    loadNewIntel(
        session.user.id
    );

}


// ======================================================
// LOAD AUTHORISED CASES
// ======================================================

async function loadCases() {


    const {
        data,
        error
    } = await supabaseClient

        .from('cases')

        .select('*')

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        document
            .getElementById('caseList')
            .innerHTML =
                '<div class="empty">Unable to load case files.</div>';

        console.error(error);

        return;

    }


    const list =
        document.getElementById(
            'caseList'
        );


    document
        .getElementById('activeCases')
        .textContent =
            data.filter(
                c => c.status === 'active'
            ).length;


    if (!data.length) {

        list.innerHTML =
            '<div class="empty">No authorised case files found.</div>';

        return;

    }


    list.innerHTML = '';


    data.forEach(
        caseFile => {


            const row =
                document.createElement('div');


            row.className =
                'case-row';


            row.style.cursor =
                'pointer';


            row.onclick =
                function() {

                    window.location.href =
                        `case.html?id=${caseFile.id}`;

                };


            row.innerHTML = `

                <div>

                    <div class="case-name">

                        ${caseFile.case_name}

                    </div>

                    <div class="case-number">

                        ${caseFile.case_number}

                    </div>

                </div>


                <div class="status">

                    ${caseFile.status}

                </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


// ======================================================
// LOAD NEW INTELLIGENCE
// ======================================================

async function loadNewIntel(userId) {


    const {
        count,
        error
    } = await supabaseClient

        .from('intel_submissions')

        .select(
            'id',
            {
                count: 'exact',
                head: true
            }
        )

        .eq(
            'recipient_id',
            userId
        );


    if (error) {

        console.error(
            'Load intel count error:',
            error
        );

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        return;

    }


    document
        .getElementById('newIntel')
        .textContent =
            count || 0;

}


// ======================================================
// LOGOUT
// ======================================================

async function logout() {


    await supabaseClient.auth.signOut();


    window.location.href =
        'index.html';

}


// ======================================================
// START
// ======================================================

checkLogin();


</script>


</body>

</html>

<!DOCTYPE html>

<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCU Dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #080c11;
        color: #e8edf2;
    }

    .header {
        background: #111821;
        border-bottom: 1px solid #293542;
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .header-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .header h1 {
        margin: 0;
        font-size: 21px;
        letter-spacing: 1.5px;
    }

    .header p {
        margin: 5px 0 0;
        color: #7f8c99;
        font-size: 11px;
    }

    .officer-info {
        text-align: right;
        margin-right: 2px;
    }

    .officer-name {
        font-size: 13px;
        font-weight: bold;
        color: #e8edf2;
    }

    .officer-rank {
        margin-top: 3px;
        font-size: 11px;
        color: #7f8c99;
    }

    .officer-status {
        margin-top: 3px;
        font-size: 10px;
        font-weight: bold;
        color: #4ade80;
        letter-spacing: 0.8px;
    }

    .logout {
        background: #202c38;
        color: white;
        border: 1px solid #354554;
        padding: 9px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    .profile-button {
        background: #263746;
        color: white;
        border: 1px solid #354554;
        padding: 9px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    .profile-button:hover {
        background: #32495c;
    }

    .logout:hover {
        background: #2b3a48;
    }

    .container {
        max-width: 1400px;
        margin: auto;
        padding: 30px;
    }

    .welcome {
        margin-bottom: 25px;
    }

    .welcome h2 {
        margin: 0 0 6px;
    }

    .welcome p {
        color: #7f8c99;
        margin: 0;
    }

    .dashboard-buttons {
        margin-bottom: 25px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .dashboard-button {
        color: white;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .create-case-button {
        background: #1d4ed8;
        border: none;
    }

    .create-case-button:hover {
        background: #2563eb;
    }

    .documents-button {
        background: #263746;
        border: 1px solid #354554;
    }

    .documents-button:hover {
        background: #32495c;
    }

    .intel-button {
        background: #166534;
        border: 1px solid #22c55e;
    }

    .intel-button:hover {
        background: #15803d;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        margin-bottom: 30px;
    }

    .card {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;
        padding: 20px;
    }

    .card-title {
        color: #8996a3;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .number {
        font-size: 30px;
        font-weight: bold;
        margin-top: 10px;
    }

    /* ACTIVE CASES */

    .active-cases-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .active-cases-card:hover {
        border-color: #22c55e;
        background: #141f1a;
    }

    .active-cases-card .number {
        color: #4ade80;
    }

    .active-cases-card.selected {
        border-color: #22c55e;
        background: #141f1a;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
    }

    /* UNASSIGNED CASES */

    .unassigned-cases-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .unassigned-cases-card:hover {
        border-color: #f59e0b;
        background: #211b11;
    }

    .unassigned-cases-card .number {
        color: #fbbf24;
    }

    .unassigned-cases-card.selected {
        border-color: #f59e0b;
        background: #211b11;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
    }

    /* CLOSED CASES */

    .closed-cases-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .closed-cases-card:hover {
        border-color: #ef4444;
        background: #211416;
    }

    .closed-cases-card .number {
        color: #ef4444;
    }

    .closed-cases-card.selected {
        border-color: #ef4444;
        background: #211416;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
    }

    /* NEW INTEL */

    .intel-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .intel-card:hover {
        border-color: #22c55e;
        background: #141f1a;
    }

    .intel-card .number {
        color: #e8edf2;
    }

    .intel-card.has-new-intel {
        border-color: #22c55e;
        background: #141f1a;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.18);
    }

    .intel-card.has-new-intel .number {
        color: #4ade80;
    }

    /* OPEN INTEL */

    .open-intel-card {
        cursor: pointer;
        transition:
            border-color 0.15s ease,
            background 0.15s ease;
    }

    .open-intel-card:hover {
        border-color: #3b82f6;
        background: #141b27;
    }

    .open-intel-card .number {
        color: #60a5fa;
    }

    .panel {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;
        padding: 22px;
    }

    .panel h2 {
        margin-top: 0;
    }

    /* CASE FILTER BUTTONS */

    .case-filter-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    .case-filter-button {
        background: #202c38;
        color: #dbe3ea;
        border: 1px solid #354554;
        padding: 8px 14px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
    }

    .case-filter-button:hover {
        background: #2b3a48;
    }

    .case-filter-button.active {
        background: #1d4ed8;
        border-color: #2563eb;
        color: white;
    }

    .case-filter-button.closed-filter.active {
        background: #991b1b;
        border-color: #ef4444;
    }

    .case-filter-button.unassigned-filter.active {
        background: #92400e;
        border-color: #f59e0b;
    }

    .case-row {
        border-top: 1px solid #293542;
        padding: 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
    }

    .case-row:hover {
        background: #0d141c;
    }

    .case-name {
        font-weight: bold;
    }

    .case-number {
        color: #7f8c99;
        font-size: 12px;
        margin-top: 5px;
    }

    .status {
        padding: 5px 9px;
        background: #1c2935;
        border-radius: 4px;
        font-size: 11px;
    }

    .status.closed {
        background: #3a1518;
        color: #f87171;
        border: 1px solid #7f1d1d;
    }

    .empty {
        color: #6f7c88;
        text-align: center;
        padding: 30px;
    }

    @media (max-width: 700px) {

        .header {
            padding: 16px;
        }

        .header h1 {
            font-size: 17px;
        }

        .container {
            padding: 20px 15px;
        }

        .case-row {
            gap: 15px;
        }

        .officer-name {
            font-size: 12px;
        }

        .officer-rank {
            font-size: 10px;
        }

        .officer-status {
            font-size: 9px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
        }

        .header-brand {
            gap: 10px;
        }
    }

</style>


</head>

<body>

<header class="header">


<div class="header-brand">

    <img
        class="header-logo"
        src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
        alt="SCU Logo"
    >

    <div>

        <h1>SCU CASE MANAGEMENT</h1>

        <p>
            STREET CRIMES UNIT • SECURE OPERATIONS
        </p>

    </div>

</div>


<div style="display: flex; gap: 10px; align-items: center;">

    <div class="officer-info">

        <div
            class="officer-name"
            id="officerName"
        >
            Loading...
        </div>

        <div
            class="officer-rank"
            id="officerRank"
        >
            Loading...
        </div>

        <div class="officer-status">
            ● ONLINE
        </div>

    </div>


    <button
        class="profile-button"
        onclick="window.location.href='profile.html'"

        PROFILE
    </button>


    <button
        class="logout"

    >
        LOG OUT
    </button>

</header>

<main class="container">


<section class="welcome">

    <h2>
        SCU Dashboard

    <p>
        Authorised officer access.
    </p>

</section>


<!-- DASHBOARD ACTIONS -->

<div class="dashboard-buttons">

    <button
        class="dashboard-button create-case-button"

    >
        + CREATE NEW CASE
    </button>


    <button

    >

    </button>


    <button

<section class="cards">

    <div

    <!-- OPEN INTEL -->

    <div

<!-- CASE FILES -->

<section class="panel">

            ALL CASES

            id="showActiveCasesButton"

        >
            ACTIVE CASES
        </button>


        <button
            class="case-filter-button unassigned-filter"
            id="showUnassignedCasesButton"
            onclick="filterCases('unassigned')"
            style="display:none;"
        >
            UNASSIGNED CASES
        </button>


        <button

            id="showClosedCasesButton"

    <div id="caseList">

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// SENIOR CASE ACCESS
// ======================================================

const fullClosedCaseAccessRoles = [
    'master',
    'investigator',
    'case_lead'
];


// ======================================================
// UNASSIGNED CASE ACCESS
// ======================================================

const unassignedCaseRanks = [
    'head of drugs',
    'head of gangs',
    'head of weapons'
];


// ======================================================
// CASE LIST STATE
// ======================================================

let accessibleCases = [];

let unassignedCases = [];

let currentCaseFilter = 'all';

let canViewUnassignedCases = false;


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    const userId =
        session.user.id;


    loadOfficerDetails(
        userId
    );


    loadCases(
        userId
    );


    loadIntelCounts(
        userId
    );

}


// ======================================================
// LOAD OFFICER DETAILS
// ======================================================

async function loadOfficerDetails(
    userId
) {

    const {
        data: officer,
        error
    } = await supabaseClient

        .from('officers')

        .select(
            'full_name, rank'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (error) {

        console.error(
            'Load officer details error:',
            error
        );

        document
            .getElementById('officerName')
            .textContent =
                'Unknown Officer';

        document
            .getElementById('officerRank')
            .textContent =
                '';

        return;

    }


    document
        .getElementById('officerName')
        .textContent =
            officer.full_name ||
            'Unknown Officer';


    document
        .getElementById('officerRank')
        .textContent =
            officer.rank ||
            '';

}


// ======================================================
// LOAD AUTHORISED CASES
// ======================================================

async function loadCases(
    userId
) {

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, rank'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        return;

    }


    const role =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    const rank =
        String(
            officer.rank || ''
        )
        .trim()
        .toLowerCase();


    const hasFullClosedCaseAccess =
        fullClosedCaseAccessRoles.includes(
            role
        );


    canViewUnassignedCases =
        role === 'master' ||
        unassignedCaseRanks.includes(
            rank
        );


    const unassignedCard =
        document.getElementById(
            'unassignedCasesCard'
        );


    const unassignedButton =
        document.getElementById(
            'showUnassignedCasesButton'
        );


    if (
        canViewUnassignedCases
    ) {

        unassignedCard.style.display =
            'block';

        unassignedButton.style.display =
            'inline-block';

    } else {

        unassignedCard.style.display =
            'none';

        unassignedButton.style.display =
            'none';

    }


    const {
        data,
        error
    } = await supabaseClient

        .from('cases')

        .select('*')

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        document
            .getElementById('caseList')
            .innerHTML =
                '<div class="empty">Unable to load case files.</div>';

        console.error(error);

        return;

    }


    const allCases =
        data || [];


    // ==================================================
    // FIND CASES WITH AN ASSIGNMENT
    // ==================================================

    let assignedCaseIds =
        new Set();


    if (
        allCases.length > 0
    ) {

        const {
            data: accessRows,
            error: accessError
        } =
            await supabaseClient

                .from('case_access')

                .select(
                    'case_id'
                );


        if (accessError) {

            console.error(
                'Load case assignment error:',
                accessError
            );

        } else {

            assignedCaseIds =
                new Set(
                    (accessRows || [])
                        .map(
                            row =>
                                String(
                                    row.case_id
                                )
                        )
                );

        }

    }


    // ==================================================
    // ACTIVE CASES
    // ==================================================

    const activeCases =
        allCases.filter(
            c => {

                const isActive =
                    String(
                        c.status || ''
                    )
                    .trim()
                    .toLowerCase() === 'active';


                const isAssigned =
                    assignedCaseIds.has(
                        String(
                            c.id
                        )
                    );


                return (
                    isActive &&
                    isAssigned
                );

            }
        );


    document
        .getElementById('activeCases')
        .textContent =
            activeCases.length;


    // ==================================================
    // CLOSED CASES
    // ==================================================

    const closedCases =
        allCases.filter(
            c =>
                String(
                    c.status || ''
                )
                .trim()
                .toLowerCase() === 'closed'
        );


    document
        .getElementById('closedCases')
        .textContent =
            closedCases.length;


    // ==================================================
    // FIND UNASSIGNED CASES
    // ==================================================

    if (
        canViewUnassignedCases
    ) {

        unassignedCases =
            allCases.filter(
                caseFile =>
                    !assignedCaseIds.has(
                        String(
                            caseFile.id
                        )
                    )
            );

        document
            .getElementById('unassignedCases')
            .textContent =
                unassignedCases.length;

    } else {

        unassignedCases = [];

        document
            .getElementById('unassignedCases')
            .textContent =
                '0';

    }


    // ==================================================
    // DETERMINE ACCESSIBLE CASES
    // ==================================================

    if (
        hasFullClosedCaseAccess
    ) {

        accessibleCases =
            allCases;

    } else {

        accessibleCases =
            allCases.filter(
                caseFile => {

                    const isClosed =
                        String(
                            caseFile.status || ''
                        )
                        .trim()
                        .toLowerCase() === 'closed';


                    if (isClosed) {

                        return (
                            caseFile.created_by === userId
                        );

                    }


                    return true;

                }
            );

    }


    renderCaseList();


    console.log(
        'Case access:',
        {
            totalCases:
                allCases.length,

            activeCases:
                activeCases.length,

            closedCases:
                closedCases.length,

            unassignedCases:
                unassignedCases.length,

            visibleCases:
                accessibleCases.length,

            fullClosedCaseAccess:
                hasFullClosedCaseAccess,

            canViewUnassignedCases:
                canViewUnassignedCases,

            role:
                role,

            rank:
                rank
        }
    );

}


// ======================================================
// CASE FILTERING
// ======================================================

function filterCases(
    filter
) {

    if (
        filter === 'unassigned' &&
        !canViewUnassignedCases
    ) {

        return;

    }


    currentCaseFilter =
        filter;


    document
        .querySelectorAll(
            '.case-filter-button'
        )
        .forEach(
            button => {

                button.classList.remove(
                    'active'
                );

            }
        );


    if (
        filter === 'all'
    ) {

        document
            .getElementById(
                'showAllCasesButton'
            )
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'activeCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'unassignedCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'closedCasesCard'
            )
            .classList.remove(
                'selected'
            );

    }


    if (
        filter === 'active'
    ) {

        document
            .getElementById(
                'showActiveCasesButton'
            )
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'activeCasesCard'
            )
            .classList.add(
                'selected'
            );

        document
            .getElementById(
                'unassignedCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'closedCasesCard'
            )
            .classList.remove(
                'selected'
            );

    }


    if (
        filter === 'unassigned'
    ) {

        document
            .getElementById(
                'showUnassignedCasesButton'
            )
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'activeCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'unassignedCasesCard'
            )
            .classList.add(
                'selected'
            );

        document
            .getElementById(
                'closedCasesCard'
            )
            .classList.remove(
                'selected'
            );

    }


    if (
        filter === 'closed'
    ) {

        document
            .getElementById(
                'showClosedCasesButton'
            )
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'activeCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'unassignedCasesCard'
            )
            .classList.remove(
                'selected'
            );

        document
            .getElementById(
                'closedCasesCard'
            )
            .classList.add(
                'selected'
            );

    }


    renderCaseList();

}


// ======================================================
// RENDER CASE LIST
// ======================================================

function renderCaseList() {

    const caseList =
        document.getElementById(
            'caseList'
        );


    let casesToDisplay =
        [...accessibleCases];


    // --------------------------------------------------
    // ALL CASES
    // --------------------------------------------------

    if (
        currentCaseFilter === 'all'
    ) {

        casesToDisplay =
            [...accessibleCases];

    }


    // --------------------------------------------------
    // ACTIVE CASES
    // --------------------------------------------------

    if (
        currentCaseFilter === 'active'
    ) {

        casesToDisplay =
            accessibleCases.filter(
                caseFile =>
                    String(
                        caseFile.status || ''
                    )
                    .trim()
                    .toLowerCase() === 'active'
            );

    }


    // --------------------------------------------------
    // UNASSIGNED CASES
    // --------------------------------------------------

    if (
        currentCaseFilter === 'unassigned'
    ) {

        const unassignedIds =
            new Set(
                unassignedCases.map(
                    caseFile =>
                        String(
                            caseFile.id
                        )
                )
            );


        casesToDisplay =
            accessibleCases.filter(
                caseFile =>
                    unassignedIds.has(
                        String(
                            caseFile.id
                        )
                    )
            );

    }


    // --------------------------------------------------
    // CLOSED CASES
    // --------------------------------------------------

    if (
        currentCaseFilter === 'closed'
    ) {

        casesToDisplay =
            accessibleCases.filter(
                caseFile =>
                    String(
                        caseFile.status || ''
                    )
                    .trim()
                    .toLowerCase() === 'closed'
            );

    }


    // --------------------------------------------------
    // EMPTY RESULT
    // --------------------------------------------------

    if (
        casesToDisplay.length === 0
    ) {

        let message =
            'No cases found.';


        if (
            currentCaseFilter === 'active'
        ) {

            message =
                'No active cases found.';

        }


        if (
            currentCaseFilter === 'unassigned'
        ) {

            message =
                'No unassigned cases found.';

        }


        if (
            currentCaseFilter === 'closed'
        ) {

            message =
                'No closed cases found.';

        }


        caseList.innerHTML =
            `
                <div class="empty">
                    ${message}
                </div>
            `;

        return;

    }


    // --------------------------------------------------
    // BUILD CASE LIST
    // --------------------------------------------------

    caseList.innerHTML =
        casesToDisplay
            .map(
                caseFile => {

                    const status =
                        String(
                            caseFile.status || ''
                        )
                        .trim()
                        .toLowerCase();


                    const statusClass =
                        status === 'closed'
                            ? 'status closed'
                            : 'status';


                    const statusText =
                        caseFile.status ||
                        'Active';


                    return `
                        <div
                            class="case-row"
                            onclick="window.location.href='case.html?id=${encodeURIComponent(caseFile.id)}'"
                        >

                            <div>

                                <div class="case-name">
                                    ${escapeHtml(
                                        caseFile.case_name ||
                                        'Unnamed Case'
                                    )}
                                </div>

                                <div class="case-number">
                                    ${escapeHtml(
                                        caseFile.case_number ||
                                        'No Case Number'
                                    )}
                                </div>

                            </div>

                            <div class="${statusClass}">
                                ${escapeHtml(
                                    statusText
                                )}
                            </div>

                        </div>
                    `;

                }
            )
            .join('');

}


// ======================================================
// LOAD INTEL COUNTS
// ======================================================

async function loadIntelCounts(
    userId
) {

    const {
        data: officer,
        error: officerError
    } = await supabaseClient

        .from('officers')

        .select(
            'role, active'
        )

        .eq(
            'id',
            userId
        )

        .single();


    if (officerError) {

        console.error(
            'Load officer role error:',
            officerError
        );

        return;

    }


    const role =
        String(
            officer.role || ''
        )
        .trim()
        .toLowerCase();


    const fullIntelAccessRoles = [
        'master',
        'investigator',
        'case_lead'
    ];


    const hasFullIntelAccess =
        fullIntelAccessRoles.includes(
            role
        );


    let intelQuery =
        supabaseClient

            .from(
                'intel_submissions'
            )

            .select(
                'id, intel_group_id, recipient_id'
            );


    if (
        !hasFullIntelAccess
    ) {

        intelQuery =
            intelQuery.eq(
                'recipient_id',
                userId
            );

    }


    const {
        data: intelData,
        error: intelError
    } = await intelQuery;


    if (intelError) {

        console.error(
            'Load Intel records error:',
            intelError
        );

        document
            .getElementById('newIntel')
            .textContent =
                '0';

        document
            .getElementById('openIntel')
            .textContent =
                '0';

        document
            .getElementById('newIntelCard')
            .classList.remove(
                'has-new-intel'
            );

        return;

    }


    const intel =
        intelData || [];


    let nonScuNewCount = 0;


    if (
        hasFullIntelAccess
    ) {

        const {
            data: nonScuData,
            error: nonScuError
        } = await supabaseClient

            .from(
                'non_scu_intel_submissions'
            )

            .select(
                'id'
            )

            .eq(
                'status',
                'unassigned'
            );


        if (nonScuError) {

            console.error(
                'Load NON-SCU Intel counts error:',
                nonScuError
            );

        } else {

            nonScuNewCount =
                (nonScuData || []).length;

        }

    }


    const intelGroups =
        new Map();


    intel.forEach(
        item => {

            const groupId =
                item.intel_group_id ||
                item.id;


            if (
                !intelGroups.has(
                    groupId
                )
            ) {

                intelGroups.set(
                    groupId,
                    []
                );

            }


            intelGroups
                .get(groupId)
                .push(item);

        }
    );


    const canonicalGroups =
        [];


    intelGroups.forEach(
        groupRows => {

            const ownIntelRecord =
                groupRows.find(
                    row =>
                        row.recipient_id ===
                        userId
                ) || null;


            const canonicalRecord =
                ownIntelRecord ||
                groupRows[0];


            if (
                canonicalRecord
            ) {

                canonicalGroups.push({

                    groupRows:
                        groupRows,

                    canonicalId:
                        canonicalRecord.id

                });

            }

        }
    );


    let viewedIds =
        new Set();


    const allIntelIds =
        intel.map(
            row =>
                row.id
        );


    if (
        allIntelIds.length > 0
    ) {

        const {
            data: viewData,
            error: viewError
        } = await supabaseClient

            .from('intel_views')

            .select(
                'intel_id'
            )

            .eq(
                'user_id',
                userId
            )

            .in(
                'intel_id',
                allIntelIds
            );


        if (viewError) {

            console.error(
                'Load Intel views error:',
                viewError
            );

            return;

        }


        viewedIds =
            new Set(
                (viewData || [])
                    .map(
                        view =>
                            view.intel_id
                    )
            );

    }


    let newCount = 0;


    let openCount =
        canonicalGroups.length;


    canonicalGroups.forEach(
        group => {

            const groupHasBeenViewed =
                group.groupRows.some(
                    row =>
                        viewedIds.has(
                            row.id
                        )
                );


            if (
                !groupHasBeenViewed
            ) {

                newCount++;

            }

        }
    );


    newCount +=
        nonScuNewCount;


    openCount +=
        nonScuNewCount;


    document
        .getElementById('newIntel')
        .textContent =
            newCount;


    document
        .getElementById('openIntel')
        .textContent =
            openCount;


    const newIntelCard =
        document.getElementById(
            'newIntelCard'
        );


    if (
        newCount > 0
    ) {

        newIntelCard.classList.add(
            'has-new-intel'
        );

    } else {

        newIntelCard.classList.remove(
            'has-new-intel'
        );

    }


    console.log(
        'Intel counts:',
        {
            newIntel:
                newCount,

            openIntel:
                openCount,

            total:
                intelGroups.size +
                nonScuNewCount,

            scuIntelGroups:
                intelGroups.size,

            nonScuNewIntel:
                nonScuNewCount,

            viewedIntelGroups:
                canonicalGroups.filter(
                    group =>
                        viewedIds.has(
                            group.canonicalId
                        )
                ).length,

            fullIntelAccess:
                hasFullIntelAccess,

            role:
                role
        }
    );

}


// ======================================================
// HTML SECURITY
// ======================================================

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}

<!DOCTYPE html>
<html lang="en">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCU Case Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e8edf2;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: #111821;
            border: 1px solid #293542;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: 2px;
        }

        .logo p {
            margin: 8px 0 0;
            color: #7f8c99;
            font-size: 12px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aeb9c4;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #303c48;
            border-radius: 6px;
            background: #0b1117;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #667788;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 6px;
            background: #263746;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #32495c;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #596673;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <h1>SCU CASE MANAGEMENT</h1>
            <p>STREET CRIMES UNIT</p>
        </div>

        <form>

            <label for="email">Officer Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                SECURE LOGIN
            </button>

        </form>

        <div class="footer">
            AUTHORISED PERSONNEL ONLY
        </div>

    </div>
<script>
    const SUPABASE_URL = 'https://mtlozyseibrefhxnocvb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
</script>
    <script>
    const loginForm = document.querySelector('form');

    loginForm.addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert('LOGIN FAILED: ' + error.message);
            return;
        }

        alert('LOGIN SUCCESSFUL');

        window.location.href = 'dashboard.html';
    });
</script>
</body>
</html>

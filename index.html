<div class="login-box">

    <div class="logo">
        <h1>SCU CASE MANAGEMENT</h1>
        <p>STREET CRIMES UNIT</p>
    </div>

    <form id="loginForm">

        <label for="username">In-City Name</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your in-city name"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            SECURE LOGIN
        </button>

    </form>

    <div class="footer">
        AUTHORISED PERSONNEL ONLY
    </div>

</div>

<script>

    /* =========================
       SUPABASE CONFIGURATION
    ========================= */

    const SUPABASE_URL =
        'https://mtlozyseibrefhxnocvb.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


    /* =========================
       CHECK SUPABASE LOADED
    ========================= */

    if (!window.supabase) {

        alert(
            'SYSTEM ERROR\n\n' +
            'The SCU database service could not be loaded.\n\n' +
            'Please refresh the page and try again.'
        );

        throw new Error('Supabase library failed to load.');
    }


    /* =========================
       CREATE SUPABASE CLIENT
    ========================= */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       LOGIN FORM
    ========================= */

    const loginForm =
        document.getElementById('loginForm');

    const loginButton =
        document.getElementById('loginButton');


    loginForm.addEventListener(
        'submit',
        async function (event) {

            event.preventDefault();


            /* Prevent double-clicks */
            loginButton.disabled = true;
            loginButton.textContent = 'VERIFYING...';


            try {

                const username =
                    document
                        .getElementById('username')
                        .value
                        .trim();

                const password =
                    document
                        .getElementById('password')
                        .value;


                /* =========================
                   FIND OFFICER EMAIL
                ========================= */

                const {
                    data: loginEmail,
                    error: lookupError
                } = await supabaseClient.rpc(
                    'get_login_email',
                    {
                        p_username: username
                    }
                );


                if (lookupError) {

                    console.error(
                        'LOGIN EMAIL LOOKUP ERROR:',
                        lookupError
                    );

                    alert(
                        'LOGIN FAILED\n\n' +
                        'Unable to verify officer account.'
                    );

                    return;
                }


                if (!loginEmail) {

                    alert(
                        'LOGIN FAILED\n\n' +
                        'In-city name not found, or the officer account is inactive.'
                    );

                    return;
                }


                /* =========================
                   SUPABASE AUTH LOGIN
                ========================= */

                const {
                    data,
                    error
                } = await supabaseClient.auth
                    .signInWithPassword({
                        email: loginEmail,
                        password: password
                    });


                if (error) {

                    console.error(
                        'AUTH LOGIN ERROR:',
                        error
                    );

                    alert(
                        'LOGIN FAILED\n\n' +
                        error.message
                    );

                    return;
                }


                /* =========================
                   CHECK OFFICER PROFILE
                ========================= */

                const {
                    data: officer,
                    error: officerError
                } = await supabaseClient
                    .from('officers')
                    .select('active')
                    .eq('id', data.user.id)
                    .single();


                if (officerError || !officer) {

                    console.error(
                        'OFFICER PROFILE ERROR:',
                        officerError
                    );

                    await supabaseClient.auth.signOut();

                    alert(
                        'OFFICER PROFILE NOT FOUND'
                    );

                    return;
                }


                /* =========================
                   CHECK ACCOUNT ACTIVE
                ========================= */

                if (!officer.active) {

                    await supabaseClient.auth.signOut();

                    alert(
                        'ACCESS DENIED\n\n' +
                        'Your SCU account has been deactivated.\n\n' +
                        'Please contact a Master if you believe this is an error.'
                    );

                    return;
                }


                /* =========================
                   SUCCESS
                ========================= */

                window.location.href =
                    'dashboard.html';

            }

            catch (error) {

                console.error(
                    'UNEXPECTED LOGIN ERROR:',
                    error
                );

                alert(
                    'LOGIN FAILED\n\n' +
                    'An unexpected system error occurred.\n\n' +
                    'Please try again.'
                );

            }

            finally {

                loginButton.disabled = false;
                loginButton.textContent = 'SECURE LOGIN';

            }

        }
    );

</script>

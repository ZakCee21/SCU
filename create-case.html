<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create SCU Case</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;
            background: #111820;
            border-bottom: 1px solid #26313c;
            padding: 0 30px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 11px;
            color: #6f7c88;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .master {
            color: #7dd3fc;
            font-size: 13px;
        }

        .header-right {
            margin-left: auto;
        }

        .back-button-container {
            max-width: 900px;
            margin: 20px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .back-button {
            background: #111820;
            color: #cfd7df;
            border: 1px solid #354554;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            background: #1a2530;
            border-color: #4b6070;
        }

        /* =========================
           BACKGROUND LOGOS
        ========================= */

        .background-logo {
            position: fixed;
            top: 50%;
            width: 275px;
            height: 275px;
            object-fit: contain;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .background-logo-left {
            left: 80px;
            transform: translateY(-50%);
        }

        .background-logo-right {
            right: 80px;
            transform: translateY(-50%);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .panel {
            background: #111820;
            border: 1px solid #26313c;
            border-radius: 8px;
            padding: 30px;
        }

        h2 {
            margin-top: 0;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: #0b0f14;
            color: white;
            border: 1px solid #374151;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        /* =========================
           OFFICERS
        ========================= */

        .officers {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .agent-column {
            flex: 1;
            min-width: 250px;
            border: 1px solid #26313c;
            border-radius: 5px;
            overflow: hidden;
            background: #0b0f14;
        }

        .agent-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid #26313c;
            cursor: pointer;
            margin: 0;
            text-transform: none;
            color: #e6edf3;
            font-size: 13px;
        }

        .agent-option:last-child {
            border-bottom: none;
        }

        .agent-option:hover {
            background: #111820;
        }

        .agent-option input {
            width: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .agent-info {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .agent-name {
            color: #e6edf3;
            font-size: 13px;
        }

        .agent-callsign {
            color: #e6edf3;
            font-weight: bold;
        }

        .agent-rank {
            color: #6f7c88;
        }

        .no-officers {
            width: 100%;
            padding: 14px;
            border: 1px solid #26313c;
            border-radius: 5px;
            color: #6f7c88;
            font-size: 13px;
            background: #0b0f14;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .create {
            background: #1d4ed8;
            color: white;
            flex: 1;
        }

        .create:hover {
            background: #2563eb;
        }

        .cancel {
            background: #374151;
            color: white;
        }

        .cancel:hover {
            background: #4b5563;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            header {
                padding: 0 15px;
            }

            .header-logo {
                width: 42px;
                height: 42px;
            }

            .header-brand {
                gap: 10px;
            }

            .header-title {
                font-size: 16px;
            }

            .header-subtitle {
                font-size: 9px;
            }

            main {
                padding: 0 12px;
                margin: 20px auto;
            }

            .panel {
                padding: 20px;
            }

            .background-logo {
                width: 130px;
                height: 130px;
                opacity: 0.25;
            }

            .background-logo-left {
                left: -45px;
            }

            .background-logo-right {
                right: -45px;
            }

            .buttons {
                flex-direction: column;
            }

            .create {
                order: 1;
            }

            .cancel {
                order: 2;
            }

            .agent-column {
                min-width: 240px;
            }

        }

    </style>

</head>

<body>


<!-- =========================
     BACKGROUND LOGO - LEFT
========================= -->

<img
    class="background-logo background-logo-left"
    src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
    alt=""
>


<!-- =========================
     BACKGROUND LOGO - RIGHT
========================= -->

<img
    class="background-logo background-logo-right"
    src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
    alt=""
>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-brand">

        <img
            class="header-logo"
            src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp"
            alt="SCU Logo"
        >

        <div class="header-left">

            <div class="header-title">
                SCU CASE MANAGEMENT
            </div>

            <div class="header-subtitle">
                SPECIAL CONSTABULARY UNIT
            </div>

        </div>

    </div>


    <div class="header-right">

        <span class="master">
            AUTHORISED PERSONNEL
        </span>

    </div>

</header>


<div class="back-button-container">

    <button
        type="button"
        class="back-button"
        onclick="window.location.href='dashboard.html'"
    >
        ← BACK TO DASHBOARD
    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<main>

    <div class="panel">

        <h2>
            CREATE NEW CASE
        </h2>

        <div class="subtitle">
            Create an active SCU investigation and select which officers can access it.
        </div>


        <form id="caseForm">


            <!-- CASE NAME -->

            <label for="caseName">
                Case Name
            </label>

            <input
                type="text"
                id="caseName"
                placeholder="e.g. Operation Nightfall"
                required
            >


            <!-- DESCRIPTION -->

            <label for="description">
                Initial Case Information
            </label>

            <textarea
                id="description"
                placeholder="Enter the initial case information..."
            ></textarea>


            <!-- CLASSIFICATION -->

            <label for="classification">
                Classification
            </label>

            <select id="classification">

                <option value="CONFIDENTIAL">
                    CONFIDENTIAL
                </option>

                <option value="RESTRICTED">
                    RESTRICTED
                </option>

                <option value="SENSITIVE">
                    SENSITIVE
                </option>

                <option value="TOP SECRET">
                    TOP SECRET
                </option>

            </select>


            <!-- OFFICER ACCESS -->

            <label>
                Officers With Access
            </label>

            <div
                class="officers"
                id="officerList"
            >
                Loading officers...
            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="button"
                    class="cancel"
                    onclick="window.location.href='dashboard.html'"
                >
                    CANCEL
                </button>

                <button
                    type="submit"
                    class="create"
                >
                    CREATE CASE
                </button>

            </div>

        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>

    </div>

</main>


<script>

const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


/* =========================
   INITIALISE
========================= */

async function initialise() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'index.html';

        return;

    }


    currentUser =
        session.user;


    loadOfficers();

}


/* =========================
   LOAD OFFICERS
========================= */

async function loadOfficers() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from('officers')
            .select(
                'id, callsign, full_name, rank, portal_title'
            );


    const list =
        document.getElementById(
            'officerList'
        );


    if (error) {

        list.innerHTML =
            '<div class="no-officers">Unable to load officers.</div>';

        console.error(
            error
        );

        return;

    }


    if (!data || data.length === 0) {

        list.innerHTML =
            '<div class="no-officers">No officers found.</div>';

        return;

    }


    /* =========================
       RANK ORDER
    ========================= */

    const rankOrder = {

        'Head of SCU': 1,

        'Assistant Head of SCU': 2,

        'Head of Weapons': 3,

        'Head of Drugs': 4,

        'Detective': 5

    };


    /* =========================
       FILTER OFFICERS
    ========================= */

    const officers =
        data
            .filter(
                officer => {

                    const portalTitle =
                        (officer.portal_title || '').trim();

                    return (
                        officer.id !== currentUser.id
                        &&
                        portalTitle !== 'GOV'
                        &&
                        portalTitle !== 'High Command'
                    );

                }
            )
            .sort(
                (a, b) => {

                    const rankA =
                        rankOrder[a.portal_title] ||
                        rankOrder[a.rank] ||
                        99;

                    const rankB =
                        rankOrder[b.portal_title] ||
                        rankOrder[b.rank] ||
                        99;

                    if (rankA !== rankB) {

                        return rankA - rankB;

                    }

                    return (
                        (a.callsign || '')
                            .localeCompare(
                                b.callsign || ''
                            )
                    );

                }
            );


    if (officers.length === 0) {

        list.innerHTML =
            '<div class="no-officers">No selectable officers found.</div>';

        return;

    }


    /* =========================
       8 OFFICERS PER COLUMN
    ========================= */

    const columns = [];

    for (
        let i = 0;
        i < officers.length;
        i += 8
    ) {

        columns.push(
            officers.slice(
                i,
                i + 8
            )
        );

    }


    /* =========================
       BUILD OFFICER LIST
    ========================= */

    list.innerHTML =
        columns
            .map(
                column => `

                    <div class="agent-column">

                        ${column
                            .map(
                                officer => `

                                    <label class="agent-option">

                                        <input
                                            type="checkbox"
                                            value="${escapeHtml(
                                                officer.id
                                            )}"
                                            class="officer-checkbox"
                                        >

                                        <div class="agent-info">

                                            <span class="agent-callsign">
                                                ${escapeHtml(
                                                    officer.callsign ||
                                                    'UNASSIGNED'
                                                )}
                                            </span>

                                            <span class="agent-rank">
                                                —
                                                ${escapeHtml(
                                                    officer.portal_title ||
                                                    officer.rank ||
                                                    'Officer'
                                                )}
                                            </span>

                                            <span class="agent-name">
                                                —
                                                ${escapeHtml(
                                                    officer.full_name ||
                                                    ''
                                                )}
                                            </span>

                                        </div>

                                    </label>

                                `
                            )
                            .join('')}

                    </div>

                `
            )
            .join('');

}


/* =========================
   CREATE CASE
========================= */

document
    .getElementById('caseForm')
    .addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            const caseName =
                document.getElementById(
                    'caseName'
                )
                .value
                .trim();


            const description =
                document.getElementById(
                    'description'
                )
                .value
                .trim();


            const classification =
                document.getElementById(
                    'classification'
                )
                .value;


            const selectedOfficers =
                Array.from(
                    document.querySelectorAll(
                        '.officer-checkbox:checked'
                    )
                )
                .map(
                    checkbox =>
                        checkbox.value
                );


            /*
             * Create the case securely
             * through Supabase.
             */

            const {
                data: newCaseId,
                error: caseError
            } =
                await supabaseClient.rpc(
                    'create_case',
                    {

                        p_case_name:
                            caseName,

                        p_description:
                            description,

                        p_classification:
                            classification,

                        p_officer_ids:
                            selectedOfficers

                    }
                );


            if (caseError) {

                showMessage(
                    'CASE CREATION FAILED: '
                    +
                    caseError.message
                );


                console.error(
                    caseError
                );


                return;

            }


            showMessage(
                'CASE CREATED SUCCESSFULLY'
            );


            setTimeout(
                () => {

                    window.location.href =
                        'dashboard.html';

                },
                1200
            );

        }
    );


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    const message =
        document.getElementById(
            'message'
        );


    message.textContent =
        text;


    message.style.display =
        'block';

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================
   START
========================= */

initialise();

</script>

</body>

</html>

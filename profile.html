<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account - SCU</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080c11;
            color: #e8edf2;
        }

        .header {
            background: #111821;
            border-bottom: 1px solid #293542;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section {
            background: #111821;
            border: 1px solid #293542;
            border-radius: 10px;
            padding: 30px;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            color: #aeb9c4;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #303c48;
            border-radius: 6px;
            background: #0b1117;
            color: white;
            font-size: 14px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 6px;
            background: #263746;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #32495c;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 13px;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            display: none;
            border-radius: 6px;
            background: #17212b;
            border: 1px solid #293542;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>SCU CASE MANAGEMENT</h1>
    </div>

    <div class="container">

        <a href="dashboard.html" class="back">
            ← BACK TO DASHBOARD
        </a>

        <div class="section">

            <h2>MY ACCOUNT</h2>

            <p style="color:#7f8c99;">
                Change your SCU login password.
            </p>

            <form id="passwordForm">

                <label for="newPassword">
                    NEW PASSWORD
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">
                    CONFIRM NEW PASSWORD
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <button type="submit">
                    UPDATE PASSWORD
                </button>

            </form>

            <div id="message" class="message"></div>

        </div>

    </div>
    <script>
    const SUPABASE_URL = 'https://mtlozyseibrefhxnocvb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
</script>

</body>

</html>

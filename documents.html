<body>

    <div class="header">
        <div>
            <h1>SCU DOCUMENTS & TEMPLATES</h1>
            <p>Serious Crime Unit — Internal Resources</p>
        </div>

        <button class="back-button" onclick="goBack()">
            ← Back
        </button>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Documents & Templates</h2>
            <p>Access SCU documents, forms and operational templates.</p>
        </div>

        <div id="status" class="status"></div>

        <!-- MASTER ONLY -->
        <div id="adminControls" class="admin-controls">

            <button class="add-button" onclick="toggleAddForm()">
                + Upload Document
            </button>

            <div id="addForm" class="add-form">

                <h3>Upload New Document</h3>

                <div class="form-group">
                    <label for="documentTitle">
                        Document Title
                    </label>

                    <input
                        type="text"
                        id="documentTitle"
                        placeholder="e.g. Intelligence Report Template"
                    >
                </div>

                <div class="form-group">
                    <label for="documentDescription">
                        Description
                    </label>

                    <textarea
                        id="documentDescription"
                        placeholder="Brief description of the document..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="documentFile">
                        Document File
                    </label>

                    <input
                        type="file"
                        id="documentFile"
                    >
                </div>

                <div class="form-buttons">

                    <button
                        class="save-button"
                        onclick="uploadDocument()"
                    >
                        Upload Document
                    </button>

                    <button
                        class="cancel-button"
                        onclick="toggleAddForm()"
                    >
                        Cancel
                    </button>

                </div>

            </div>
        </div>

        <div id="documents" class="documents">

            <div class="loading">
                Loading documents...
            </div>

        </div>

    </div>


    <script>

        /*
        ============================================================
        SUPABASE CONFIGURATION
        ============================================================

        PUT THE SAME SUPABASE URL AND ANON KEY HERE THAT YOU USE
        ON YOUR OTHER SCU PAGES.
        */

        const SUPABASE_URL = "https://mtlozyseibrefhxnocvb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        /*
        ============================================================
        SETTINGS
        ============================================================
        */

        const DOCUMENTS_TABLE = "documents";

        /*
        IMPORTANT:

        This is the Supabase Storage bucket where the uploaded files
        are stored.

        If your existing bucket has a different name, change this.
        */
        const STORAGE_BUCKET = "documents";


        /*
        ============================================================
        USER / ROLE
        ============================================================
        */

        let currentUser = null;
        let currentRole = null;


        /*
        ============================================================
        INITIALISE
        ============================================================
        */

        document.addEventListener("DOMContentLoaded", async function () {

            await getCurrentUser();

            await loadDocuments();

        });


        /*
        ============================================================
        GET CURRENT USER
        ============================================================
        */

        async function getCurrentUser() {

            try {

                const {
                    data: {
                        user
                    },
                    error
                } = await supabaseClient.auth.getUser();

                if (error) {
                    console.error(error);
                    return;
                }

                currentUser = user;

                if (!user) {
                    showError("You are not logged in.");
                    return;
                }


                /*
                ----------------------------------------------------
                GET USER ROLE
                ----------------------------------------------------

                This expects your user profile table to contain:

                id
                role

                If your existing SCU portal uses a different table,
                keep the role logic from your existing page here.
                */

                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .select("role")
                    .eq("id", user.id)
                    .single();


                if (!profileError && profile) {

                    currentRole = profile.role;

                }


                /*
                ----------------------------------------------------
                MASTER ACCESS
                ----------------------------------------------------
                */

                if (
                    currentRole &&
                    currentRole.toLowerCase() === "master"
                ) {

                    document.getElementById("adminControls").style.display = "block";

                }

            } catch (error) {

                console.error("User error:", error);

            }

        }


        /*
        ============================================================
        LOAD DOCUMENTS
        ============================================================
        */

        async function loadDocuments() {

            const container =
                document.getElementById("documents");

            container.innerHTML =
                '<div class="loading">Loading documents...</div>';


            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from(DOCUMENTS_TABLE)
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


                if (error) {

                    console.error("Documents error:", error);

                    showError(
                        "Unable to load documents. Check the browser console for details."
                    );

                    container.innerHTML =
                        '<div class="empty">Unable to load documents.</div>';

                    return;

                }


                if (!data || data.length === 0) {

                    container.innerHTML =
                        '<div class="empty">No documents have been uploaded yet.</div>';

                    return;

                }


                container.innerHTML = "";


                data.forEach(function (document) {

                    const card =
                        createDocumentCard(document);

                    container.appendChild(card);

                });


            } catch (error) {

                console.error(error);

                container.innerHTML =
                    '<div class="empty">Unable to load documents.</div>';

                showError(
                    "An unexpected error occurred while loading the documents."
                );

            }

        }


        /*
        ============================================================
        CREATE DOCUMENT CARD
        ============================================================
        */

        function createDocumentCard(document) {

            const card =
                document.createElement
                ? document.createElement("div")
                : null;

            const element =
                document.ownerDocument
                ? document.ownerDocument.createElement("div")
                : window.document.createElement("div");


            element.className = "document-card";


            const title =
                escapeHtml(
                    document.title ||
                    document.name ||
                    "Untitled Document"
                );


            const description =
                escapeHtml(
                    document.description ||
                    "SCU document."
                );


            let fileUrl =
                document.file_url ||
                document.url ||
                "";


            /*
            If the database stores a storage path rather than
            a complete URL, create a public URL.
            */

            if (
                !fileUrl &&
                document.file_path
            ) {

                const {
                    data
                } = supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(document.file_path);

                fileUrl =
                    data.publicUrl;

            }


            if (
                !fileUrl &&
                document.storage_path
            ) {

                const {
                    data
                } = supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(document.storage_path);

                fileUrl =
                    data.publicUrl;

            }


            let buttons = "";


            if (fileUrl) {

                buttons += `
                    <a
                        href="${escapeAttribute(fileUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="open-button"
                    >
                        Open Document
                    </a>
                `;

            }


            /*
            MASTER DELETE BUTTON
            */

            if (
                currentRole &&
                currentRole.toLowerCase() === "master"
            ) {

                buttons += `
                    <button
                        class="delete-button"
                        onclick="deleteDocument('${escapeAttribute(
                            document.id || ""
                        )}', '${escapeAttribute(
                            document.file_path ||
                            document.storage_path ||
                            ""
                        )}')"
                    >
                        Delete
                    </button>
                `;

            }


            element.innerHTML = `

                <h3>${title}</h3>

                <p>${description}</p>

                <div class="document-actions">

                    ${buttons}

                </div>

            `;


            return element;

        }


        /*
        ============================================================
        UPLOAD DOCUMENT
        ============================================================
        */

        async function uploadDocument() {

            if (
                !currentRole ||
                currentRole.toLowerCase() !== "master"
            ) {

                showError(
                    "Only Master users can upload documents."
                );

                return;

            }


            const title =
                document.getElementById(
                    "documentTitle"
                ).value.trim();


            const description =
                document.getElementById(
                    "documentDescription"
                ).value.trim();


            const fileInput =
                document.getElementById(
                    "documentFile"
                );


            const file =
                fileInput.files[0];


            if (!title) {

                showError(
                    "Please enter a document title."
                );

                return;

            }


            if (!file) {

                showError(
                    "Please select a document to upload."
                );

                return;

            }


            try {

                showSuccess(
                    "Uploading document..."
                );


                /*
                Create a unique file name
                */

                const fileName =
                    Date.now() +
                    "_" +
                    file.name.replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


                const filePath =
                    fileName;


                /*
                Upload file to Supabase Storage
                */

                const {
                    error: uploadError
                } = await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .upload(
                        filePath,
                        file,
                        {
                            upsert: false
                        }
                    );


                if (uploadError) {

                    console.error(uploadError);

                    showError(
                        "File upload failed: " +
                        uploadError.message
                    );

                    return;

                }


                /*
                Get public URL
                */

                const {
                    data: publicData
                } = supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(filePath);


                const fileUrl =
                    publicData.publicUrl;


                /*
                Save document details
                */

                const {
                    error: databaseError
                } = await supabaseClient
                    .from(DOCUMENTS_TABLE)
                    .insert([{

                        title: title,

                        description: description,

                        file_url: fileUrl,

                        file_path: filePath

                    }]);


                if (databaseError) {

                    console.error(databaseError);


                    /*
                    If database insertion fails,
                    remove the uploaded file so we don't
                    leave an orphaned file in Storage.
                    */

                    await supabaseClient
                        .storage
                        .from(STORAGE_BUCKET)
                        .remove([
                            filePath
                        ]);


                    showError(
                        "Document could not be saved: " +
                        databaseError.message
                    );

                    return;

                }


                /*
                Clear form
                */

                document.getElementById(
                    "documentTitle"
                ).value = "";


                document.getElementById(
                    "documentDescription"
                ).value = "";


                fileInput.value = "";


                document.getElementById(
                    "addForm"
                ).style.display = "none";


                showSuccess(
                    "Document uploaded successfully."
                );


                await loadDocuments();


            } catch (error) {

                console.error(error);

                showError(
                    "An unexpected error occurred while uploading."
                );

            }

        }


        /*
        ============================================================
        DELETE DOCUMENT
        ============================================================
        */

        async function deleteDocument(
            documentId,
            filePath
        ) {

            if (
                !currentRole ||
                currentRole.toLowerCase() !== "master"
            ) {

                showError(
                    "Only Master users can delete documents."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this document?\n\nThis cannot be undone."
                );


            if (!confirmed) {
                return;
            }


            try {

                showSuccess(
                    "Deleting document..."
                );


                /*
                Delete file from Storage
                */

                if (filePath) {

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from(STORAGE_BUCKET)
                        .remove([
                            filePath
                        ]);


                    if (storageError) {

                        console.error(
                            "Storage delete error:",
                            storageError
                        );

                    }

                }


                /*
                Delete database record
                */

                const {
                    error: databaseError
                } = await supabaseClient
                    .from(DOCUMENTS_TABLE)
                    .delete()
                    .eq(
                        "id",
                        documentId
                    );


                if (databaseError) {

                    console.error(
                        databaseError
                    );

                    showError(
                        "The document could not be deleted: " +
                        databaseError.message
                    );

                    return;

                }


                showSuccess(
                    "Document deleted successfully."
                );


                await loadDocuments();


            } catch (error) {

                console.error(error);

                showError(
                    "An unexpected error occurred while deleting."
                );

            }

        }


        /*
        ============================================================
        SHOW / HIDE ADD FORM
        ============================================================
        */

        function toggleAddForm() {

            const form =
                document.getElementById(
                    "addForm"
                );


            if (
                form.style.display === "block"
            ) {

                form.style.display = "none";

            } else {

                form.style.display = "block";

            }

        }


        /*
        ============================================================
        BACK BUTTON
        ============================================================
        */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


        /*
        ============================================================
        STATUS MESSAGES
        ============================================================
        */

        function showError(message) {

            const status =
                document.getElementById(
                    "status"
                );


            status.className =
                "status error";


            status.textContent =
                message;


            setTimeout(function () {

                status.className =
                    "status";

            }, 6000);

        }


        function showSuccess(message) {

            const status =
                document.getElementById(
                    "status"
                );


            status.className =
                "status success";


            status.textContent =
                message;


            setTimeout(function () {

                status.className =
                    "status";

            }, 5000);

        }


        /*
        ============================================================
        HTML SAFETY
        ============================================================
        */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }

    </script>

</body>
</html>

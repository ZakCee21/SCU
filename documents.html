<style>

        max-width: 700px;
    }

    .add-form h3 {
        margin: 0 0 18px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 12px;

        color: #aeb8c2;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        background: #080c11;

        border: 1px solid #354554;

    .form-buttons {

        background: #1d4ed8;

    .save-button:hover {
        background: #2563eb;

    .cancel-button {
        background: #202c38;
        color: white;
        border: 1px solid #354554;
        padding: 10px 16px;
        border-radius: 5px;
        cursor: pointer;
    }

    /* DOCUMENTS */

    .documents {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
    }

    .document-card {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;
        padding: 22px;
    }

    .document-card h3 {
        margin: 0 0 10px;
        font-size: 17px;
    }

    .document-card p {
        color: #8996a3;

        line-height: 1.5;
        margin-bottom: 20px;
    }

    .document-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .open-button {
        display: inline-block;
        background: #1d4ed8;
        color: white;

        padding: 10px 15px;

        font-weight: bold;
    }

    .open-button:hover {
        background: #2563eb;
    }

    .delete-button {
        background: #7f1d1d;
        color: white;

        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
    }

    .delete-button:hover {
        background: #991b1b;
    }

    .empty {
        background: #111821;
        border: 1px solid #293542;
        border-radius: 8px;

        text-align: center;

</style>

<main class="container">

```
<section class="welcome">

    <h2>
        Documents & Templates
    </h2>

    <p>
        Official SCU documents, forms and operational templates.
    </p>

</section>


<!-- MASTER ONLY -->

<section
    class="admin-controls"
    id="adminControls"
>

    <button
        class="add-button"
        onclick="toggleAddForm()"
    >
        + ADD DOCUMENT
    </button>


    <div
        class="add-form"
        id="addForm"
    >

        <h3>
            Add Document
        </h3>


        <div class="form-group">

            <label for="documentTitle">
                Document Title
            </label>

            <input
                type="text"
                id="documentTitle"
                placeholder="e.g. Intel Report Template"
            >

        </div>


        <div class="form-group">

            <label for="documentDescription">
                Description
            </label>

            <textarea
                id="documentDescription"
                placeholder="Brief description of the document..."
            ></textarea>

        </div>


        <div class="form-group">

            <label for="documentUrl">
                Document Link
            </label>

            <input
                type="url"
                id="documentUrl"
                placeholder="https://..."
            >

        </div>


        <div class="form-buttons">

            <button
                class="save-button"
                onclick="addDocument()"
            >
                ADD DOCUMENT
            </button>


            <button
                class="cancel-button"
                onclick="toggleAddForm()"
            >
                CANCEL
            </button>

        </div>


        <div
            class="message"
            id="formMessage"
        ></div>

    </div>

</section>


<!-- DOCUMENT LIST -->

<section class="documents">

    <div class="empty">

        Loading documents...

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
    'https://mtlozyseibrefhxnocvb.supabase.co';


const SUPABASE_KEY =
    'sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let isMaster = false;


// ======================================================
// CHECK LOGIN
// ======================================================

async function checkLogin() {


    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href = 'index.html';

        return;

    }


    const userId =
        session.user.id;


    console.log(
        'Logged in user:',
        userId
    );


    // Get officer information

    const {
        data: officer,
        error
    } = await supabaseClient

        .from('officers')

        .select('role, active')

        .eq('id', userId)

        .maybeSingle();


    console.log(
        'Officer:',
        officer
    );


    console.log(
        'Officer error:',
        error
    );


    if (error) {

        console.error(
            'Error checking officer:',
            error
        );

    }


    // Check Master status

    if (officer) {

        isMaster =
            String(officer.role).toLowerCase() === 'master'
            &&
            officer.active === true;

    }


    console.log(
        'Is Master:',
        isMaster
    );


    // Show Master controls

    if (isMaster) {

        document
            .getElementById('adminControls')
            .style.display = 'block';

    }


    // Load documents

    loadDocuments();

}


// ======================================================
// SHOW / HIDE ADD FORM
// ======================================================

function toggleAddForm() {


    const form =
        document.getElementById('addForm');


    if (
        form.style.display === 'block'
    ) {

        form.style.display = 'none';

    } else {

        form.style.display = 'block';

    }

}


// ======================================================
// ADD DOCUMENT
// ======================================================

async function addDocument() {


    if (!isMaster) {

        alert(
            'You do not have permission to add documents.'
        );

        return;

    }


    const title =
        document
            .getElementById('documentTitle')
            .value
            .trim();


    const description =
        document
            .getElementById('documentDescription')
            .value
            .trim();


    const url =
        document
            .getElementById('documentUrl')
            .value
            .trim();


    const message =
        document
            .getElementById('formMessage');


    if (!title) {

        message.style.color =
            '#f87171';

        message.textContent =
            'Please enter a document title.';

        return;

    }


    if (!url) {

        message.style.color =
            '#f87171';

        message.textContent =
            'Please enter a document link.';

        return;

    }


    message.style.color =
        '#aeb8c2';

    message.textContent =
        'Adding document...';


    const {
        error
    } = await supabaseClient

        .from('documents')

        .insert({

            title: title,

            description: description,

            url: url

        });


    if (error) {

        console.error(
            'Add document error:',
            error
        );


        message.style.color =
            '#f87171';

        message.textContent =
            'Unable to add document: ' +
            error.message;

        return;

    }


    message.style.color =
        '#4ade80';

    message.textContent =
        'Document added successfully.';


    // Clear form

    document
        .getElementById('documentTitle')
        .value = '';


    document
        .getElementById('documentDescription')
        .value = '';


    document
        .getElementById('documentUrl')
        .value = '';


    // Reload list

    await loadDocuments();


    setTimeout(
        () => {

            document
                .getElementById('addForm')
                .style.display = 'none';

            message.textContent = '';

        },
        800
    );

}


// ======================================================
// DELETE DOCUMENT
// ======================================================

async function deleteDocument(id) {


    if (!isMaster) {

        alert(
            'You do not have permission to delete documents.'
        );

        return;

    }


    const confirmed =
        confirm(
            'Are you sure you want to delete this document?'
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } = await supabaseClient

        .from('documents')

        .delete()

        .eq('id', id);


    if (error) {

        console.error(
            'Delete document error:',
            error
        );


        alert(
            'Unable to delete document: ' +
            error.message
        );

        return;

    }


    await loadDocuments();

}


// ======================================================
// LOAD DOCUMENTS
// ======================================================

async function loadDocuments() {


    const {
        data,
        error
    } = await supabaseClient

        .from('documents')

        .select('*')

        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            'Load documents error:',
            error
        );


        document
            .querySelector('.documents')
            .innerHTML = `

                <div class="empty">

                    Unable to load documents.

                    <br><br>

                    ${error.message}

                </div>

            `;

        return;

    }


    const documentList =
        document.querySelector(
            '.documents'
        );


    if (!data || data.length === 0) {

        documentList.innerHTML = `

            <div class="empty">

                No documents or templates have been added yet.

            </div>

        `;

        return;

    }


    documentList.innerHTML = '';


    data.forEach(
        documentItem => {


            const card =
                document.createElement('div');


            card.className =
                'document-card';


            let deleteButton =
                '';


            // Only Masters see Delete

            if (isMaster) {

                deleteButton = `

                    <button

                        class="delete-button"

                        onclick="deleteDocument('${documentItem.id}')"

                    >

                        DELETE

                    </button>

                `;

            }


            card.innerHTML = `

                <h3>

                    ${documentItem.title}

                </h3>


                <p>

                    ${documentItem.description || ''}

                </p>


                <div class="document-actions">


                    <a

                        class="open-button"

                        href="${documentItem.url}"

                        target="_blank"

                        rel="noopener noreferrer"

                    >

                        OPEN DOCUMENT

                    </a>


                    ${deleteButton}


                </div>

            `;


            documentList.appendChild(
                card
            );

        }
    );

}


// ======================================================
// START PAGE
// ======================================================

checkLogin();


</script>

</body>

</html>

<body>

    <div class="header">

        <div>
            <h1>SCU DOCUMENTS & TEMPLATES</h1>
            <p>Serious Crime Unit — Internal Resources</p>
        </div>

        <button class="back-button" onclick="goBack()">
            ← Back
        </button>

    </div>


    <div class="container">

        <div class="welcome">

            <h2>Documents & Templates</h2>

            <p>
                Access SCU documents, forms and operational templates.
            </p>

        </div>


        <div id="status" class="status"></div>


        <!-- MASTER CONTROLS -->

        <div id="adminControls" class="admin-controls">

            <button
                class="add-button"
                onclick="toggleAddForm()"
            >
                + Upload Document
            </button>


            <!-- UPLOAD FORM -->

            <div id="addForm" class="add-form">

                <h3>Upload New Document</h3>


                <div class="form-group">

                    <label for="documentTitle">
                        Document Title
                    </label>

                    <input
                        type="text"
                        id="documentTitle"
                        placeholder="e.g. Intelligence Report Template"
                    >

                </div>


                <div class="form-group">

                    <label for="documentDescription">
                        Description
                    </label>

                    <textarea
                        id="documentDescription"
                        placeholder="Brief description of the document..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="documentFile">
                        Document File
                    </label>

                    <input
                        type="file"
                        id="documentFile"
                    >

                </div>


                <div class="form-buttons">

                    <button
                        class="save-button"
                        onclick="uploadDocument()"
                    >
                        Upload Document
                    </button>

                    <button
                        class="cancel-button"
                        onclick="toggleAddForm()"
                    >
                        Cancel
                    </button>

                </div>

            </div>


            <!-- EDIT FORM -->

            <div id="editForm" class="edit-form">

                <h3>Edit Document</h3>

                <input
                    type="hidden"
                    id="editDocumentId"
                >

                <input
                    type="hidden"
                    id="editOldFilePath"
                >


                <div class="form-group">

                    <label for="editDocumentTitle">
                        Document Title
                    </label>

                    <input
                        type="text"
                        id="editDocumentTitle"
                    >

                </div>


                <div class="form-group">

                    <label for="editDocumentDescription">
                        Description
                    </label>

                    <textarea
                        id="editDocumentDescription"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="editDocumentFile">
                        Replace File
                    </label>

                    <input
                        type="file"
                        id="editDocumentFile"
                    >

                </div>


                <div class="form-buttons">

                    <button
                        class="save-button"
                        onclick="saveEdit()"
                    >
                        Save Changes
                    </button>

                    <button
                        class="cancel-button"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>

            </div>

        </div>


        <div id="documents" class="documents">

            <div class="loading">
                Loading documents...
            </div>

        </div>

    </div>


    <script>

        /* ========================================================
           SUPABASE
        ======================================================== */

        const SUPABASE_URL =
            "https://mtlozyseibrefhxnocvb.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ========================================================
           SETTINGS
        ======================================================== */

        const DOCUMENTS_TABLE = "documents";

        const STORAGE_BUCKET = "documents";


        let currentUser = null;

        let currentRole = null;


        /* ========================================================
           START
        ======================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                await getCurrentUser();

                await loadDocuments();

            }
        );


        /* ========================================================
           GET USER
        ======================================================== */

        async function getCurrentUser() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getUser();


                if (error) {

                    console.error(
                        "Auth error:",
                        error
                    );

                    return;

                }


                currentUser = data.user;


                if (!currentUser) {

                    showError(
                        "You are not logged in."
                    );

                    return;

                }


                /*
                Get the user's role.

                Your SCU profile table uses:
                profiles
                id
                role
                */

                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select("role")
                        .eq(
                            "id",
                            currentUser.id
                        )
                        .single();


                if (profileError) {

                    console.error(
                        "Profile error:",
                        profileError
                    );

                    return;

                }


                if (profile) {

                    currentRole =
                        String(
                            profile.role || ""
                        ).toLowerCase();

                }


                /*
                MASTER ONLY
                */

                if (
                    currentRole === "master"
                ) {

                    document.getElementById(
                        "adminControls"
                    ).style.display = "block";

                }

            } catch (error) {

                console.error(
                    "User error:",
                    error
                );

            }

        }


        /* ========================================================
           LOAD DOCUMENTS
        ======================================================== */

        async function loadDocuments() {

            const container =
                document.getElementById(
                    "documents"
                );


            container.innerHTML =
                '<div class="loading">Loading documents...</div>';


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from(DOCUMENTS_TABLE)
                        .select("*")
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    console.error(
                        "Documents error:",
                        error
                    );

                    container.innerHTML =
                        '<div class="empty">Unable to load documents.</div>';


                    showError(
                        "Unable to load documents: " +
                        error.message
                    );

                    return;

                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    container.innerHTML =
                        '<div class="empty">No documents have been uploaded yet.</div>';

                    return;

                }


                container.innerHTML = "";


                data.forEach(
                    function (doc) {

                        container.appendChild(
                            createDocumentCard(doc)
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Load error:",
                    error
                );


                container.innerHTML =
                    '<div class="empty">Unable to load documents.</div>';


                showError(
                    "An unexpected error occurred while loading documents."
                );

            }

        }


        /* ========================================================
           CREATE CARD
        ======================================================== */

        function createDocumentCard(doc) {

            const card =
                window.document.createElement(
                    "div"
                );


            card.className =
                "document-card";


            const title =
                escapeHtml(
                    doc.title ||
                    doc.name ||
                    "Untitled Document"
                );


            const description =
                escapeHtml(
                    doc.description ||
                    "SCU document."
                );


            let fileUrl =
                doc.file_url ||
                doc.url ||
                "";


            /*
            Create public URL if only a storage
            path exists.
            */

            if (
                !fileUrl &&
                doc.file_path
            ) {

                const {
                    data
                } =
                    supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .getPublicUrl(
                            doc.file_path
                        );


                fileUrl =
                    data.publicUrl;

            }


            if (
                !fileUrl &&
                doc.storage_path
            ) {

                const {
                    data
                } =
                    supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .getPublicUrl(
                            doc.storage_path
                        );


                fileUrl =
                    data.publicUrl;

            }


            let actions = "";


            if (fileUrl) {

                actions += `

                    <a
                        href="${escapeAttribute(fileUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="open-button"
                    >
                        Open Document
                    </a>

                `;

            }


            /*
            MASTER BUTTONS
            */

            if (
                currentRole === "master"
            ) {

                actions += `

                    <button
                        class="edit-button"
                        onclick="openEdit(
                            '${escapeAttribute(String(doc.id))}',
                            '${escapeAttribute(String(doc.title || doc.name || ""))}',
                            '${escapeAttribute(String(doc.description || ""))}',
                            '${escapeAttribute(String(doc.file_path || doc.storage_path || ""))}'
                        )"
                    >
                        Edit
                    </button>


                    <button
                        class="delete-button"
                        onclick="deleteDocument(
                            '${escapeAttribute(String(doc.id))}',
                            '${escapeAttribute(String(doc.file_path || doc.storage_path || ""))}'
                        )"
                    >
                        Delete
                    </button>

                `;

            }


            card.innerHTML = `

                <h3>${title}</h3>

                <p>${description}</p>

                <div class="document-actions">

                    ${actions}

                </div>

            `;


            return card;

        }


        /* ========================================================
           OPEN EDIT
        ======================================================== */

        function openEdit(
            id,
            title,
            description,
            filePath
        ) {

            if (
                currentRole !== "master"
            ) {

                showError(
                    "Only Master users can edit documents."
                );

                return;

            }


            document.getElementById(
                "editDocumentId"
            ).value = id;


            document.getElementById(
                "editDocumentTitle"
            ).value = title;


            document.getElementById(
                "editDocumentDescription"
            ).value = description;


            document.getElementById(
                "editOldFilePath"
            ).value = filePath;


            document.getElementById(
                "editDocumentFile"
            ).value = "";


            document.getElementById(
                "addForm"
            ).style.display = "none";


            document.getElementById(
                "editForm"
            ).style.display = "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* ========================================================
           CANCEL EDIT
        ======================================================== */

        function cancelEdit() {

            document.getElementById(
                "editForm"
            ).style.display = "none";

        }


        /* ========================================================
           SAVE EDIT
        ======================================================== */

        async function saveEdit() {

            if (
                currentRole !== "master"
            ) {

                showError(
                    "Only Master users can edit documents."
                );

                return;

            }


            const id =
                document.getElementById(
                    "editDocumentId"
                ).value;


            const oldFilePath =
                document.getElementById(
                    "editOldFilePath"
                ).value;


            const title =
                document.getElementById(
                    "editDocumentTitle"
                ).value.trim();


            const description =
                document.getElementById(
                    "editDocumentDescription"
                ).value.trim();


            const fileInput =
                document.getElementById(
                    "editDocumentFile"
                );


            const newFile =
                fileInput.files[0];


            if (!title) {

                showError(
                    "Please enter a document title."
                );

                return;

            }


            try {

                showSuccess(
                    "Saving changes..."
                );


                let updateData = {

                    title: title,

                    description: description

                };


                /*
                If Master selected a replacement
                file, upload it.
                */

                if (newFile) {

                    const newFilePath =
                        Date.now() +
                        "_" +
                        newFile.name.replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                    const {
                        error: uploadError
                    } =
                        await supabaseClient
                            .storage
                            .from(
                                STORAGE_BUCKET
                            )
                            .upload(
                                newFilePath,
                                newFile,
                                {
                                    upsert: false
                                }
                            );


                    if (uploadError) {

                        console.error(
                            uploadError
                        );

                        showError(
                            "Replacement file could not be uploaded: " +
                            uploadError.message
                        );

                        return;

                    }


                    const {
                        data: publicData
                    } =
                        supabaseClient
                            .storage
                            .from(
                                STORAGE_BUCKET
                            )
                            .getPublicUrl(
                                newFilePath
                            );


                    updateData.file_url =
                        publicData.publicUrl;


                    updateData.file_path =
                        newFilePath;


                    /*
                    Delete the old file.
                    */

                    if (oldFilePath) {

                        await supabaseClient
                            .storage
                            .from(
                                STORAGE_BUCKET
                            )
                            .remove([
                                oldFilePath
                            ]);

                    }

                }


                /*
                Update database record.
                */

                const {
                    error: updateError
                } =
                    await supabaseClient
                        .from(
                            DOCUMENTS_TABLE
                        )
                        .update(
                            updateData
                        )
                        .eq(
                            "id",
                            id
                        );


                if (updateError) {

                    console.error(
                        updateError
                    );

                    showError(
                        "Document could not be updated: " +
                        updateError.message
                    );

                    return;

                }


                document.getElementById(
                    "editForm"
                ).style.display = "none";


                showSuccess(
                    "Document updated successfully."
                );


                await loadDocuments();

            } catch (error) {

                console.error(
                    "Edit error:",
                    error
                );


                showError(
                    "An unexpected error occurred while editing the document."
                );

            }

        }


        /* ========================================================
           UPLOAD
        ======================================================== */

        async function uploadDocument() {

            if (
                currentRole !== "master"
            ) {

                showError(
                    "Only Master users can upload documents."
                );

                return;

            }


            const title =
                document.getElementById(
                    "documentTitle"
                ).value.trim();


            const description =
                document.getElementById(
                    "documentDescription"
                ).value.trim();


            const fileInput =
                document.getElementById(
                    "documentFile"
                );


            const file =
                fileInput.files[0];


            if (!title) {

                showError(
                    "Please enter a document title."
                );

                return;

            }


            if (!file) {

                showError(
                    "Please select a document."
                );

                return;

            }


            try {

                showSuccess(
                    "Uploading document..."
                );


                const filePath =
                    Date.now() +
                    "_" +
                    file.name.replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .upload(
                            filePath,
                            file,
                            {
                                upsert: false
                            }
                        );


                if (uploadError) {

                    showError(
                        "Upload failed: " +
                        uploadError.message
                    );

                    return;

                }


                const {
                    data: publicData
                } =
                    supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .getPublicUrl(
                            filePath
                        );


                const fileUrl =
                    publicData.publicUrl;


                const {
                    error: databaseError
                } =
                    await supabaseClient
                        .from(
                            DOCUMENTS_TABLE
                        )
                        .insert([{

                            title: title,

                            description: description,

                            file_url: fileUrl,

                            file_path: filePath

                        }]);


                if (databaseError) {

                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .remove([
                            filePath
                        ]);


                    showError(
                        "Document could not be saved: " +
                        databaseError.message
                    );

                    return;

                }


                document.getElementById(
                    "documentTitle"
                ).value = "";


                document.getElementById(
                    "documentDescription"
                ).value = "";


                document.getElementById(
                    "documentFile"
                ).value = "";


                document.getElementById(
                    "addForm"
                ).style.display = "none";


                showSuccess(
                    "Document uploaded successfully."
                );


                await loadDocuments();

            } catch (error) {

                console.error(
                    error
                );


                showError(
                    "An unexpected error occurred during upload."
                );

            }

        }


        /* ========================================================
           DELETE
        ======================================================== */

        async function deleteDocument(
            id,
            filePath
        ) {

            if (
                currentRole !== "master"
            ) {

                showError(
                    "Only Master users can delete documents."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this document?\n\nThis cannot be undone."
                );


            if (!confirmed) {
                return;
            }


            try {

                showSuccess(
                    "Deleting document..."
                );


                /*
                Delete database record first.
                */

                const {
                    error: databaseError
                } =
                    await supabaseClient
                        .from(
                            DOCUMENTS_TABLE
                        )
                        .delete()
                        .eq(
                            "id",
                            id
                        );


                if (databaseError) {

                    console.error(
                        databaseError
                    );


                    showError(
                        "Document could not be deleted: " +
                        databaseError.message
                    );

                    return;

                }


                /*
                Delete stored file.
                */

                if (filePath) {

                    const {
                        error: storageError
                    } =
                        await supabaseClient
                            .storage
                            .from(
                                STORAGE_BUCKET
                            )
                            .remove([
                                filePath
                            ]);


                    if (storageError) {

                        console.error(
                            "Storage delete error:",
                            storageError
                        );

                    }

                }


                showSuccess(
                    "Document deleted successfully."
                );


                await loadDocuments();


            } catch (error) {

                console.error(
                    error
                );


                showError(
                    "An unexpected error occurred while deleting."
                );

            }

        }


        /* ========================================================
           ADD FORM
        ======================================================== */

        function toggleAddForm() {

            const form =
                document.getElementById(
                    "addForm"
                );


            if (
                form.style.display === "block"
            ) {

                form.style.display = "none";

            } else {

                form.style.display = "block";

                document.getElementById(
                    "editForm"
                ).style.display = "none";

            }

        }


        /* ========================================================
           BACK
        ======================================================== */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }

           MESSAGES
        ======================================================== */

        function showError(message) {

            const status =
                document.getElementById(
                    "status"
                );


            status.className =
                "status error";


            status.textContent =
                message;

        }


        function showSuccess(message) {

            const status =
                document.getElementById(
                    "status"
                );


            status.className =

        /* ========================================================
           HTML SAFETY
        ======================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                );

        }

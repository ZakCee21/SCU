<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCU Documents &amp; Templates</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #080c11; color: #e8edf2; }
        .header { background: #111821; border-bottom: 1px solid #293542; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
        .header-brand { display: flex; align-items: center; gap: 14px; }
        .header-logo { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 21px; letter-spacing: 1.5px; }
        .header p { margin: 5px 0 0; color: #7f8c99; font-size: 11px; }
        .background-logo { position: fixed; top: 50%; width: 275px; height: 275px; object-fit: contain; opacity: .5; z-index: 0; pointer-events: none; }
        .background-logo-left { left: 80px; transform: translateY(-50%); }
        .background-logo-right { right: 80px; transform: translateY(-50%); }
        .back-button { background: #111820; color: #cfd7df; border: 1px solid #354554; padding: 10px 16px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; letter-spacing: .5px; }
        .back-button:hover { background: #1a2530; border-color: #4b6070; }
        .container { max-width: 1400px; margin: auto; padding: 30px; position: relative; z-index: 1; }
        .welcome { margin-bottom: 25px; }
        .welcome h2 { margin: 0 0 6px; }
        .welcome p { color: #7f8c99; margin: 0; }
        .admin-controls { display: none; margin-bottom: 25px; }
        .add-button { background: #166534; color: white; border: 1px solid #22c55e; padding: 11px 17px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .add-button:hover { background: #15803d; }
        .add-form, .edit-form { display: none; background: #111821; border: 1px solid #293542; border-radius: 8px; padding: 22px; margin-top: 15px; max-width: 700px; }
        .add-form h3, .edit-form h3 { margin: 0 0 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 6px; color: #aeb8c2; }
        .form-group input, .form-group textarea { width: 100%; background: #080c11; color: white; border: 1px solid #354554; border-radius: 5px; padding: 10px; font-family: Arial, sans-serif; }
        .form-group textarea { min-height: 90px; resize: vertical; }
        .form-buttons { display: flex; gap: 10px; }
        .save-button { background: #1d4ed8; color: white; border: none; padding: 10px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .save-button:hover { background: #2563eb; }
        .cancel-button { background: #202c38; color: white; border: 1px solid #354554; padding: 10px 16px; border-radius: 5px; cursor: pointer; }
        .status { margin-bottom: 20px; padding: 12px 15px; border-radius: 5px; display: none; font-size: 13px; }
        .status.error { display: block; background: #450a0a; border: 1px solid #991b1b; color: #fecaca; }
        .status.success { display: block; background: #052e16; border: 1px solid #166534; color: #bbf7d0; }
        .loading { color: #7f8c99; padding: 30px 0; }
        .documents { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .document-card { background: #111821; border: 1px solid #293542; border-radius: 8px; padding: 22px; }
        .document-card h3 { margin: 0 0 10px; font-size: 17px; }
        .document-card p { color: #8996a3; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .document-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .open-button { display: inline-block; background: #1d4ed8; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .open-button:hover { background: #2563eb; }
        .edit-button { background: #374151; color: white; border: 1px solid #4b5563; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .edit-button:hover { background: #4b5563; }
        .delete-button { background: #7f1d1d; color: white; border: 1px solid #991b1b; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .delete-button:hover { background: #991b1b; }
        .empty { background: #111821; border: 1px solid #293542; border-radius: 8px; padding: 30px; color: #7f8c99; }
        @media (max-width: 700px) {
            .header { padding: 14px 18px; }
            .header-brand { gap: 10px; }
            .header-logo { width: 42px; height: 42px; }
            .header h1 { font-size: 16px; }
            .header p { font-size: 9px; }
            .back-button { padding: 8px 10px; font-size: 10px; }
            .container { padding: 20px 15px; }
            .documents { grid-template-columns: 1fr; }
            .background-logo { width: 130px; height: 130px; opacity: .25; }
            .background-logo-left { left: -45px; }
            .background-logo-right { right: -45px; }
        }
    </style>
</head>
<body>
    <img class="background-logo background-logo-left" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="">
    <img class="background-logo background-logo-right" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="">

    <div class="header">
        <div class="header-brand">
            <img class="header-logo" src="https://r2.fivemanage.com/PtUBr7btDsJIJroZ84fAB/SCU.webp" alt="SCU Logo">
            <div>
                <h1>SCU DOCUMENTS &amp; TEMPLATES</h1>
                <p>STREET CRIMES UNIT • INTERNAL RESOURCES</p>
            </div>
        </div>
        <button type="button" class="back-button" onclick="goBack()">← BACK TO DASHBOARD</button>
    </div>

    <div class="container" id="pageContent" style="visibility:hidden">
        <div class="welcome">
            <h2>Documents &amp; Templates</h2>
            <p>Access SCU documents, forms and operational templates.</p>
        </div>
        <div id="status" class="status"></div>

        <div id="adminControls" class="admin-controls">
            <button class="add-button" onclick="toggleAddForm()">+ Upload Document</button>
            <div id="addForm" class="add-form">
                <h3>Upload New Document</h3>
                <div class="form-group">
                    <label for="documentTitle">Document Title</label>
                    <input type="text" id="documentTitle" placeholder="e.g. Intelligence Report Template">
                </div>
                <div class="form-group">
                    <label for="documentDescription">Description</label>
                    <textarea id="documentDescription" placeholder="Brief description of the document..."></textarea>
                </div>
                <div class="form-group">
                    <label for="documentFile">Document File</label>
                    <input type="file" id="documentFile">
                </div>
                <div class="form-buttons">
                    <button class="save-button" onclick="uploadDocument()">Upload Document</button>
                    <button class="cancel-button" onclick="toggleAddForm()">Cancel</button>
                </div>
            </div>

            <div id="editForm" class="edit-form">
                <h3>Edit Document</h3>
                <input type="hidden" id="editDocumentId">
                <input type="hidden" id="editOldFilePath">
                <div class="form-group">
                    <label for="editDocumentTitle">Document Title</label>
                    <input type="text" id="editDocumentTitle">
                </div>
                <div class="form-group">
                    <label for="editDocumentDescription">Description</label>
                    <textarea id="editDocumentDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="editDocumentFile">Replace File</label>
                    <input type="file" id="editDocumentFile">
                </div>
                <div class="form-buttons">
                    <button class="save-button" onclick="saveEdit()">Save Changes</button>
                    <button class="cancel-button" onclick="cancelEdit()">Cancel</button>
                </div>
            </div>
        </div>

        <div id="documents" class="documents">
            <div class="loading">Checking your SCU access...</div>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://mtlozyseibrefhxnocvb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IdOfodEMDP68oUfwh2KKWg_Z1wExmJ1";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DOCUMENTS_TABLE = "documents";
const STORAGE_BUCKET = "documents";
const SIGNED_URL_SECONDS = 3600;

let currentUser = null;
let currentRole = null;
let currentOfficerActive = false;
let accessVerified = false;

 document.addEventListener("DOMContentLoaded", async function () {
    const allowed = await getCurrentUser();
    if (!allowed) return;
    accessVerified = true;
    document.getElementById("pageContent").style.visibility = "visible";
    await loadDocuments();
});

async function getCurrentUser() {
    try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) {
            console.error("Session error:", sessionError);
            showError("Unable to check your login session. Please try logging in again.");
            document.getElementById("pageContent").style.visibility = "visible";
            return false;
        }
        if (!session) {
            window.location.replace("index.html");
            return false;
        }

        currentUser = session.user;
        const { data: officer, error: officerError } = await supabaseClient
            .from("officers")
            .select("role, active")
            .eq("id", currentUser.id)
            .single();

        if (officerError || !officer) {
            console.error("Load officer role error:", officerError);
            showError("Unable to verify your SCU permissions. Access to documents has been blocked.");
            document.getElementById("pageContent").style.visibility = "visible";
            return false;
        }

        currentRole = String(officer.role || "").trim().toLowerCase();
        currentOfficerActive = officer.active === true;
        console.log("Documents page role:", currentRole, "Active:", currentOfficerActive);

        if (!currentOfficerActive) {
            window.location.replace("index.html");
            return false;
        }

        if (currentRole === "probationary") {
            window.location.replace("dashboard.html");
            return false;
        }

        if (currentRole === "master") {
            document.getElementById("adminControls").style.display = "block";
        }
        return true;
    } catch (error) {
        console.error("User verification error:", error);
        showError("Unable to verify your account. Access to documents has been blocked.");
        document.getElementById("pageContent").style.visibility = "visible";
        return false;
    }
}

async function loadDocuments() {
    if (!accessVerified || !currentUser || !currentOfficerActive || currentRole === "probationary") return;
    const container = document.getElementById("documents");
    container.innerHTML = '<div class="loading">Loading documents...</div>';
    try {
        const { data, error } = await supabaseClient.from(DOCUMENTS_TABLE).select("*").order("created_at", { ascending: false });
        if (error) {
            console.error("Documents error:", error);
            container.innerHTML = '<div class="empty">Unable to load documents.</div>';
            showError("Unable to load documents: " + error.message);
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty">No documents have been uploaded yet.</div>';
            return;
        }
        container.innerHTML = "";
        const cards = await Promise.all(data.map(doc => createDocumentCard(doc)));
        cards.forEach(card => container.appendChild(card));
    } catch (error) {
        console.error("Load error:", error);
        container.innerHTML = '<div class="empty">Unable to load documents.</div>';
        showError("An unexpected error occurred while loading documents.");
    }
}

async function createDocumentCard(doc) {
    const card = window.document.createElement("div");
    card.className = "document-card";
    const title = escapeHtml(doc.title || doc.name || "Untitled Document");
    const description = escapeHtml(doc.description || "SCU document.");
    const filePath = doc.file_path || doc.storage_path || "";
    let fileUrl = "";

    if (filePath) {
        const { data, error } = await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(filePath, SIGNED_URL_SECONDS);
        if (error) {
            console.error("Unable to create document link:", error);
        } else {
            fileUrl = data.signedUrl;
        }
    } else if (doc.file_url || doc.url) {
        // Retain compatibility with existing externally hosted document links.
        fileUrl = doc.file_url || doc.url;
    }

    let actions = "";
    if (fileUrl) {
        actions += `<a href="${escapeAttribute(fileUrl)}" target="_blank" rel="noopener noreferrer" class="open-button">Open Document</a>`;
    } else {
        actions += '<span style="color:#8996a3;font-size:12px">File link unavailable</span>';
    }

    if (currentRole === "master") {
        const safeId = escapeAttribute(String(doc.id));
        const safeTitle = escapeAttribute(String(doc.title || doc.name || ""));
        const safeDescription = escapeAttribute(String(doc.description || ""));
        const safePath = escapeAttribute(String(filePath));
        actions += `<button class="edit-button" onclick="openEdit('${safeId}','${safeTitle}','${safeDescription}','${safePath}')">Edit</button>`;
        actions += `<button class="delete-button" onclick="deleteDocument('${safeId}','${safePath}')">Delete</button>`;
    }

    card.innerHTML = `<h3>${title}</h3><p>${description}</p><div class="document-actions">${actions}</div>`;
    return card;
}

function openEdit(id, title, description, filePath) {
    if (!isActiveMaster()) { showError("Only active Master users can edit documents."); return; }
    document.getElementById("editDocumentId").value = id;
    document.getElementById("editDocumentTitle").value = title;
    document.getElementById("editDocumentDescription").value = description;
    document.getElementById("editOldFilePath").value = filePath;
    document.getElementById("editDocumentFile").value = "";
    document.getElementById("addForm").style.display = "none";
    document.getElementById("editForm").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() { document.getElementById("editForm").style.display = "none"; }

async function saveEdit() {
    if (!isActiveMaster()) { showError("Only active Master users can edit documents."); return; }
    const id = document.getElementById("editDocumentId").value;
    const oldFilePath = document.getElementById("editOldFilePath").value;
    const title = document.getElementById("editDocumentTitle").value.trim();
    const description = document.getElementById("editDocumentDescription").value.trim();
    const fileInput = document.getElementById("editDocumentFile");
    const newFile = fileInput.files[0];
    if (!title) { showError("Please enter a document title."); return; }

    let uploadedFilePath = "";
    try {
        showSuccess("Saving changes...");
        const updateData = { title, description };
        if (newFile) {
            uploadedFilePath = makeStorageFilePath(newFile);
            const { error: uploadError } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(uploadedFilePath, newFile, { upsert: false });
            if (uploadError) { showError("Replacement file could not be uploaded: " + uploadError.message); return; }
            updateData.file_path = uploadedFilePath;
            // Keep the existing column populated for compatibility; private files use signed URLs in the page.
            updateData.file_url = "";
        }

        const { error: updateError } = await supabaseClient.from(DOCUMENTS_TABLE).update(updateData).eq("id", id);
        if (updateError) {
            console.error(updateError);
            if (uploadedFilePath) await supabaseClient.storage.from(STORAGE_BUCKET).remove([uploadedFilePath]);
            showError("Document could not be updated: " + updateError.message);
            return;
        }

        if (newFile && oldFilePath) {
            const { error: removeError } = await supabaseClient.storage.from(STORAGE_BUCKET).remove([oldFilePath]);
            if (removeError) console.error("Old document file could not be removed:", removeError);
        }
        document.getElementById("editForm").style.display = "none";
        showSuccess("Document updated successfully.");
        await loadDocuments();
    } catch (error) {
        console.error("Edit error:", error);
        if (uploadedFilePath) await supabaseClient.storage.from(STORAGE_BUCKET).remove([uploadedFilePath]);
        showError("An unexpected error occurred while editing the document.");
    }
}

async function uploadDocument() {
    if (!isActiveMaster()) { showError("Only active Master users can upload documents."); return; }
    const title = document.getElementById("documentTitle").value.trim();
    const description = document.getElementById("documentDescription").value.trim();
    const fileInput = document.getElementById("documentFile");
    const file = fileInput.files[0];
    if (!title) { showError("Please enter a document title."); return; }
    if (!file) { showError("Please select a document."); return; }

    let filePath = "";
    try {
        showSuccess("Uploading document...");
        filePath = makeStorageFilePath(file);
        const { error: uploadError } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(filePath, file, { upsert: false });
        if (uploadError) { showError("Upload failed: " + uploadError.message); return; }

        const { error: databaseError } = await supabaseClient.from(DOCUMENTS_TABLE).insert([{
            title,
            description,
            file_url: "",
            file_path: filePath
        }]);
        if (databaseError) {
            await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
            showError("Document could not be saved: " + databaseError.message);
            return;
        }

        document.getElementById("documentTitle").value = "";
        document.getElementById("documentDescription").value = "";
        fileInput.value = "";
        document.getElementById("addForm").style.display = "none";
        showSuccess("Document uploaded successfully.");
        await loadDocuments();
    } catch (error) {
        console.error(error);
        if (filePath) await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
        showError("An unexpected error occurred during upload.");
    }
}

async function deleteDocument(id, filePath) {
    if (!isActiveMaster()) { showError("Only active Master users can delete documents."); return; }
    if (!confirm("Are you sure you want to delete this document?\n\nThis cannot be undone.")) return;
    try {
        showSuccess("Deleting document...");
        const { error: databaseError } = await supabaseClient.from(DOCUMENTS_TABLE).delete().eq("id", id);
        if (databaseError) {
            console.error(databaseError);
            showError("Document could not be deleted: " + databaseError.message);
            return;
        }
        if (filePath) {
            const { error: storageError } = await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
            if (storageError) console.error("Storage delete error:", storageError);
        }
        showSuccess("Document deleted successfully.");
        await loadDocuments();
    } catch (error) {
        console.error(error);
        showError("An unexpected error occurred while deleting.");
    }
}

function makeStorageFilePath(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    return Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + safeName;
}

function isActiveMaster() {
    return accessVerified && currentUser && currentOfficerActive && currentRole === "master";
}

function toggleAddForm() {
    if (!isActiveMaster()) { showError("Only active Master users can upload documents."); return; }
    const form = document.getElementById("addForm");
    if (form.style.display === "block") {
        form.style.display = "none";
    } else {
        form.style.display = "block";
        document.getElementById("editForm").style.display = "none";
    }
}

function goBack() { window.location.href = "dashboard.html"; }

function showError(message) {
    const status = document.getElementById("status");
    status.className = "status error";
    status.textContent = message;
}

function showSuccess(message) {
    const status = document.getElementById("status");
    status.className = "status success";
    status.textContent = message;
    setTimeout(function () { status.className = "status"; }, 5000);
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, " ")
        .replace(/\n/g, " ");
}
</script>
</body>
</html>
